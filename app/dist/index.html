rations": ["gpt-3.5/4-era", "json-mode/function-calling-era", "constrained-decoding-2026"], "referenced_by": ["B4", "D1"], "curators": ["platform-owner"], "title": "Evolution Entry: Structured Outputs (Prose Asks → JSON Mode → Schema-Enforced Contracts)"}, "html": "<h1>Evolution Entry: Structured Outputs (Prose Asks → JSON Mode → Schema-Enforced Contracts)<\/h1>\n<h2>Current guidance (teach this today)<\/h2>\n<p>Define the schema before you prompt (the B4 rule — unchanged). Then pick the enforcement level by stakes:<\/p>\n<ol>\n<li><strong>Prompt-level formatting<\/strong> (\"respond as a markdown table\") — fine for human-readable output a person will review anyway.<\/li>\n<li><strong>Tool-use / function-calling patterns<\/strong> — high reliability; pair with a code-side validator (Pydantic/Zod-style) as the safety net.<\/li>\n<li><strong>Native constrained decoding<\/strong> — guaranteed schema-valid output; the production default in 2026 where a machine consumes the result.<\/li>\n<\/ol>\n<p>Two disciplines matter more than the enforcement level:<\/p>\n<ul>\n<li><strong>Reason first, format second.<\/strong> Rigid schemas imposed on the whole generation measurably degrade reasoning. Either put a free-text reasoning field <em>before<\/em> the answer fields (constrained models generate fields in order), or decouple entirely: generate freeform, then reformat in a second pass. Constraining only the final answer is nearly free in quality terms.<\/li>\n<li><strong>Valid ≠ correct.<\/strong> Constrained decoding guarantees the shape, never the content. A schema-perfect JSON can still contain invented values — the false-confidence trap. A linter catches type errors; only a human who knows the product catches invented content (B4's validation rule survives every era).<\/li>\n<\/ul>\n<p>Schema design rules that hold in 2026: make fields optional when the data might not exist (forcing a required field invites hallucinated values), and split very large schemas into multiple extraction calls rather than one giant object.<\/p>\n<h2>Eras<\/h2>\n<h3>Era 1 — Prose formatting asks (~2022–2023)<\/h3>\n<p>No enforcement existed. Practice was \"respond only in JSON, no commentary,\" then regex extraction, then retry-until-it-parses loops. Reliability was a prompt-wording problem, so teams accumulated superstition (\"threaten the model,\" \"bribe it\") instead of contracts. Model context: chat-era models had no format guarantees at the decoding layer; every consumer had to be defensive.<\/p>\n<h3>Era 2 — JSON mode and function calling (2023–2024)<\/h3>\n<p>Vendors moved the guarantee into the API: function calling (OpenAI, mid-2023), then JSON mode (late 2023) guaranteed <em>parseable<\/em> JSON but not <em>your schema<\/em> — fields could still be missing, renamed, or mistyped. OpenAI's Structured Outputs (August 2024) crossed the line to schema conformance via constrained decoding. The practice shift: schemas moved from the prompt text into the API call, and \"parse-and-pray\" started reading as a fossil.<\/p>\n<h3>Era 3 — Schema-enforced contracts and the reason-then-format discipline (2025–2026)<\/h3>\n<p>Constrained decoding became infrastructure: grammar backends (e.g., XGrammar) are now the default in mainstream serving stacks (vLLM, SGLang, TensorRT-LLM), and structured output is a checkbox, not an engineering project. With enforcement solved, attention moved to what enforcement <em>costs<\/em>: research quantified 10–30% reasoning degradation when strict format constraints are imposed too early (\"the constraint tax\" / \"format tax\"), producing the current discipline — reasoning fields first, or decoupled two-pass generation. Provider differences persist: some offer full constrained decoding; others (tool-use patterns) offer near-guarantees that still warrant a code-side validator. Schemas themselves became <strong>interface contracts between agents and tools<\/strong> — the D1 tool-inventory pattern — not just output formatting.<\/p>\n<h2>Deprecated patterns (stop teaching these)<\/h2>\n<ul>\n<li>❌ <strong>Prompt-and-pray JSON with regex repair<\/strong> — enforcement belongs in the API/decoding layer, not in string cleanup.<\/li>\n<li>❌ <strong>Retry-until-it-parses loops<\/strong> — a cost-multiplier that constrained decoding made obsolete.<\/li>\n<li>❌ <strong>One giant schema for a complex extraction<\/strong> — split into multiple calls; massive single schemas degrade field accuracy.<\/li>\n<li>❌ <strong>Constraining the entire generation, reasoning included<\/strong> — this is where the 10–30% quality loss lives; constrain the answer, not the thinking.<\/li>\n<li>❌ <strong>Treating schema-valid output as verified output<\/strong> — validity is shape; correctness is content. The human check survives.<\/li>\n<\/ul>\n<h2>What survived<\/h2>\n<p>The B4 workflow survives intact across all three eras: define the schema first, provide the structured description, validate before downstream use. What changed is only <em>who enforces the schema<\/em> — the prompt (Era 1), the API (Era 2), the decoder (Era 3). Human content validation — catching invented values a linter can't see — has never been automated away, and schema-first thinking got <em>more<\/em> valuable as schemas became agent-to-tool contracts.<\/p>\n<h2>Boundary conditions (where older practice is still correct)<\/h2>\n<ul>\n<li><strong>Small local models pay the constraint tax hardest<\/strong> — they need the scratchpad most. For the local layer of a multi-model stack, always use reasoning-first fields or two-pass decoupling; naive constrained decoding quietly costs the most exactly where it looks free (the rowboat needs the most care, not the least).<\/li>\n<li><strong>Prompt-level formatting is still right for human-consumed output<\/strong> — a table in a chat reply needs no schema; escalating every format ask to constrained decoding is over-engineering (and rung-3 thinking applied to a rung-1 task).<\/li>\n<li><strong>Tool-use-pattern providers<\/strong> — where full constrained decoding isn't offered, Era-2 discipline (validator as safety net) remains correct practice, not a fossil.<\/li>\n<\/ul>\n<h2>Signals to watch (would trigger Era 4)<\/h2>\n<ul>\n<li>Providers eliminating the reasoning tax (extended thinking + constrained answers unified) — would retire the two-pass discipline.<\/li>\n<li>Schema negotiation between agents (schemas generated and agreed at runtime) — would move the unit of curation from \"output contract\" to \"protocol design.\"<\/li>\n<li>Measured convergence of tool-use patterns to true 100% conformance — would collapse enforcement levels 2 and 3.<\/li>\n<\/ul>\n<h2>Sources<\/h2>\n<ul>\n<li><a href=\"https://arxiv.org/abs/2501.10868\">JSONSchemaBench: A Rigorous Benchmark of Structured Outputs for Language Models<\/a> (arXiv 2501, Jan 2025) — constrained-decoding efficacy/coverage across engines.<\/li>\n<li><a href=\"https://arxiv.org/pdf/2605.26128\">The Constraint Tax: Measuring Validity-Correctness Tradeoffs in Structured Outputs for Small Language Models<\/a> (arXiv 2605, 2026) — small-model reasoning degradation under rigid schemas.<\/li>\n<li><a href=\"https://arxiv.org/pdf/2604.03616\">The Format Tax<\/a> (arXiv 2604, 2026) and <a href=\"https://arxiv.org/html/2601.07525v2\">Thinking Before Constraining: A Unified Decoding Framework<\/a> (arXiv 2601, 2026) — reason-then-format findings; constraining final answers is nearly free.<\/li>\n<li><a href=\"https://boundaryml.com/blog/structured-outputs-create-false-confidence\">Structured Outputs Create False Confidence<\/a> (BAML blog) — valid ≠ correct.<\/li>\n<li><a href=\"https://dev.to/pockit_tools/llm-structured-output-in-2026-stop-parsing-json-with-regex-and-do-it-right-34pk\">LLM Structured Output in 2026: Stop Parsing JSON with Regex<\/a> (2026) — three enforcement levels, provider comparison, schema-design rules (reasoning fields first, optional fields, split schemas).<\/li>\n<li>Vendor docs (OpenAI Structured Outputs, Anthropic tool use) — re-verify enforcement guarantees at each quarterly review.<\/li>\n<\/ul>"}, "token-economics": {"meta": {"id": "token-economics", "practice": "Token Economics / AI Cost Engineering", "status": "current", "last_reviewed": "2026-07-10", "review_cadence": "quarterly", "model_generations": ["flat-pricing-era", "metering-awareness-era", "cost-architecture-2026"], "referenced_by": ["A4", "A2E", "C2", "C5"], "curators": ["platform-owner"], "title": "Evolution Entry: Token Economics (Flat-Pricing Intuitions → Metering Discipline → Cost Architecture)"}, "html": "<h1>Evolution Entry: Token Economics (Flat-Pricing Intuitions → Metering Discipline → Cost Architecture)<\/h1>\n<h2>Current guidance (teach this today)<\/h2>\n<p>AI cost is an <strong>architecture property, not a usage behavior<\/strong>. Individual discipline (refine before metering, context files before agentic sessions) still matters — but as of 2026 the big money moves in design decisions made before anyone types a prompt:<\/p>\n<ul>\n<li><strong>The input tax is real and structural.<\/strong> Tool schemas, context files, and conversation history are all billed input, every turn. A dense tool integration can consume tens of thousands of tokens before the first user question — statically loading a large enterprise tool suite (e.g., the 60+ tool Atlassian MCP server) costs ~47,000 tokens up front, and production agents have been observed spending up to ~79% of their context budget on their own tooling (as of 2026-07; see Sources).<\/li>\n<li><strong>Caching changes the math but is fragile.<\/strong> Cache reads are billed at roughly 10% of the standard input rate (writes at a 1.25–2× premium), which makes persistent agents viable — but the cache is a byte-exact prefix match. Dynamic system prompts, model switching, or mid-session tool toggling silently invalidate it and restore full price.<\/li>\n<li><strong>Progressive disclosure beats bigger windows.<\/strong> Deferring tool schemas until needed (meta-tool / dynamic discovery patterns) cuts upfront schema cost from ~47,000 to ~400–600 tokens. Filtering API payloads at a gateway strips up to ~90% of response dead weight (a raw ~30 KB Jira ticket ≈ 7,500 tokens at ~250 tokens/KB of JSON).<\/li>\n<li><strong>Data-layer choices dominate data-adjacent AI.<\/strong> For AI-over-data architectures, storage format and partitioning move costs more than any prompt: columnar conversion (Parquet) reduces file size up to ~87% and scan-based query cost by up to ~99.7% (per AWS-published figures, 2026).<\/li>\n<li><strong>Model tiering is a cost tool.<\/strong> Route narrow repetitive work to small/cheap models and reserve frontier models for reasoning — the rowboat/speedboat rule (see prompting-frameworks, Boundary conditions).<\/li>\n<\/ul>\n<p>All specific numbers above are dated snapshots — that's this entry's job. Lessons teach the patterns; this entry holds the figures and re-verifies them quarterly.<\/p>\n<h2>Eras<\/h2>\n<h3>Era 1 — Flat-pricing intuitions (~2022–2024)<\/h3>\n<p>Teams reasoned about AI spend the way they reasoned about SaaS: per-seat licenses, flat subscriptions, \"we already pay for it.\" Chat interfaces felt free at the margin, so cost never entered workflow design. The era's legacy fossil is the license mental model applied to metered inference — budgeting AI like Office seats when consumption actually scales with architecture and usage patterns.<\/p>\n<h3>Era 2 — Metering awareness and personal discipline (~2024–2025)<\/h3>\n<p>Token-based API pricing entered team consciousness: input/output asymmetry, context-as-cost, the discovery that agentic sessions burn tokens re-learning what nobody wrote down. Practice responded at the <em>individual<\/em> level: refinement-first rules (compress intent in a cheap window before opening a metered tool), context files to stop paying for re-explanation, \"treat chat as free, agents as metered.\" This is the C2/A4 layer of the platform — still correct, still taught.<\/p>\n<h3>Era 3 — Cost architecture (2025–2026)<\/h3>\n<p>Costs moved from the person to the platform. Prompt caching made persistent agents economically viable while making prompt <em>stability<\/em> an engineering requirement. The input tax of tool ecosystems (MCP-era schema injection) became a first-class design constraint, answered by progressive disclosure and gateway payload filtering. For AI-over-data systems, cost analysis expanded to the whole stack: storage format, partitioning, scan pricing, egress modeling, concurrency. The unit of optimization is no longer the prompt or even the workflow — it's the architecture, evaluated with TCO methods that finance already recognizes.<\/p>\n<h2>Deprecated patterns (stop teaching these)<\/h2>\n<ul>\n<li>❌ <strong>Budgeting metered AI like per-seat licenses<\/strong> — consumption scales with architecture and cadence, not headcount.<\/li>\n<li>❌ <strong>Prompt wordsmithing as the primary cost lever<\/strong> — trimming twenty tokens of phrasing while statically loading 47,000 tokens of tool schemas is bailing with a teaspoon.<\/li>\n<li>❌ <strong>\"The window is big enough\" as a cost strategy<\/strong> — bigger windows raise the ceiling on waste; effective utilization degrades as they fill (see context-engineering).<\/li>\n<li>❌ <strong>Retry-until-it-works loops as error handling<\/strong> — a cost multiplier; push error recovery into the tool/gateway layer.<\/li>\n<li>❌ <strong>Optimizing context mid-session at the expense of cache stability<\/strong> — removing tools or mutating the system prompt to \"save tokens\" can trigger full-price recomputation of everything downstream.<\/li>\n<\/ul>\n<h2>What survived<\/h2>\n<p>Era 2's personal disciplines survive intact as the rung-1/2 curriculum layer: A4's two-question test, A2E's context-file rule, C2's refinement-first rule and three-term ROI (time saved − usage cost − maintenance). Cost architecture doesn't replace them; it's what they grow into at platform scale. D5 teaches leaders the same three terms as funding questions.<\/p>\n<h2>Boundary conditions (where older practice is still correct)<\/h2>\n<ul>\n<li><strong>Tier 1/2 individual chat use is effectively flat-rate.<\/strong> Subscription chat tools make token accounting irrelevant for personal drafting/summarizing — teaching token math to a Tier 1 learner is a staircase leap and actively harmful to habit formation. The discipline begins where metering begins: APIs, agentic tools, platform workflows.<\/li>\n<li><strong>Small local models invert the ledger.<\/strong> Per-token cost approaches zero; the costs move to hardware, latency, and quality risk. Era-1 \"it's basically free\" intuitions are locally true there — the governance concern shifts from spend to output quality (see prompting-frameworks, rowboat layer).<\/li>\n<li><strong>Low-volume integrations may not warrant cost architecture.<\/strong> A tool called weekly doesn't need progressive disclosure and a Rust gateway; Era 2 discipline plus caching defaults is proportionate. Cost architecture earns its complexity at continuous/production cadence.<\/li>\n<\/ul>\n<h2>Signals to watch (would trigger Era 4)<\/h2>\n<ul>\n<li>Flat-rate or bundled agentic pricing at enterprise scale (would partially resurrect Era-1 budgeting, legitimately).<\/li>\n<li>Vendor-managed context/caching that self-optimizes (auto-compaction, automatic prefix management) — would absorb the stability disciplines into the platform.<\/li>\n<li>Inference cost collapsing toward the edge (capable local models for most work) — would shift the entry's center of gravity from tokens to orchestration and quality economics.<\/li>\n<\/ul>\n<h2>Sources<\/h2>\n<ul>\n<li><code>research/Jira MCP Token Impact Analysis.md<\/code> (owner research, 2026-07) — input tax (~47K tokens static loading; 500–1,400 tokens/schema; ~79% context-on-tooling), caching mechanics and invalidation, progressive disclosure (~400–600 tokens), payload filtering (~90%), ~250 tokens/KB JSON heuristic, latency ~0.24 ms/input token.<\/li>\n<li><code>research/Jira Data Cost and Integration Analysis.md<\/code> (owner research, 2026-07) — lakehouse economics: Parquet ~87% size / up to 34× speed / ~99.7% scan-cost reduction (AWS-published), Athena scan pricing model, text-to-SQL accuracy ranges (benchmark-fragile; production-viable with schema access).<\/li>\n<li><code>research/Azure PostgreSQL Jira Data Cost Analysis.md<\/code> (owner research, 2026-07) — egress modeling (first 100 GB/mo free tier; $0.09/GB first 10 TB as of writing), Delta Sharing / deep-clone patterns to minimize cross-cloud movement, ODS TCO framing.<\/li>\n<li>Parked numeric claims adopted from <code>docs/open-questions.md<\/code> (A4/A2E/C2 removals, 2026-07-10) — now dated and homed here.<\/li>\n<li>Vendor pricing pages (Anthropic, OpenAI, AWS, Azure) — re-verify all figures at each quarterly review; pricing is the most volatile claim class in this library.<\/li>\n<\/ul>"}}, "diagnostic": {"id": "monday-morning-diagnostic", "version": "1.1", "source": "docs/maturity-model.md — Placement: the Monday-Morning Diagnostic", "principle": "Place by observed behavior, not self-assessment. Self-assessment over-places almost everyone. Every question demands evidence, not opinion.", "checks": [{"id": "q1_unprompted_use", "question": "Did you reach for an AI tool this week without being told or reminded to?", "evidencePrompt": "Tell me about the last time. What was the task?", "options": ["no", "yes"]}, {"id": "q2_prompt_shape", "question": "When you ask an AI for something, do you routinely tell it the context, the task, and who the output is for?", "evidencePrompt": "Show me (or recite) a recent prompt you actually used.", "options": ["no", "yes"]}, {"id": "q3_reuse", "question": "Do you use a prompt library or shared templates — and do you maintain or curate one?", "evidencePrompt": "Show me the library. When was it last updated, and by whom?", "options": ["none", "use", "maintain"]}, {"id": "q4_workflow_design", "question": "Have you defined a repeatable AI workflow that someone else runs?", "evidencePrompt": "Who runs it? Show me the documentation they run it from.", "options": ["no", "yes"]}, {"id": "q5_system_design", "question": "Have you built schemas, evaluation pipelines, or governance that others operate within?", "evidencePrompt": "Show me the artifact and name one person constrained by it.", "options": ["no", "yes"]}], "placementRule": {"type": "conjunctive-ladder", "description": "A tier is awarded only when its gate AND every lower gate passes. Higher-tier answers with failed lower gates are disregarded for placement (ambiguity routes to the lower tier by rule) and emitted as flags for coach follow-up.", "gates": {"tier2": "q1_unprompted_use == 'yes' AND q2_prompt_shape == 'yes'", "tier3": "tier2 AND q3_reuse == 'maintain' AND q4_workflow_design == 'yes'", "tier4": "tier3 AND q5_system_design == 'yes'"}, "resolution": "tier = 4 if tier4 else 3 if tier3 else 2 if tier2 else 1"}, "flags": [{"id": "orphan_system_design", "when": "q5_system_design == 'yes' AND placement < 4", "meaning": "Claims system design without the fluency ladder beneath it. Verify the artifact — possible over-claim, or possible mis-scored lower checks."}, {"id": "orphan_workflow_design", "when": "q4_workflow_design == 'yes' AND placement < 3", "meaning": "Claims a workflow others run, but doesn't maintain a library or lacks Tier 2 habits. Ask who actually runs it."}, {"id": "orphan_curation", "when": "q3_reuse == 'maintain' AND placement < 2", "meaning": "Curates a library without unprompted use or structured prompts. Likely inherited ownership rather than practice — verify the update history."}], "routing": {"description": "recommendedCourse = routing[tier][roleId]. Course is the bridge that STARTS at the placed tier.", "tiers": {"1": {"pm": "aware-foundations", "coach": "aware-foundations", "designer": "aware-foundations", "leader": "aware-foundations", "engineer": "aware-eng", "tl": "aware-eng", "data": "aware-eng"}, "2": {"pm": "enabled-pm", "coach": "enabled-pm", "designer": "enabled-design", "leader": "leader-literacy", "engineer": "enabled-eng", "tl": "enabled-eng", "data": "enabled-eng"}, "3": {"pm": "fluent-chains", "designer": "fluent-chains", "engineer": "fluent-chains", "data": "fluent-chains", "coach": "native-systems", "tl": "native-systems", "leader": "native-systems"}, "4": {"pm": "native-systems", "coach": "native-systems", "designer": "native-systems", "leader": "native-systems", "engineer": "native-systems", "tl": "native-systems", "data": "native-systems"}}, "notes": {"leader_tier2": "A leader placed at Tier 2 has hit the habits half of their target (Tier 2 + Tier 4 literacy, per the role×tier matrix); the remaining program is the literacy strand. Routes to leader-literacy (D5–D7). Interim enabled-pm route retired 2026-07-10 when BACKLOG 5 shipped.", "tier3_non_coach_track": "pm/designer/engineer/data placed at Tier 3 route to fluent-chains for artifact certification — placement is behavioral, but tier standing requires the artifacts (assessment = artifacts + observed behavior). tl/leader/coach route to native-systems, their 3→4 bridge.", "tier4": "All roles route to native-systems. Roles outside its roleIds (pm/designer/engineer/data) join as case-study contributors / Evolution Library curator candidates rather than cohort members — coach discretion, but the course id is always valid."}}}, "teasers": {"id": "architect-zone-teasers", "version": "1.1", "purpose": "Interest-gathering stubs for the Tier 4 architect-track depth (BACKLOG 6, deferred by owner decision 2026-07-10). Clickable marketing cards, not lessons. Every click is a demand signal — see docs/interest-capture.md for what the signals decide. Teaser topics informed by the Quantic MSAIE Class of Nov 2027 cohort syllabus (owner-provided, 2026-07).", "zoneTitle": "The Architect Track — In the Workshop", "zoneIntro": "The deep end of the platform: designing, evaluating, and governing AI systems at production scale. These modules are being built from real platform work — not textbook exercises. Tap what you'd take. We build in order of demand.", "teasers": [{"id": "t-case-platform", "title": "Case Study: Building This Platform", "hook": "The learning platform you're using was designed, evaluated, and governed with the exact practices it teaches. Walk through the real decisions — including the ones that went wrong.", "plannedTier": "native", "audience": ["tl", "leader", "coach", "engineer"], "backlogRef": "BACKLOG 6 (owner-authored case study)", "status": "interest-gathering"}, {"id": "t-eval-harness", "title": "Capstone Lab: Design an Evaluation Harness", "hook": "Pick one workflow your team runs with AI today. Leave with a working eval pipeline that tells you — before your users do — when it quietly gets worse.", "plannedTier": "native", "audience": ["tl", "engineer", "data"], "backlogRef": "BACKLOG 6 (capstone)", "status": "interest-gathering"}, {"id": "t-governance-drill", "title": "Governance Drill: The Model Update That Breaks Things", "hook": "A tabletop exercise: the vendor ships a model update overnight and three of your AI workflows start behaving differently. Who notices, who decides, who rolls back? Find out before it's real.", "plannedTier": "native", "audience": ["tl", "leader", "coach"], "backlogRef": "BACKLOG 6 (governance simulation)", "status": "interest-gathering"}, {"id": "t-agentic-workflows", "title": "Agentic Workflow Engineering", "hook": "Beyond chains: planner, implementer, tester, reviewer — designing multi-agent workflows with bounded scopes, tool contracts, and failure protocols that survive contact with production.", "plannedTier": "native", "audience": ["tl", "engineer", "data"], "backlogRef": "Quantic MSAIE capability area; agent-orchestration Evolution Library entry (published 2026-07-10)", "status": "interest-gathering"}, {"id": "t-foundation-integration", "title": "Foundation Model Integration Patterns", "hook": "Model selection, fallback tiers, caching, and the rowboat-vs-speedboat economics of routing work between small local models and frontier ones.", "plannedTier": "native", "audience": ["tl", "engineer", "data"], "backlogRef": "Quantic MSAIE capability area; token-economics Evolution Library entry (published 2026-07-10)", "status": "interest-gathering"}, {"id": "t-intelligent-infrastructure", "title": "Scaling Intelligent Infrastructure", "hook": "What changes when it's not one workflow but forty: observability, prompt/version control, drift detection, and the platform team that keeps organizational AI honest.", "plannedTier": "native", "audience": ["tl", "leader", "engineer"], "backlogRef": "Quantic MSAIE capability area; D-series expansion", "status": "interest-gathering"}, {"id": "t-fine-tuning-decision", "title": "Fine-Tune or Prompt? The Shape-the-Model Decision", "hook": "Sometimes the answer isn't a better prompt or more context — it's changing the model itself. When fine-tuning beats prompting, what it costs, and why it's usually the wrong first move.", "plannedTier": "native", "audience": ["tl", "engineer", "data", "leader"], "backlogRef": "Gap identified from Quantic MSAIE syllabus (ML → AI Model Fine-Tuning block); no current-catalog analog", "status": "interest-gathering"}]}};

// ---------- state ----------
const store = {
  get role() { return localStorage.getItem('role') || ''; },
  set role(v) { localStorage.setItem('role', v); renderBadge(); },
  get tier() { return localStorage.getItem('placedTier') || ''; },
  set tier(v) { localStorage.setItem('placedTier', v); renderBadge(); },
  interest() { return JSON.parse(localStorage.getItem('interest') || '{}'); },
  saveInterest(o) { localStorage.setItem('interest', JSON.stringify(o)); },
  // the learner's own red lines — their A5 artifact, kept so it can appear at the moment of pasting
  get redlines() { return localStorage.getItem('redlines') || ''; },
  set redlines(v) { localStorage.setItem('redlines', v); },
  subs() { return JSON.parse(localStorage.getItem('submissions') || '[]'); },
  saveSubs(a) { localStorage.setItem('submissions', JSON.stringify(a)); }
};
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function roleTitle(id) { const r = DATA.roles.find(r => r.id === id); return r ? r.title : id; }
// Where am I, and what's next? Order comes from courses.json — never hardcoded here.
// Prefer the course that matches the learner's role (A0/A5–A8 sit in both aware courses).
function lessonNav(id) {
  const l = DATA.lessons[id];
  const holders = DATA.courses.filter(c => c.lessonIds.includes(id));
  const course = holders.find(c => store.role && c.roleIds.includes(store.role))
    || holders.find(c => c.id === l.meta.courseId) || holders[0]
    || DATA.courses.find(c => c.id === l.meta.courseId);
  if (!course) return { course: { id: l.meta.courseId, title: l.meta.courseId }, prev: null, next: null, pos: '' };
  const ids = course.lessonIds, i = ids.indexOf(id);
  const at = k => (k >= 0 && k < ids.length && DATA.lessons[ids[k]])
    ? { id: ids[k], title: DATA.lessons[ids[k]].meta.title } : null;
  return { course, prev: at(i - 1), next: at(i + 1), pos: i >= 0 ? `lesson ${i + 1} of ${ids.length}` : '' };
}
function renderBadge() {
  const el = document.getElementById('rolebadge');
  el.innerHTML = store.role ? `Role: <b>${roleTitle(store.role)}</b>${store.tier ? ` · Placed: <b>Tier ${store.tier}</b>` : ''}` : 'No role selected';
}

// ---------- interest capture (see docs/interest-capture.md) ----------
function track(teaserId, event, extra) {
  const o = store.interest();
  o[teaserId] = o[teaserId] || { views: 0, opens: 0, notify: [] };
  if (event === 'view') o[teaserId].views++;
  if (event === 'open') o[teaserId].opens++;
  if (event === 'notify') o[teaserId].notify.push(Object.assign({ ts: new Date().toISOString() }, extra));
  store.saveInterest(o);
}
function exportInterest() {
  const blob = new Blob([JSON.stringify({ exported: new Date().toISOString(), role: store.role, placedTier: store.tier, data: store.interest() }, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'interest-signals.json';
  a.click();
}

// ---------- hand-in + coach worksheet (BACKLOG 10; docs/submission-loop-plan.md) ----------
// No accounts, no server, no notifications. Rubrics are read from lesson frontmatter and
// snapshotted at hand-in time, so a coach always grades against what the learner was actually shown.
// The staircase rule applies to the chrome, not just the lessons (owner finding, 2026-07-17):
// the first version of this panel announced "You haven't saved your red lines yet" to a learner on
// lesson 1 — scolding them about a concept they don't meet until lesson 3. Unmet vocabulary, framed
// as a failure, aimed at the population least sure it belongs here. Now: a quiet universal line by
// default; the learner's own card only once they have one.
function redlinesPanel() {
  const rl = store.redlines;
  if (rl) return `<div class="redlines"><b>Before you paste — your red lines:</b>${esc(rl)}
    <div class="rowbar"><button class="ghost" onclick="editRedlines()">Edit</button></div></div>`;
  return `<p class="muted">Before you paste: nothing confidential. If you'd hesitate to read it aloud, don't paste it.
    <button class="ghost" onclick="showRedlinesEditor()" style="margin-left:6px">Add my red lines</button></p>
    <div id="rl-box" style="display:none"><div class="redlines">
      <b>Your red lines</b>Three to five lines — what never goes in, and what you do instead. Once saved, they show up here every time you hand something in.
      <textarea id="rl-edit" placeholder="e.g. Anything with a customer's name in it — instead, I strip the names first."></textarea>
      <div class="rowbar"><button class="ghost" onclick="saveRedlines()">Save</button></div>
    </div></div>`;
}
function showRedlinesEditor() {
  const b = document.getElementById('rl-box');
  b.style.display = 'block';
  document.getElementById('rl-edit').focus();
}
function saveRedlines() { const v = document.getElementById('rl-edit').value.trim(); if (v) { store.redlines = v; render(); } }
function editRedlines() { store.redlines = ''; render(); }

function handIn(id) {
  const l = DATA.lessons[id];
  const ta = document.getElementById('artifact-in');
  const artifact = (ta.value || '').trim();
  if (!artifact) { alert('Paste or upload your artifact first.'); return; }
  const subs = store.subs();
  subs.push({
    lessonId: id, lessonTitle: l.meta.title, courseId: l.meta.courseId, tier: l.meta.tier,
    role: store.role || 'unknown', placedTier: store.tier || 'unplaced',
    artifact,
    rubric: l.meta.rubric || null, // snapshot: grade against what the learner was shown
    submittedAt: new Date().toISOString()
  });
  store.saveSubs(subs);
  render();
}
function uploadArtifact(ev) {
  const f = ev.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => { document.getElementById('artifact-in').value = r.result; };
  r.readAsText(f);
}
function exportSubs() {
  const blob = new Blob([JSON.stringify({ exported: new Date().toISOString(), submissions: store.subs() }, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'hand-ins.json';
  a.click();
}
function importSubs(ev) {
  const f = ev.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const o = JSON.parse(r.result);
      const incoming = Array.isArray(o) ? o : (o.submissions || []);
      if (!incoming.length) { alert('No hand-ins found in that file.'); return; }
      store.saveSubs(store.subs().concat(incoming));
      render();
    } catch (e) { alert('That file could not be read as hand-ins.'); }
  };
  r.readAsText(f);
}
// ci is the criterion's index in the snapshotted rubric — passing the index, not the string,
// keeps quotes out of the inline handler and out of everyone's afternoon.
function grade(i, ci, level) {
  const subs = store.subs();
  const s = subs[i];
  const criterion = (s.rubric || [])[ci] && (s.rubric || [])[ci].criterion;
  if (!criterion) return;
  s.grades = s.grades || [];
  const row = s.grades.find(g => g.criterion === criterion);
  if (row) row.level = level; else s.grades.push({ criterion, level });
  s.gradedAt = new Date().toISOString();
  store.saveSubs(subs);
  render();
}
function saveNote(i) {
  const subs = store.subs();
  const next = document.getElementById('next-' + i).value.trim();
  const anyEmerging = (subs[i].grades || []).some(g => g.level === 'emerging');
  // The judge's constitution requires exactly one next step, and "emerging" may never appear without
  // the concrete move to "working". The human worksheet is held to the same contract — otherwise the
  // gold set wouldn't match the judge's output shape and the agreement test couldn't compare them.
  if (anyEmerging && !next) {
    alert('This hand-in is marked emerging on at least one criterion.\n\nEmerging is a position on a staircase, not a verdict — so it needs the one concrete step that gets them to working. Add it before saving.');
    document.getElementById('next-' + i).focus();
    return;
  }
  subs[i].nextStep = next;
  subs[i].misconception = document.getElementById('mis-' + i).value;
  subs[i].gradedBy = document.getElementById('by-' + i).value;
  subs[i].gradedAt = new Date().toISOString();
  store.saveSubs(subs);
  const el = document.getElementById('saved-' + i);
  if (el) el.textContent = 'Saved.';
}
function dropSub(i) {
  if (!confirm('Remove this hand-in from this browser? This cannot be undone.')) return;
  const subs = store.subs(); subs.splice(i, 1); store.saveSubs(subs); render();
}

// ---------- diagnostic (pure data from content/diagnostic.json) ----------
function placeTier(ans) { // conjunctive ladder per placementRule
  const t2 = ans.q1_unprompted_use === 'yes' && ans.q2_prompt_shape === 'yes';
  const t3 = t2 && ans.q3_reuse === 'maintain' && ans.q4_workflow_design === 'yes';
  const t4 = t3 && ans.q5_system_design === 'yes';
  return t4 ? 4 : t3 ? 3 : t2 ? 2 : 1;
}
function diagFlags(ans, tier) {
  const f = [];
  if (ans.q5_system_design === 'yes' && tier < 4) f.push(DATA.diagnostic.flags[0]);
  if (ans.q4_workflow_design === 'yes' && tier < 3) f.push(DATA.diagnostic.flags[1]);
  if (ans.q3_reuse === 'maintain' && tier < 2) f.push(DATA.diagnostic.flags[2]);
  return f;
}

    <span class="tierchip tier-${l.meta.tier}">${l.meta.tier}</span>
    <span class="muted">${l.meta.durationMin} min · staircase rung ${l.meta.staircaseRung || '—'}${nav.pos ? ' · ' + nav.pos : ''}${refs ? ' · library: ' + refs : ''}</span>
    <div class="lesson-body">${l.html}</div>
    <div class="card handin">
      <h3>Hand in your artifact</h3>
      <p class="muted">Your coach reads this and talks it through with you. There's no score and nothing to pass or fail — the rubric describes where a thing is, not how good you are.</p>
      ${redlinesPanel()}
      <textarea id="artifact-in" placeholder="Paste your artifact here — or upload the file you made."></textarea>
      <div class="rowbar">

        <span class="muted">Stays in this browser until you export it.</span>
      </div>
      ${mine.length ? `<div class="donebox">

    </div>

      <a class="btn ghost" href="#/course/${nav.course.id}">All lessons</a>
      ${nav.next ? `<a class="btn ghost" href="#/lesson/${nav.next.id}">${nav.next.id} →</a>` : '<span></span>'}

  worksheet() {

    <div class="rowbar">

          <b>${esc(c.criterion)}</b>

        </div>`).join('')
        : '<p class="muted">No rubric on this lesson — read it in prose and note what you saw below.</p>'}
        <label class="opt"><b>One next step</b> — the single thing they do next. Required: nothing here may be marked <i>emerging</i> without it.
          <textarea id="next-${i}" placeholder="One concrete move. Not three. What does 'working' look like from where they are — and what's the one action that gets them there?">${esc(s.nextStep || '')}</textarea></label>
        <label class="opt muted">Misconception observed — optional, and it isn't about the learner. This feeds the misconception log and gets the <i>lesson</i> fixed.
          <textarea id="mis-${i}" placeholder="What did the lesson fail to make clear? This is a content defect report.">${esc(s.misconception || '')}</textarea></label>
        <div class="rowbar">
          <input id="by-${i}" placeholder="Your name (optional)" value="${esc(s.gradedBy || '')}" style="font-family:system-ui,sans-serif;font-size:.85rem;padding:8px;border:1px solid var(--line);border-radius:8px">

          <button class="ghost" onclick="dropSub(${i})">Remove</button>
          <span class="muted" id="saved-${i}"></span>

  library(id) {
    if (id) {
      const e = DATA.library[id];
      if (!e) return '<p>Entry not found.</p>';
      return `<p><a href="#/library">← Evolution Library</a></p>

      <div class="entry-body">${e.html}</div>`;
    }

    <p class="muted">Practices are versioned, not eternal. Each entry tracks how a practice changed as models changed — what's current, what's deprecated, and where the old way is still right.</p>
    ${Object.values(DATA.library).map(e => `<div class="card clickable" onclick="location.hash='#/library/${e.meta.id}'">
      <b>${e.meta.practice}</b> <span class="muted">(${e.meta.id})</span><br>
      <span class="muted">status: ${e.meta.status} · reviewed ${e.meta.last_reviewed} · cited by ${(e.meta.referenced_by || []).join(', ')}</span>
    </div>`).join('')}`;

  architect() {
    const t = DATA.teasers;
    t.teasers.forEach(x => track(x.id, 'view'));

    ${t.teasers.map(x => {
      const done = (store.interest()[x.id] || { notify: [] }).notify.length > 0;
      return `<div class="card clickable teaser" id="${x.id}" onclick="openTeaser('${x.id}')">
        <span class="tierchip tier-${x.plannedTier}">${x.plannedTier} · coming</span><b>${x.title}</b>
        <div class="hook"><p>${x.hook}</p>
          ${done ? '<span class="notify-done">✓ On the list</span>'
                 : `<button onclick="event.stopPropagation();notifyMe('${x.id}')">Notify me when this exists</button>`}
        </div>
      </div>`;
    }).join('')}
    <div class="zonebar"><span class="muted">Signals stay in this browser until exported.</span>
    <button class="ghost" onclick="exportInterest()">Export interest data</button></div>`;

};

function openTeaser(id) {
  const el = document.getElementById(id);
  if (!el.classList.contains('open')) { el.classList.add('open'); track(id, 'open'); }
}
function notifyMe(id) {
  track(id, 'notify', { role: store.role || 'unknown', placedTier: store.tier || 'unplaced' });
  render();
}
function submitDiag(ev) {
  ev.preventDefault();
  const f = new FormData(ev.target), ans = {};
  DATA.diagnostic.checks.forEach(c => ans[c.id] = f.get(c.id));
  const tier = placeTier(ans);
  store.tier = String(tier);
  const course = DATA.diagnostic.routing.tiers[String(tier)][store.role];
  const c = DATA.courses.find(x => x.id === course);
  const flags = diagFlags(ans, tier);
  document.getElementById('diagresult').innerHTML = `<div class="card">
    <h3>Placement: Tier ${tier}</h3>
    <p>Recommended course:</p>
    <div class="card clickable" onclick="location.hash='#/course/${course}'">
      <span class="tierchip tier-${c.tier}">${c.tier}</span><b>${c.title}</b>
      <p class="muted">${c.description}</p></div>
    ${flags.map(fl => `<div class="flag"><b>To discuss with your coach:</b> ${fl.meaning}</div>`).join('')}
    <p class="muted">Placement is confirmed by a coach against your evidence — this is a starting point, not a verdict.</p>
  </div>`;
  document.getElementById('diagresult').scrollIntoView({ behavior: 'smooth' });
  return false;
}

// ---------- router ----------
function render() {
  const [_, view, arg] = (location.hash || '#/').split('/');
  const v = view || 'home';
  const fn = { '': 'home', 'diagnostic': 'diagnostic', 'catalog': 'catalog', 'course': 'course', 'lesson': 'lesson', 'library': 'library', 'architect': 'architect', 'worksheet': 'worksheet' }[v] || 'home';
  document.getElementById('app').innerHTML = views[fn](arg);
  document.querySelectorAll('nav a').forEach(a => a.classList.toggle('active', a.dataset.nav === fn || (fn === 'course' || fn === 'lesson') && a.dataset.nav === 'catalog'));
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', render);
renderBadge();
render();
</script>
