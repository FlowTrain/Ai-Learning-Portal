<style>
  :root {
    --bg: #f7f6f3; --card: #ffffff; --ink: #1f2328; --muted: #6a737d;

  #rolebadge { margin-left: auto; font-family: system-ui, sans-serif; font-size: .8rem; color: var(--muted); }

  .tier-fluent { background: var(--t3); } .tier-native { background: var(--t4); }
  .muted { color: var(--muted); font-size: .9rem; }
  h2 { font-size: 1.5rem; margin: .4em 0; } h3 { margin: 1.1em 0 .4em; }
  button, .btn { font-family: system-ui, sans-serif; font-size: .85rem; background: var(--accent); color: #fff; border: 0; border-radius: 8px; padding: 9px 16px; cursor: pointer; }
  button.ghost { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
  .rolegrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
  .opt { display: block; margin: 6px 0; font-family: system-ui, sans-serif; font-size: .92rem; }
  textarea { width: 100%; min-height: 56px; border: 1px solid var(--line); border-radius: 8px; padding: 8px; font-family: system-ui, sans-serif; font-size: .88rem; margin-top: 6px; }

  .lesson-body blockquote { border-left: 3px solid var(--accent); margin-left: 0; padding-left: 16px; color: var(--muted); font-style: italic; }

  /* ---- hand-in + coach worksheet (BACKLOG 10) ---- */

  .lvls { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 8px; margin-top: 8px; }
  .lvl { display: block; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; cursor: pointer; font-family: system-ui, sans-serif; font-size: .8rem; background: #fff; }

  .lvl-name { font-weight: 600; text-transform: capitalize; }
  .subitem { display: flex; gap: 10px; align-items: baseline; }
  .subitem b { font-family: system-ui, sans-serif; font-size: .92rem; }
  .graded { color: var(--t2); font-family: system-ui, sans-serif; font-size: .8rem; font-weight: 600; }
  .artifact { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; white-space: pre-wrap; font-family: system-ui, sans-serif; font-size: .85rem; max-height: 340px; overflow: auto; }
  .donebox { background: #eef6f1; border-left: 4px solid var(--t2); padding: 12px 14px; margin-top: 14px; font-family: system-ui, sans-serif; font-size: .88rem; }
  .lessonnav { justify-content: space-between; margin-top: 8px; }
  .lessonnav .muted { margin-left: 0; }

<script>
const DATA = {"roles": [{"id": "pm", "title": "Product Manager", "track": "product", "description": "Owns product strategy, roadmap, and cross-functional delivery. Interfaces with engineering, design, and stakeholders.", "businessOutcomes": ["PRDs generated from structured context in < 30 min", "AI-assisted backlog grooming reduces estimation time by 40%", "Automated stakeholder communication chains deployed", "AI evaluates acceptance criteria before sprint start"]}, {"id": "coach", "title": "Product Coach", "track": "product", "description": "Upskills product managers and engineers. Facilitates AI adoption, coaches prompt discipline, and curates team knowledge assets.", "businessOutcomes": ["Every PM on their roster has a maintained prompt library", "Shared skill packages deployed for 3+ repeatable workflows", "CLAUDE.md context files live in every agentic project", "Coaches can evaluate AI output without running it themselves"]}, {"id": "engineer", "title": "Software Engineer", "track": "engineering", "description": "Builds and ships software. Uses AI for code generation, review, documentation, and test authoring.", "businessOutcomes": ["AI-assisted PR reviews reduce review cycle by 50%", "Test generation from specs happens automatically", "Architecture decisions documented with AI synthesis", "Incident postmortems AI-drafted within 2 hrs of resolution"]}, {"id": "designer", "title": "UX/Product Designer", "track": "design", "description": "Designs product experiences. Uses AI to accelerate research synthesis, generate design specs, and describe UI in system language.", "businessOutcomes": ["Design specs generated from user research in Storybook-ready format", "Figma AI used with pre-refined prompts (no wasted credits)", "Accessibility audit chains run automatically on new screens", "UX layout descriptions feed directly into engineering context"]}, {"id": "data", "title": "Data / Analytics Engineer", "track": "data", "description": "Builds data pipelines, metrics, and analytical systems. Uses AI for query generation, documentation, and anomaly detection.", "businessOutcomes": ["SQL generation from plain-language business questions", "Data pipeline docs auto-generated and versioned", "Anomaly detection prompts packaged as shared skills", "Metric definitions encoded in AI-readable context files"]}, {"id": "tl", "title": "Tech Lead / Staff Engineer", "track": "engineering", "description": "Sets technical direction, leads architecture decisions, and mentors engineers. Responsible for AI governance within engineering.", "businessOutcomes": ["AI cost governance policy authored and enforced team-wide", "Architecture decision records generated with AI synthesis", "AI evaluation pipelines designed for all production LLM uses", "Team AI skill library maintained and versioned quarterly"]}, {"id": "leader", "title": "Engineering / Product Leader", "track": "leadership", "description": "Director or VP-level. Accountable for team AI maturity, org-level AI strategy, and business outcomes from AI investment.", "businessOutcomes": ["Org-wide AI maturity dashboard with role-specific KPIs", "AI investment ROI tracked per workflow automation", "AI governance framework published and adopted team-wide", "100% of new hires complete AI-Enabled tier within 60 days"]}], "courses": [{"id": "aware-foundations", "title": "AI Foundations for Product Teams", "tier": "aware", "roleIds": ["pm", "coach", "designer", "leader"], "description": "Build the vocabulary and mental models to work effectively with AI tools. No prior AI experience required.", "lessonIds": ["A0", "A9", "A8", "A5", "A6", "A7", "A1", "A2", "A3", "A4"], "totalCredits": 9.5}, {"id": "aware-eng", "title": "AI Foundations for Engineers", "tier": "aware", "roleIds": ["engineer", "tl", "data"], "description": "Establish AI vocabulary, tool selection principles, and first structured prompts for engineering work.", "lessonIds": ["A0", "A9", "A8", "A5", "A6", "A7", "A1", "A2E", "A3E", "A4"], "totalCredits": 9.5}, {"id": "enabled-pm", "title": "AI-Enabled Product Work", "tier": "enabled", "roleIds": ["pm", "coach"], "description": "Integrate AI into PRD authoring, backlog refinement, stakeholder communication, and test planning.", "lessonIds": ["B1", "B2", "B3", "B4"], "totalCredits": 4}, {"id": "enabled-eng", "title": "AI-Enabled Engineering", "tier": "enabled", "roleIds": ["engineer", "tl", "data"], "description": "Use AI for code review, documentation, test generation, and structured output from engineering context.", "lessonIds": ["B1E", "B2E", "B3E", "B4"], "totalCredits": 4}, {"id": "enabled-design", "title": "AI-Enabled Design", "tier": "enabled", "roleIds": ["designer"], "description": "Use AI to accelerate UX research synthesis, generate design specs, and describe interfaces in system language.", "lessonIds": ["B1D", "B2D", "B3", "B4", "B5D"], "totalCredits": 5}, {"id": "fluent-chains", "title": "AI-Fluent: Workflow Design", "tier": "fluent", "roleIds": ["pm", "coach", "engineer", "tl", "designer", "data", "leader"], "description": "Design reusable prompt chains, author skill packages, govern token costs, and build AI-ready context for agentic systems.", "lessonIds": ["C1", "C2", "C3", "C4", "C5"], "totalCredits": 5}, {"id": "tooling-misconceptions", "title": "Skills & Tooling: What Actually Breaks", "tier": "fluent", "roleIds": ["coach", "tl", "engineer", "pm"], "description": "The quiet failure modes of AI skills and tooling: why a skill never loads, how to write a description that actually gets selected, whether a skill is a control you can evidence, and how to keep a document's format from outrunning its source.", "lessonIds": ["C6", "C7", "C8"], "totalCredits": 3}, {"id": "native-systems", "title": "AI-Native: System Design", "tier": "native", "roleIds": ["tl", "leader", "coach"], "description": "Architect AI-first product systems. Build evaluation pipelines, define org AI strategy, and establish governance at scale.", "lessonIds": ["D1", "D2", "D3", "D4"], "totalCredits": 4}, {"id": "leader-literacy", "title": "AI Literacy for Leaders: Fund, Govern, Measure", "tier": "native", "roleIds": ["leader"], "description": "Tier 4 literacy for directors and VPs — fund AI workflows, set risk-tier policy, and measure maturity by behavior. Explicitly not the architect track: you write the 'what', your architects build the 'how'.", "lessonIds": ["D5", "D6", "D7", "D8"], "totalCredits": 4}], "lessons": {"A0": {"meta": {"id": "A0", "courseId": "aware-foundations", "tier": "aware", "roleIds": ["pm", "coach", "designer", "leader", "engineer", "tl", "data"], "durationMin": 15, "creditHours": 0.5, "staircaseRung": 1, "buildsBehaviors": ["Tier 1: targets AI at one specific low-risk task and finishes it", "Tier 1: follows one safety rule consistently"], "rubric": [{"criterion": "A real task, not an exercise", "emerging": "A hypothetical or made-up task", "working": "A real chore from their actual week", "strong": "The output was actually used — it left their hands"}, {"criterion": "The time is legible", "emerging": "No time noted", "working": "A number", "strong": "Before and after, so the saving is unambiguous — not one number that could mean either"}, {"criterion": "One thing they'd say differently", "emerging": "\"Nothing\", or the note blames the tool", "working": "Names something they'd change next time", "strong": "The change is about what *they* said — more context, a clearer ask — not about the tool being bad"}], "title": "The First Win: Get 20 Minutes Back"}, "html": "<h1>The First Win: Get 20 Minutes Back<\/h1>\n<blockquote>\n<p>This is not a lesson about AI. It's a lesson about a chore you already have to do this week — done in a third of the time. No vocabulary, no theory, no setup. One task, one rule, one saved file.<\/p>\n<\/blockquote>\n<h2>Pick the Chore (2 minutes)<\/h2>\n<p>Choose one small, dull task that's already on your plate this week. Good candidates: summarizing a long document you have to read anyway, turning messy meeting notes into a tidy email, drafting a first version of something you'd normally stare at a blank page for. Pick something low-stakes — nothing confidential, nothing where a mistake would embarrass you.<\/p>\n<h2>Do It (10 minutes)<\/h2>\n<p>Open whichever AI chat tool your organization provides. Talk to it the way you'd hand the task to a helpful colleague — in ordinary sentences. Tell it three things: what you're trying to produce, who it's for, and paste in the raw material you're working from. If the first answer isn't right, say what's wrong with it the way you would to a person (\"shorter,\" \"less formal,\" \"you missed the part about the deadline\") and let it try again.<\/p>\n<p>That's the entire technique for today. Plain sentences, honest corrections.<\/p>\n<h2>The One Rule<\/h2>\n<p><strong>Nothing the AI writes leaves your hands unchecked.<\/strong> Read the output the way you'd read a colleague's draft before forwarding it — you're still the author, it's still your name on it. (And the flip side of the same rule: don't hand it anything you couldn't hand a stranger — no confidential data.)<\/p>\n<p>This one rule is what makes everything else in this program safe to try.<\/p>\n<h2>Notice What Just Happened (3 minutes)<\/h2>\n<p>Compare: how long does this chore usually take you? How long did it take today, including the corrections? For most people, on the right chore, the answer is \"about a third of the time.\" That feeling — \"this saved me 20 minutes\" — is the entire point of this lab. Not mastery. Just one real win on one real task.<\/p>\n<h2>Assignment<\/h2>\n<p>Do the chore for real — the output should be something you actually use this week, not an exercise.<\/p>\n<h3>Deliverables<\/h3>\n<ul>\n<li>The finished chore itself (the summary, the email, the draft — whatever you made)<\/li>\n<li>first-win.md with three sentences: what the task was, roughly how much time it saved, and one thing you'd say differently to the AI next time<\/li>\n<\/ul>"}, "A1": {"meta": {"id": "A1", "courseId": "aware-foundations", "tier": "aware", "roleIds": ["pm", "coach", "designer", "leader", "engineer", "tl", "data"], "durationMin": 25, "creditHours": 1, "staircaseRung": 1, "buildsBehaviors": ["Tier 1: describes a screen or service in plain, complete sentences before asking AI for anything", "Tier 1: recognizes that vague requests produce made-up answers, and says what was missing"], "title": "Describing Your Product Surface for AI"}, "html": "<h1>Describing Your Product Surface for AI<\/h1>\n<blockquote>\n<p>AI invents whatever you leave out. This lesson builds the one habit that fixes most disappointing AI output: describing the thing you're working on — a screen, a service, a report — in plain words, completely enough that a stranger could picture it.<\/p>\n<\/blockquote>\n<h2>Start Here: The Stranger Test (5 minutes)<\/h2>\n<p>Pick one screen or one service you know well. Now describe it — out loud or in writing — to an imaginary new coworker who has never seen it. Could they sketch it from your words alone?<\/p>\n<p>Most first attempts sound like this: \"It's the invoices page.\" A description that passes the stranger test sounds like this: \"The screen has a header with the customer's name, a table of invoices with dates and amounts, and a side panel showing payment status.\"<\/p>\n<p>That second sentence is the whole skill. Nothing more advanced is required in this lesson.<\/p>\n<h2>Why This Works<\/h2>\n<p>When you ask an AI for something and leave gaps, it doesn't ask you to fill them — it fills them itself, with plausible-sounding fiction. The invoice table gets columns your product doesn't have. The service gets features nobody built. This isn't the tool being bad; it's the tool doing exactly what a stranger would do if forced to guess.<\/p>\n<p>Complete plain-language description removes the guessing. That's it. No special formats, no technical vocabulary — just the discipline of saying what's actually there.<\/p>\n<h2>Describing Screens in Plain Words<\/h2>\n<p>Walk the surface like a tour guide: what areas the screen has (top, middle, side), what sits in each area, what information is shown, and what the screen looks like when things go wrong — when it's still loading, when there's nothing to show, when something failed.<\/p>\n<h2>Describing Services in Plain Words<\/h2>\n<p>Same idea, no visuals: what the service does in one sentence, who or what uses it, what it needs to do its job, and what must never happen (\"it must never send an invoice twice\").<\/p>\n<h2>Where This Goes Next<\/h2>\n<p>Later lessons will give you named templates for these descriptions, and eventually formats precise enough for a computer to check. Every one of them is just a sharper version of the sentences you wrote today. If you can pass the stranger test, you're ready for all of it.<\/p>\n<h2>Assignment<\/h2>\n<p>Choose one screen you own (or one service, if that's your world). Write a plain-language description that passes the stranger test: someone who has never seen your product could sketch or summarize it from your words alone.<\/p>\n<h3>Deliverables<\/h3>\n<ul>\n<li>A markdown document (my-screen.md or my-service.md)<\/li>\n<li>At least 3 areas of the screen, or 3 jobs of the service, each described in complete sentences<\/li>\n<li>One \"when it goes wrong\" moment explicitly described (empty, loading, failed, wrong input)<\/li>\n<li>One rule the thing must always follow, in plain words<\/li>\n<\/ul>"}, "A2": {"meta": {"id": "A2", "courseId": "aware-foundations", "tier": "aware", "roleIds": ["pm", "coach", "designer", "leader"], "durationMin": 25, "creditHours": 1, "staircaseRung": 2, "buildsBehaviors": ["Tier 1→2: reuses a prompt that worked instead of retyping from memory", "Tier 2: maintains a small personal prompt library with known failure modes"], "libraryRefs": ["prompting-frameworks"], "title": "Your First Prompt Library"}, "html": "<h1>Your First Prompt Library<\/h1>\n<blockquote>\n<p>A prompt you use once is a tool. A prompt you write down and improve is an asset. This lesson establishes the habit that separates AI-Aware individuals from AI-Enabled teams: treating prompts as reusable artifacts rather than one-off queries.<\/p>\n<\/blockquote>\n<h2>Start Here: Find Your Repeat (5 minutes)<\/h2>\n<p>Scroll back through your AI chat history from the last two weeks. Find one request you've typed more than once — different words, same intent (\"summarize this doc for my boss,\" \"turn these notes into an email\"). That repeat is your first library entry. You've already done the hard part: discovering a prompt worth keeping.<\/p>\n<h2>The Prompt Card Format<\/h2>\n<p>Now give that repeat a home. Every prompt card has five fields: <strong>Intent<\/strong> (one sentence: what is this prompt for?), <strong>Inputs<\/strong> (what context does the prompt need — what does the caller provide?), <strong>Prompt<\/strong> (the actual template, with {{placeholders}} for variable content), <strong>Expected Output<\/strong> (what good looks like), and <strong>Failure Modes<\/strong> (what bad looks like, and why). The failure modes field is what separates a prompt library from a notes file.<\/p>\n<h2>When to Write a Card<\/h2>\n<p>Write a card when: (1) you've used the same prompt pattern more than twice, (2) you got a result good enough to repeat, or (3) you discovered a failure mode worth warning teammates about. Don't write cards for one-off queries. The test: would a teammate on your team benefit from this card without further explanation from you?<\/p>\n<h2>Library Governance<\/h2>\n<p>A prompt library is a living document. Treat it like a changelog: when a prompt stops working well (model update, product change, new constraint), update the card and note what changed and why. A prompt library that isn't maintained becomes worse than no library — it breeds false confidence in stale patterns. (How prompt-writing advice itself changes over time is tracked in the Evolution Library: see the prompting-frameworks entry.)<\/p>\n<h2>Assignment<\/h2>\n<p>Build the first 3 cards of your personal prompt library. At least one card must come from a real prompt you've used in your actual work — not a synthetic example. At least one card must include a documented failure mode from real experience.<\/p>\n<h3>Deliverables<\/h3>\n<ul>\n<li>personal-prompt-library.md with exactly 3 cards<\/li>\n<li>Each card: Intent, Inputs, Prompt (with placeholders), Expected Output, Failure Modes<\/li>\n<li>One card must reference a real product artifact you own<\/li>\n<li>One card must document a real failure mode you observed<\/li>\n<\/ul>"}, "A2E": {"meta": {"id": "A2E", "courseId": "aware-eng", "tier": "aware", "roleIds": ["engineer", "tl", "data"], "durationMin": 25, "creditHours": 1, "staircaseRung": 2, "buildsBehaviors": ["Tier 1→2: reuses engineering prompts from a written library instead of retyping", "Tier 2: writes a context file before starting a metered agentic session"], "libraryRefs": ["prompting-frameworks", "token-economics"], "title": "Your First Engineering Prompt Library"}, "html": "<h1>Your First Engineering Prompt Library<\/h1>\n<blockquote>\n<p>Engineers interact with AI differently than PMs — but the discipline is identical. This lesson builds your first prompt library focused on engineering tasks: code review, documentation, test generation, and query authoring.<\/p>\n<\/blockquote>\n<h2>Engineering Prompt Patterns<\/h2>\n<p>The most reusable engineering prompts fall into four categories: <strong>Transform<\/strong> (convert this spec into code/tests/docs), <strong>Explain<\/strong> (summarize what this code does for X audience), <strong>Validate<\/strong> (check this against constraint Y), and <strong>Generate<\/strong> (produce Z given context A and B). The difference between useful engineering prompts and useless ones is always the same thing: how precisely you specified the input context.<\/p>\n<h2>The Context File Advantage<\/h2>\n<p>Engineers who get the most out of agentic AI (Claude Code, GitHub Copilot Agent) do one thing consistently: they write a CLAUDE.md or AGENTS.md before starting. This file gives the agent your architecture, your naming conventions, your test patterns, and your constraints. Without it, the agent re-invents your stack every session. With it, every session picks up where the last one left off.<\/p>\n<h2>Cost Discipline<\/h2>\n<p>Agentic sessions burn tokens fast, and a session with poor context costs several times more than one with a good CLAUDE.md — the agent spends your tokens rediscovering what you could have written down. The upfront investment in a good context file pays for itself quickly. Treat prompt refinement in a chat window as free; treat agentic sessions as metered — never start one without structured context.<\/p>\n<h2>Assignment<\/h2>\n<p>Build 3 prompt cards focused on engineering tasks you perform at least weekly. One must be a Transform card, one must be a Validate card. Write a draft CLAUDE.md for one of your current projects — minimum 5 fields.<\/p>\n<h3>Deliverables<\/h3>\n<ul>\n<li>prompt-library-eng.md with 3 cards (Transform, Validate, + one of your choice)<\/li>\n<li>CLAUDE.md draft with: project purpose, tech stack, naming conventions, test patterns, 1 AI constraint<\/li>\n<li>Cards must reference real tasks (code review, doc generation, query writing, etc.)<\/li>\n<\/ul>"}, "A3": {"meta": {"id": "A3", "courseId": "aware-foundations", "tier": "aware", "roleIds": ["pm", "coach", "designer", "leader"], "durationMin": 25, "creditHours": 1, "staircaseRung": 2, "buildsBehaviors": ["Tier 1→2: breaks one AI task into steps and checks each step's output before continuing", "Tier 2: names the steps in a repeated workflow and knows which one needs human judgment"], "libraryRefs": ["prompting-frameworks", "agent-orchestration"], "title": "Prompt Chain Basics"}, "html": "<h1>Prompt Chain Basics<\/h1>\n<blockquote>\n<p>Single prompts solve single problems. Chains solve workflows. This lesson introduces the clarify → generate → refine pattern and teaches you to identify where human judgment must stay in the loop — the skill that separates disciplined AI use from reckless automation.<\/p>\n<\/blockquote>\n<h2>Start Here: Work You Never Do in One Sitting (5 minutes)<\/h2>\n<p>Think of a piece of work you never finish in one go — a status report, a meeting summary that becomes an action list, a draft that needs a second pass. Write down the sittings as steps: \"First I gather the notes. Then I write the draft. Then I fix what's wrong with it.\" You've just described a chain in plain words. This lesson gives those steps names and shows you where AI fits into each one.<\/p>\n<h2>Why Chains Beat Single Prompts<\/h2>\n<p>Complex tasks fail with single prompts because the model has to guess at ambiguities and make judgment calls without feedback. A chain breaks the task into steps where each output becomes the verified input for the next. You trade one long prompt (and its unpredictable output) for a series of short, inspectable steps.<\/p>\n<p>The chain pattern: <strong>Clarify<\/strong> (surface assumptions), <strong>Generate<\/strong> (produce the artifact), <strong>Critique<\/strong> (identify gaps), <strong>Refine<\/strong> (improve based on critique). Most product workflows need exactly these four steps — and they map directly onto the sittings you listed above.<\/p>\n<h2>Where Human Judgment Must Stay<\/h2>\n<p>Not every step should be automated. Human judgment is required when: (1) the decision has irreversible consequences, (2) the context involves stakeholder politics or organizational dynamics the AI cannot see, (3) the output will be attributed to a person, or (4) the criteria for 'good' involves taste, values, or priorities that change. Automation-ready steps are mechanical transformations with clear acceptance criteria.<\/p>\n<h2>Capturing Chains for Reuse<\/h2>\n<p>A chain is reusable only if it's written down as a sequence of named steps with their prompts, expected outputs, and decision points. A chain that lives only in your head dies when you switch projects. A chain in a markdown file can be handed to a teammate, loaded into an AI context, or eventually packaged as a skill. (Chains are also the ancestor of every multi-agent system in production — how orchestration evolved from this exact pattern is tracked in the Evolution Library: see the agent-orchestration entry.)<\/p>\n<h2>Assignment<\/h2>\n<p>Document one 3-step prompt chain for a workflow you run at least monthly. The chain must include a clarify step, a generate step, and a critique or refine step. Explicitly mark the step(s) where human judgment is required and why.<\/p>\n<h3>Deliverables<\/h3>\n<ul>\n<li>prompt-chain-[workflow-name].md<\/li>\n<li>3 named steps with: step name, prompt template, expected output, acceptance criteria<\/li>\n<li>At least 1 step explicitly labeled as 'Human Judgment Required' with a 2-sentence rationale<\/li>\n<li>A note on when this chain would break down (mod<\/li>\n<\/ul>"}, "A3E": {"meta": {"id": "A3E", "courseId": "aware-eng", "tier": "aware", "roleIds": ["engineer", "tl", "data"], "durationMin": 25, "creditHours": 1, "staircaseRung": 2, "buildsBehaviors": ["Tier 1→2: breaks an engineering task into chain steps with validation between them", "Tier 2: distinguishes automation candidates from judgment-required steps"], "libraryRefs": ["prompting-frameworks", "agent-orchestration"], "title": "Engineering Prompt Chains"}, "html": "<h1>Engineering Prompt Chains<\/h1>\n<blockquote>\n<p>Engineering workflows are ideal candidates for prompt chains because they have clear inputs (specs, PRDs, existing code) and clear outputs (tests, docs, code). This lesson builds your first engineering chain and identifies automation candidates vs. judgment-required steps.<\/p>\n<\/blockquote>\n<h2>The Engineering Chain Pattern<\/h2>\n<p>The most common high-value engineering chain: <strong>Spec → Test Plan → Test Code → Review Checklist<\/strong>. Each step has a clear input (the prior step's output), a clear transformation (what the LLM adds), and a clear validation (what 'good enough to proceed' looks like). This chain alone eliminates the most common bottleneck in sprint delivery: writing tests before code is merged.<\/p>\n<h2>Chains vs. One-Shot Generation<\/h2>\n<p>One-shot generation (give the model a spec, get back code) fails on anything complex because there's no feedback loop. Chains succeed because each step can be validated before proceeding. The key insight: the validation step is where the human adds the most value — checking the output of step N before triggering step N+1 is far cheaper than fixing a bad final artifact.<\/p>\n<h2>Identifying Automation Candidates<\/h2>\n<p>A step is ready for automation when: it runs the same way every time, its inputs are always available in structured form, its success criteria can be checked programmatically, and a bad output is safe to retry without consequences. Most documentation generation, test skeleton creation, and code comment tasks meet this bar. Architecture decisions, stakeholder tradeoffs, and acceptance criteria definition never do.<\/p>\n<h2>Assignment<\/h2>\n<p>Document a 3-step engineering chain for a workflow in your current sprint or project. Identify which steps are automation candidates and which require human review. Estimate the weekly time saving if this chain were consistently applied.<\/p>\n<h3>Deliverables<\/h3>\n<ul>\n<li>eng-chain-[workflow].md with 3 named steps<\/li>\n<li>Each step: prompt template, expected output, validation criteria<\/li>\n<li>Each step labeled: 'Automation Candidate' or 'Human Review Required' with rationale<\/li>\n<li>Time-saving estimate: current manual<\/li>\n<\/ul>"}, "A4": {"meta": {"id": "A4", "courseId": "aware-foundations", "tier": "aware", "roleIds": ["pm", "coach", "engineer", "tl", "designer", "data", "leader"], "durationMin": 20, "creditHours": 1, "staircaseRung": 1, "buildsBehaviors": ["Tier 1: picks a tool deliberately instead of using the same AI for everything", "Tier 1→2: can explain in plain language when AI is and isn't appropriate for a task"], "libraryRefs": ["token-economics"], "title": "Right Tool, Right Task"}, "html": "<h1>Right Tool, Right Task<\/h1>\n<blockquote>\n<p>The most expensive AI mistake teams make is reaching for the most powerful tool for every task. Some AI tools cost far more per use than others, and the powerful ones do worse — not better — on tasks that aren't prepared for them. This lesson builds the habit of matching the tool to the job.<\/p>\n<\/blockquote>\n<h2>Start Here: Your Last Five (5 minutes)<\/h2>\n<p>Write down the last five times you used an AI tool for work. Next to each one, answer in plain words: did you get what you needed on the first try? If not, how many tries did it take? Keep this list — it's the raw material for the assignment, and the pattern in it is usually visible immediately: the frustrating ones were the wrong tool, the wrong preparation, or both.<\/p>\n<h2>The AI Tool Stack<\/h2>\n<p><strong>Search-and-summarize tools (Copilot 365, Notion AI):<\/strong> Best for finding and condensing content that already exists in your workspace. Cheapest to run. They can't invent what they can't find — which for this job is a feature.<\/p>\n<p><strong>Chat tools (Claude, ChatGPT, Gemini):<\/strong> Best for single-transformation tasks — take this input, produce this output. Ideal for drafting, rewriting, changing format, and refining your own requests.<\/p>\n<p><strong>Agentic tools (Claude Code, Cursor, GitHub Copilot Agent):<\/strong> Best for multi-step tasks that require reading and writing files across a project. Most expensive per session. Only worth it when the tool has a written project description to read before it starts.<\/p>\n<h2>The Two-Question Test<\/h2>\n<p>Before opening one of the expensive tools, ask: (1) \"What file will exist when I'm done that someone else will reuse?\" If you can't name it, this belongs in a chat window. (2) \"What does the tool get to read about my project before it starts?\" If the answer is nothing, you're about to pay for the tool to guess at your entire project.<\/p>\n<p>If you can't answer both questions, the task isn't ready for an agentic session.<\/p>\n<h2>Cost Reality<\/h2>\n<p>The expensive tools are metered: every session costs real money, and an unprepared session costs several times more than a prepared one while producing worse output. You don't need to know the pricing tables — you need one habit: treat chat as cheap and agentic sessions as metered, and never start a metered session without something written down for the tool to read first.<\/p>\n<h2>Assignment<\/h2>\n<p>Take your \"last five\" list from the opening activity. For each entry, identify: which tool you used, which tool was the best fit, and what written context (if any) you gave it before starting. Then write a \"tool selection rule\" for your specific role that you would share with a new teammate.<\/p>\n<h3>Deliverables<\/h3>\n<ul>\n<li>right-tool-audit.md with 5 real task entries (task, tool used, best-fit tool, context provided)<\/li>\n<li>A 3-5 rule 'tool selection guide' for your role — written to be handed to a new team member<\/li>\n<li>One example of a task where you'd switch tools based on this lesson<\/li>\n<\/ul>"}, "A5": {"meta": {"id": "A5", "courseId": "aware-foundations", "tier": "aware", "roleIds": ["pm", "coach", "designer", "leader", "engineer", "tl", "data"], "durationMin": 20, "creditHours": 1, "staircaseRung": 1, "buildsBehaviors": ["Tier 1: follows at least one safety rule consistently, without being reminded", "Tier 1: can state out loud what they will never paste into an AI tool, and what they do instead"], "rubric": [{"criterion": "Red lines are specific", "emerging": "Generic restatement (\"no confidential data\")", "working": "Names actual document types or systems from their own work", "strong": "Names the rule that generates the list, so new cases resolve themselves"}, {"criterion": "The alternative is real", "emerging": "Says only \"don't\"", "working": "Every red line has an \"instead, I…\"", "strong": "Each alternative is something they would actually do on a Monday"}, {"criterion": "It survives without the card", "emerging": "Long prose; needs re-reading", "working": "Short and scannable, fits one screen", "strong": "Short enough to recall at the moment of hesitation"}], "title": "The Red Lines: What Never Goes In"}, "html": "<h1>The Red Lines: What Never Goes In<\/h1>\n<blockquote>\n<p>The fastest way to stop using AI isn't a bad answer. It's a colleague saying \"careful what you put in that\" — and you, having no idea where the line is, quietly drawing it around everything. This lesson gets you a short list, in your own words, of what never goes in and what you do instead. One card. Then the fear stops making your decisions for you.<\/p>\n<\/blockquote>\n<h2>Start Here: The Elevator Test (5 minutes)<\/h2>\n<p>Open the last thing you pasted into an AI tool. If you can't think of one, open the last thing you <em>almost<\/em> pasted and backed out of — that hesitation is the more interesting artifact anyway.<\/p>\n<p>Read it, and mark anything you wouldn't read aloud in a crowded elevator.<\/p>\n<p>That's it. That's the instinct we're going to make explicit. You already have it; you just haven't written it down, which is why it fires as vague dread instead of a clear decision.<\/p>\n<h2>The Three Questions That Draw Your Lines (7 minutes)<\/h2>\n<p>Most people try to memorize a list of forbidden things and give up, because the list is infinite. Ask three questions instead. Any \"yes\" is a red line.<\/p>\n<p><strong>Is it someone else's to share?<\/strong> A customer's name. A colleague's performance conversation. A partner's numbers. If the person it belongs to didn't hand it to you for this, it isn't yours to paste.<\/p>\n<p><strong>Would a leak be impossible to take back?<\/strong> Some mistakes you can fix with an apology. Others you can't. Unreleased plans, anything under an agreement you signed, anything that would be a headline. The test isn't how likely it is to go wrong — it's whether you could undo it if it did.<\/p>\n<p><strong>Would I be embarrassed to be quoted?<\/strong> Not \"is it technically allowed\" — would you be comfortable if this exact text turned up in a screenshot with your name on it? Your gut is faster than any rulebook and it's usually right.<\/p>\n<p>Three questions, and they generate the list for you. That's better than a list, because next month there'll be a new kind of document nobody wrote a rule for, and you'll still know the answer.<\/p>\n<h2>What to Do Instead (5 minutes)<\/h2>\n<p>Here's where most people go wrong: they turn \"be careful\" into \"never use it,\" and then they're back to doing everything by hand. <strong>A red line isn't a stop sign. It's a swap.<\/strong><\/p>\n<p><strong>Strip the names.<\/strong> Most of the time it's the <em>identifiers<\/em> that are sensitive, not the problem. \"Acme is 60 days late on invoice 4471\" becomes \"a client is 60 days late on an invoice.\" The AI can help with the second one just as well, and it never needed the first.<\/p>\n<p><strong>Describe the shape instead of pasting the thing.<\/strong> You don't have to paste the contract to ask how people usually structure a termination clause. Describe what you're dealing with; ask about the kind, not the case.<\/p>\n<p><strong>Ask about the category, not your instance.<\/strong> \"How do teams usually handle X?\" gets you most of the value of \"here's our X, fix it,\" with none of the exposure.<\/p>\n<p><strong>And sometimes: do it by hand.<\/strong> That's a legitimate answer, not a failure. Some tasks aren't worth the care they'd require. Knowing which is which <em>is<\/em> the skill.<\/p>\n<h2>Assignment<\/h2>\n<p>Write your card. Keep it short enough that you'd actually remember it standing at your desk deciding whether to paste something.<\/p>\n<h3>Deliverables<\/h3>\n<ul>\n<li>my-red-lines.md — three to five red lines, each one line, each with an \"instead, I…\"<\/li>\n<li>One line at the bottom: where your organization's actual rules live (a link is fine — find it now, so you're not looking for it in the moment)<\/li>\n<li>One sentence: the line you'd have crossed last month if nobody had said anything<\/li>\n<\/ul>"}, "A6": {"meta": {"id": "A6", "courseId": "aware-foundations", "tier": "aware", "roleIds": ["pm", "coach", "designer", "leader", "engineer", "tl", "data"], "durationMin": 20, "creditHours": 1, "staircaseRung": 1, "buildsBehaviors": ["Tier 1: checks AI output against a repeatable check instead of a feeling", "Tier 1: can name one thing AI got wrong recently and how they caught it"], "rubric": [{"criterion": "The check is runnable", "emerging": "Abstract (\"verify accuracy\", \"check the facts\")", "working": "Three or four concrete questions answerable in under a minute", "strong": "Questions target the failure modes of their own work, not generic ones"}, {"criterion": "Grounded in a real catch", "emerging": "No example, or a hypothetical one", "working": "One real instance of AI being wrong, and how it was noticed", "strong": "The catch changed the check — a question exists because that catch taught it"}, {"criterion": "Honest about the limit", "emerging": "Implies they can always tell", "working": "Names at least one kind of error they could not catch themselves", "strong": "Names who or what they would escalate that kind of error to"}], "title": "Did It Get It Right?"}, "html": "<h1>Did It Get It Right?<\/h1>\n<blockquote>\n<p>Two people take this lesson. One used an AI answer, thought \"seems right,\" sent it, and has carried a low hum of unease ever since. The other won't touch the tool because they can't tell if it's making things up. Same missing skill, opposite symptoms, both stuck. Neither of them is going to learn statistics today. You'll leave with three questions you can actually run in a minute.<\/p>\n<\/blockquote>\n<h2>Start Here: How Do You Know? (5 minutes)<\/h2>\n<p>Take the last useful thing an AI gave you. Don't reopen the source.<\/p>\n<p>Now write one sentence: <strong>how do you know it was right?<\/strong><\/p>\n<p>Most people write some version of \"it sounded right.\" If that's your honest answer, you're exactly who this lesson is for. That's not a personal failing — it's the normal answer, and it's the whole problem in one sentence. Fluent writing feels like correct writing. Our brains have used that shortcut our entire lives, and it has worked, because until recently anything that well-written had a person behind it who knew things.<\/p>\n<h2>Confident and Wrong Is the Normal Failure (5 minutes)<\/h2>\n<p>Here's the part people get backwards. They expect AI to be wrong the way a broken machine is wrong — obviously, loudly, with something clearly off.<\/p>\n<p>It isn't. <strong>It's wrong the way a very poised person who didn't do the reading is wrong.<\/strong> Smooth, plausible, well-organized, and untrue. Nothing in the tone changes when it stops knowing. There's no wobble, no hedge, no tell.<\/p>\n<p>That's not a bug someone forgot to fix. It's the normal, expected behavior of a thing that produces what <em>usually<\/em> comes next — and what usually comes next is usually true, but \"usually\" isn't \"always.\" (If you've done <em>Why It Says What It Says<\/em>, this is that same one sentence, coming back to collect.)<\/p>\n<p>Which means: <strong>you cannot catch it by reading more carefully.<\/strong> Careful reading detects awkwardness, and there won't be any. You need a check that doesn't depend on how the text feels.<\/p>\n<h2>Your Three Questions (5 minutes)<\/h2>\n<p>Short enough to run in under a minute. Write them in your own words — these are mine.<\/p>\n<p><strong>Where would this have come from?<\/strong> If it's telling you a fact, a number, a name, a date — is there a place that fact could plausibly live? \"It knows because it's read a lot\" is not a source. If you can't name where it <em>would<\/em> have learned this, treat it as a guess wearing a suit.<\/p>\n<p><strong>Does it match one thing I already know for certain?<\/strong> Just one. You almost always know <em>something<\/em> about the topic — pick the fact you're surest of and check that. If it got the easy one wrong, stop reading and start over. If it got the easy one right, you've learned a little, not a lot.<\/p>\n<p><strong>What would it look like if it were wrong — and could I see that from here?<\/strong> This is the one that does the work. A wrong summary looks like a summary. A wrong number looks like a number. If the answer is \"wrong would look exactly like this,\" then <strong>you cannot check this from where you're standing<\/strong>, and that's your signal to go look at the source or ask someone who knows.<\/p>\n<h2>Assignment<\/h2>\n<p>Write the check, then run it once on something real today.<\/p>\n<h3>Deliverables<\/h3>\n<ul>\n<li>my-check.md — three or four questions in your own words, short enough to run in a minute<\/li>\n<li>A \"caught it\" log at the bottom, with the first entry filled in: one real time AI got something wrong, and what tipped you off. (If you genuinely don't have one yet, go find one — run your check on three things today and something will turn up. That hunt <em>is<\/em> the assignment.)<\/li>\n<li>One line: a kind of mistake your check would miss, and who you'd ask about it<\/li>\n<\/ul>"}, "A7": {"meta": {"id": "A7", "courseId": "aware-foundations", "tier": "aware", "roleIds": ["pm", "coach", "designer", "leader", "engineer", "tl", "data"], "durationMin": 25, "creditHours": 1, "staircaseRung": 1, "buildsBehaviors": ["Tier 1: reaches for AI unprompted at least once a week", "Tier 1: can name five recurring moments in their own week where AI fits, and what triggers each"], "rubric": [{"criterion": "Moments are recurring, not aspirational", "emerging": "Lists interesting or impressive tasks", "working": "Each moment demonstrably happened 2+ times last month", "strong": "Each names where it recurs — a standing meeting, a weekly ritual, a repeating email"}, {"criterion": "Each has a trigger, not an intention", "emerging": "\"Use AI for emails\"", "working": "\"When I'm about to write the Friday update…\"", "strong": "The trigger is attached to a cue that already happens without willpower"}, {"criterion": "Low-stakes, honestly", "emerging": "Includes work that touches customers, money, or production", "working": "All five are reversible and low-risk", "strong": "Names why each is low-risk, consistent with their own red lines"}], "title": "Catching the Moment: Where AI Fits in Your Week"}, "html": "<h1>Catching the Moment: Where AI Fits in Your Week<\/h1>\n<blockquote>\n<p>You had the first win. It worked. You liked it. Then you didn't open the tool again for three weeks. That's not fear and it's not distrust — those get their own lessons. It's that the moment never announced itself. This is the most common way Level 1 quietly ends, and it's fixable in twenty-five minutes with your calendar.<\/p>\n<\/blockquote>\n<h2>Start Here: Last Week's Repeats (5 minutes)<\/h2>\n<p>Open last week's calendar and your sent folder.<\/p>\n<p>Find three things you did <strong>more than once<\/strong>. Not three things you'd <em>like<\/em> to hand off. Three things you actually did twice.<\/p>\n<p>The list is usually boring. The status update. The same explanation to two different people. Reformatting someone else's notes. Boring is the point — boring and repeated is exactly where your twenty minutes are hiding. Nobody's minutes are hiding in the interesting work.<\/p>\n<h2>Why You Forget (7 minutes)<\/h2>\n<p>Here's what's actually happening, and it's worth saying plainly because most people read it as a character flaw:<\/p>\n<p><strong>The moment doesn't announce itself.<\/strong><\/p>\n<p>When the Friday update lands on you, nothing says \"this is one of those.\" It just feels like the Friday update — the same as it felt for the last four years. You're not under-informed. You've had the training. You could pass a quiz on this. <strong>You're un-cued.<\/strong><\/p>\n<p>That's the whole mechanism. Knowing that AI could help is a fact you already have. <em>Noticing, at 4:40pm on a Friday, that this specific chore is one of the ones<\/em> — that's a different thing entirely, and no amount of additional knowledge produces it.<\/p>\n<p>Which is why \"I'll try to use it more\" never works. You're asking your memory to fire at a moment your memory has no reason to notice. It won't. It never has, for anything.<\/p>\n<h2>Attach It to Something That Already Happens (7 minutes)<\/h2>\n<p>So don't rely on remembering. <strong>Attach it to a thing that already interrupts you.<\/strong><\/p>\n<p>Not: <em>\"I'll use AI more for updates.\"<\/em>\nBut: <em>\"When the Friday update lands in my calendar, I open the tool first.\"<\/em><\/p>\n<p>The difference matters more than it looks. The first one needs you to remember. The second one needs your calendar to remember, and your calendar is better at this than you are and never has a bad week.<\/p>\n<p>Good cues are things that already happen without you: a recurring meeting, a standing deadline, a specific email that always arrives, the moment you sit down after standup. Bad cues are feelings — \"when I have time,\" \"when I'm stuck.\" Those never arrive on schedule.<\/p>\n<p>Pick the cue first. Then the moment attaches to it.<\/p>\n<h2>Assignment<\/h2>\n<p>Five moments. One flagged. Then wait a week — the waiting is part of it.<\/p>\n<h3>Deliverables<\/h3>\n<ul>\n<li>my-moments.md — five recurring moments. For each: the moment, the trigger (\"when I'm about to…\"), and where it recurs (which meeting, which ritual, which email)<\/li>\n<li>Check each one against your red lines and cut any that cross one. If that leaves you with three, that's a true five-item list with two honest holes — say so<\/li>\n<li>Flag one as <strong>this week's<\/strong><\/li>\n<li>Next week, come back and mark which triggers actually fired. <strong>That mark is the lesson<\/strong> — the list is just the setup<\/li>\n<\/ul>"}, "A8": {"meta": {"id": "A8", "courseId": "aware-foundations", "tier": "aware", "roleIds": ["pm", "coach", "designer", "leader", "engineer", "tl", "data"], "durationMin": 20, "creditHours": 1, "staircaseRung": 1, "buildsBehaviors": ["Tier 1: talks about AI as a normal work tool rather than as hype or threat", "Tier 1: can explain in plain words why giving it more context changes the answer"], "rubric": [{"criterion": "Plain language", "emerging": "Uses borrowed technical words without owning them", "working": "No technical vocabulary; a non-technical colleague would follow it", "strong": "Uses an analogy from the learner's own work, not one we supplied"}, {"criterion": "Explains the why, not just the what", "emerging": "Describes what AI does", "working": "Explains why more context changes the answer", "strong": "Also explains why it can be confident and wrong — one cause, both effects"}, {"criterion": "Neither hype nor fear", "emerging": "Reads as sales copy, or as a warning", "working": "Matter-of-fact; names a real use and a real limit", "strong": "A skeptic would find it fair and an enthusiast would find it honest"}], "title": "Why It Says What It Says"}, "html": "<h1>Why It Says What It Says<\/h1>\n<blockquote>\n<p>Ask ten people what this thing actually is and you'll get two answers: magic, or glorified autocomplete. Neither one helps you decide whether to use it on Tuesday. There's one sentence that explains it, and almost everything else in this program falls out of that sentence — including why it's sometimes wonderful and why it's sometimes confidently, fluently wrong.<\/p>\n<\/blockquote>\n<h2>Start Here: Finish the Sentence (3 minutes)<\/h2>\n<p>Write down how you'd finish this, right now, before you read on:<\/p>\n<blockquote>\n<p>\"AI is basically a ______.\"<\/p>\n<\/blockquote>\n<p>Don't overthink it. Whatever you'd say to your neighbor. Keep it somewhere — you'll write it again at the end, and the gap between the two is the entire lesson.<\/p>\n<h2>The One Thing It Does (7 minutes)<\/h2>\n<p>Here it is:<\/p>\n<blockquote>\n<p><strong>It writes what plausibly comes next, based on what's in front of it.<\/strong><\/p>\n<\/blockquote>\n<p>That's the whole thing. It has read an enormous amount of writing, and it has become extraordinarily good at one narrow trick: given some text, produce what would most plausibly follow.<\/p>\n<p>That's not a put-down. \"What would plausibly follow\" is a <em>staggeringly<\/em> useful thing to be good at, because most of what we write at work is, honestly, fairly predictable — and the predictable parts are the parts that eat your afternoon.<\/p>\n<p>But notice what's <em>not<\/em> in that sentence. It doesn't say \"it looks up the answer.\" Unless you've handed it something to read, or someone has deliberately connected it to a source, <strong>it isn't looking anything up.<\/strong> It's producing what would plausibly follow. Sometimes what would plausibly follow is the correct answer — often, even. That's not the same as having checked.<\/p>\n<p>Mine is: it's like the most well-read colleague you've ever met, answering instantly, from memory, at a party, with total confidence, and no way to look anything up. That analogy is fine. Yours will be better, because yours will come from your own work.<\/p>\n<h2>Everything Else Follows From That (7 minutes)<\/h2>\n<p>Three things fall out of that one sentence. You've met all three already; this is why they're true.<\/p>\n<p><strong>Why more context changes the answer.<\/strong> If it produces what plausibly comes next <em>based on what's in front of it<\/em>, then changing what's in front of it changes what comes next. \"Write an update\" and \"write an update, for my skeptical director, about this project, here are the notes\" aren't the same request with more decoration — they're genuinely different situations, so they get genuinely different plausible continuations. That's why you tell it three things. Not politeness. Mechanics.<\/p>\n<p><strong>Why it can be smooth and wrong at the same time.<\/strong> It's aiming at <em>what usually follows<\/em>. What usually follows is usually true — that's why it works at all. But \"usually\" isn't \"always,\" and here's the sting: <strong>nothing in the writing changes when it slips from usually-true to not-true.<\/strong> The tone doesn't wobble. Fluency isn't evidence of anything except fluency. That's the whole reason you need a check that doesn't depend on how the text feels.<\/p>\n<p><strong>Why what you hand it matters.<\/strong> What you give it is what it works from. That's the useful version — and it's the same reason your red lines exist. It isn't a vault; it's a workspace. What you put on the desk is what's on the desk.<\/p>\n<p>One sentence. Three consequences. That's your picture of how it works, and it will hold up better than any list of tips, because you can extend it to situations nobody taught you.<\/p>\n<h2>Assignment<\/h2>\n<p>Write the explanation you'd actually give a skeptical colleague — the one who thinks it's nonsense, or the one who thinks it's magic. Same explanation works on both.<\/p>\n<h3>Deliverables<\/h3>\n<ul>\n<li>my-90-second-explanation.md — in your own words, no technical terms, roughly 90 seconds spoken. Use an analogy from your own work, not mine<\/li>\n<li>Rewrite \"AI is basically a ______\" at the bottom<\/li>\n<li>If your new sentence is identical to the one you wrote at the start, say so. <strong>That's a real result and we want to know<\/strong> — it means this lesson didn't land, and that's our defect, not yours<\/li>\n<\/ul>"}, "A9": {"meta": {"id": "A9", "courseId": "aware-foundations", "tier": "aware", "roleIds": ["pm", "coach", "designer", "leader", "engineer", "tl", "data"], "durationMin": 20, "creditHours": 1, "staircaseRung": 1, "buildsBehaviors": ["Tier 1: names a state question the tool failed to answer instead of concluding they can't use it", "Tier 1: treats a clean-looking output as a draft to check, not a verdict"], "rubric": [{"criterion": "Names the real gap", "emerging": "Blames their own ability", "working": "Identifies a state question the tool didn't answer (was it working? did it finish? did it need me?)", "strong": "Tells a legibility gap apart from a genuine skill gap, and says which this was"}, {"criterion": "Meets AI in their own work", "emerging": "Picks a developer-flavored task, or none", "working": "Names a task from the work they already do", "strong": "The task is specific and low-risk, with a reason it's a good first try"}, {"criterion": "Holds the output at arm's length", "emerging": "Treats a clean-looking answer as correct", "working": "Names one output they'll re-check before trusting", "strong": "Says how they'll check it, not just that they will"}], "title": "You're Not Behind"}, "html": "<h1>You're Not Behind<\/h1>\n<blockquote>\n<p>You watched someone make the tool do something impressive, and a quiet voice said: everyone else gets this, and you don't. That voice has one thing backwards. A tool being hard to <em>read<\/em> is not the same as you being bad at it — and most of what feels like \"I can't do this\" is really the tool failing to tell you what it's doing. This lesson is about telling those two apart, so the next confusing moment doesn't send you all the way back to not using it at all.<\/p>\n<\/blockquote>\n<h2>Start Here: The Moment It Made You Feel Dumb (5 minutes)<\/h2>\n<p>Think of one time an AI tool made you feel behind. It sat there doing nothing, or it did something strange, or you finished and still weren't sure it had worked.<\/p>\n<p>Write one sentence about what happened. Don't fix it, don't explain it — just name it. We'll come back to it.<\/p>\n<h2>It's Legibility, Not You (5 minutes)<\/h2>\n<p>Here is what was usually <em>actually<\/em> wrong in that moment: you couldn't tell whether the thing was working, waiting on you, or broken. No spinner, no \"done,\" no undo, no way to see where it was. That is not a gap in your knowledge. It's the tool not showing its state.<\/p>\n<p>There's a plain word for this: <strong>legibility<\/strong> — can you read what the thing is doing. Most of what people call \"too technical\" is really \"I couldn't tell what was happening.\" And that reframes the whole feeling, because the useful question stops being <em>what's wrong with me<\/em> and becomes: <strong>what did I want to know and couldn't?<\/strong> That question you can actually answer — and it almost always points at the tool, not at you.<\/p>\n<h2>You Don't Need Their Workflow (5 minutes)<\/h2>\n<p>The other trap is believing you have to learn the <em>developer<\/em> way of working — the black screen, the typed commands, the setup steps — before you're allowed to get value. You don't.<\/p>\n<p>Start where you already are, with the things you already make: a document, an email, a spreadsheet, a summary, a first draft. The tools sometimes look like they belong to engineers, and honestly, some of them do — but that's a front-door problem for the people who build the tools to solve, not a competence problem for you. You are not late to a race. You're being handed a tool through an awkward doorway.<\/p>\n<h2>A Passing Check Isn't Proof (5 minutes)<\/h2>\n<p>One last one, because it's the flip side of feeling behind — sometimes the tool makes you feel <em>too<\/em> good. The answer comes back clean, well-organized, confident, so it must be right.<\/p>\n<p>Not necessarily. A polished answer can be smoothly, completely wrong, and nothing in how it looks will warn you. (You'll get three quick ways to catch that in <em>Did It Get It Right?<\/em>.) For now, hold just one idea: <strong>a clean-looking answer is a draft to check, not a verdict.<\/strong> Feeling behind and over-trusting a nice-looking answer turn out to be the same mistake — reading the surface instead of the state.<\/p>\n<h2>Assignment<\/h2>\n<p>Turn the moment you named at the top into something you can act on.<\/p>\n<h3>Deliverables<\/h3>\n<ul>\n<li><code>not-behind.md<\/code> — the moment you wrote down, rewritten as a <strong>state question<\/strong> the tool failed to answer (\"was it working? did it finish? did it need me?\")<\/li>\n<li>One thing <strong>you already make<\/strong> that you'll try AI on this week — not a developer task, your actual work<\/li>\n<li>One line: an answer that <em>looked<\/em> right, which you'll double-check before you trust it — and how<\/li>\n<\/ul>"}, "B1": {"meta": {"id": "B1", "courseId": "enabled-pm", "tier": "enabled", "roleIds": ["pm", "coach"], "durationMin": 25, "creditHours": 1, "staircaseRung": 2, "buildsBehaviors": ["Tier 2: structures workspace files so retrieval AI reliably finds them", "Tier 2: writes retrieval-friendly titles and summaries as a routine habit"], "libraryRefs": ["context-engineering"], "title": "AI-Ready PM Workspace"}, "html": "<h1>AI-Ready PM Workspace<\/h1>\n<blockquote>\n<p>Copilot 365 and retrieval-based AI tools are only as smart as the files they can find. This lesson redesigns your workspace so that every file is findable, every document is AI-parseable, and every retrieval query returns what you actually need.<\/p>\n<\/blockquote>\n<h2>The Retrieval Problem<\/h2>\n<p>Most Microsoft 365 workspaces fail AI retrieval for the same reasons: files are named after dates instead of purpose, there are no index documents, and folders mix work types (meetings, decisions, specs, and reference material all share a folder). Copilot doesn't know what a file is for — it infers from the file name, folder path, and first paragraph. All three need to be signal-rich. (This lesson is the retrieval-tool form of a larger discipline tracked in the Evolution Library: see the context-engineering entry.)<\/p>\n<h2>The AI-Ready File Structure<\/h2>\n<p>A product workspace that works with AI has: a <strong>/specs<\/strong> folder (PRDs, tech specs, one-pagers), a <strong>/decisions<\/strong> folder (ADRs, trade-off documents), a <strong>/meetings<\/strong> folder (structured meeting notes with clear outcome sections), a <strong>/prompts<\/strong> folder (your prompt library), and an <strong>index.md<\/strong> or <strong>README.md<\/strong> in each folder describing its purpose. The index file is the single highest-leverage 15-minute investment you can make.<\/p>\n<h2>Writing Retrieval-Friendly Content<\/h2>\n<p>AI retrieval matches on keywords in context. Write document titles as questions or clear statements: 'Q3 2026 Checkout Redesign — Decision Log' beats 'checkout-v2-final-FINAL.docx'. Start every document with a 2-3 sentence summary. Use consistent section headings across all documents of the same type. The 5 minutes you spend on naming and structure saves 20 minutes every time you or a teammate searches.<\/p>\n<h2>Assignment<\/h2>\n<p>Restructure one product area's SharePoint or Teams folder to follow the AI-ready file structure. Write or update the index document for that area. Demonstrate one retrieval query that now works reliably.<\/p>\n<h3>Deliverables<\/h3>\n<ul>\n<li>ai-ready-file-org.md: your actual folder structure with the new layout and naming conventions<\/li>\n<li>index.md (or equivalent) for one restructured folder — minimum 5 sections<\/li>\n<li>3 example Copilot retrieval queries that now work reliably against this structure<\/li>\n<li>Before/after note: what queries failed before, and why they work now<\/li>\n<\/ul>"}, "B1D": {"meta": {"id": "B1D", "courseId": "enabled-design", "tier": "enabled", "roleIds": ["designer"], "durationMin": 25, "creditHours": 1, "staircaseRung": 2, "buildsBehaviors": ["Tier 2: describes screens in component/variant/state language, not visual language", "Tier 2: includes accessibility constraints in every UI description"], "title": "Describing UI in System Language"}, "html": "<h1>Describing UI in System Language<\/h1>\n<blockquote>\n<p>Design tools powered by AI work best when designers speak the same language as the system. This lesson teaches you to describe any screen in terms that feed directly into Storybook, engineering specs, and AI design tools — eliminating the translation layer that currently sits between design and engineering.<\/p>\n<\/blockquote>\n<h2>Component Language vs. Visual Language<\/h2>\n<p>Designers naturally describe what they see: 'a blue button with rounded corners and a shadow.' Engineers and AI tools need to know what the thing is: 'Button, variant=primary, size=md, state=default, with icon-left.' The shift from visual to component language is the single most impactful change a designer can make for AI-assisted workflows.<\/p>\n<p>Component language maps to: component name (from your design system), variant (from the component's variant set), state (default, hover, focus, disabled, loading, error), and props (the data it displays).<\/p>\n<h2>Layout Regions and Hierarchy<\/h2>\n<p>Before describing individual components, describe the layout: what regions exist (header, sidebar, content, footer, overlay), what the primary content hierarchy is (what's most important on this screen), and how the regions relate (which regions are fixed, which scroll, which collapse). This layout map is the skeleton that makes the component descriptions meaningful.<\/p>\n<h2>Accessibility as a Specification Constraint<\/h2>\n<p>Accessibility requirements belong in the description, not in a separate doc. Every component description should note: keyboard navigation behavior, screen reader label, focus order, and any WCAG constraint that affects the implementation. AI tools that receive these constraints generate implementations that don't require accessibility retrofits — the most expensive design debt a team can accumulate.<\/p>\n<h2>Assignment<\/h2>\n<p>Choose one screen from your current product. Write a complete structured description: layout regions, component inventory with system language, data elements, states, and accessibility constraints. This document should be reviewable by an engineer without any verbal explanation from you.<\/p>\n<h3>Deliverables<\/h3>\n<ul>\n<li>ui-layout-[screen].md: layout regions → component inventory → data elements → states → accessibility<\/li>\n<li>All components described using design-system names and variant/state language<\/li>\n<li>At least 3 states documented (including one error or empty state)<\/li>\n<li>2 accessibility constraints explicitly called out<\/li>\n<\/ul>"}, "B1E": {"meta": {"id": "B1E", "courseId": "enabled-eng", "tier": "enabled", "roleIds": ["engineer", "tl", "data"], "durationMin": 25, "creditHours": 1, "staircaseRung": 2, "buildsBehaviors": ["Tier 2: maintains a CLAUDE.md and service boundary docs for owned projects", "Tier 2→3: gives agentic tools durable context instead of re-explaining each session"], "libraryRefs": ["context-engineering"], "title": "Engineering AI Context Files"}, "html": "<h1>Engineering AI Context Files<\/h1>\n<blockquote>\n<p>Agentic AI tools are only as good as the context they start with. This lesson builds the context files that turn generic AI assistants into domain-aware engineering collaborators: CLAUDE.md, architecture decision records, and service boundary docs.<\/p>\n<\/blockquote>\n<h2>The CLAUDE.md Pattern<\/h2>\n<p>A CLAUDE.md (or AGENTS.md, or COPILOT.md — the name matters less than the habit) is a project-level context file that the AI reads at the start of every agentic session. It contains: project purpose (2 sentences), tech stack (exact versions), architectural patterns (what the team agreed on), naming conventions, test patterns, things the AI must not do, and pointers to where key files live.<\/p>\n<p>Without it, every agentic session starts from zero. With it, the AI inherits months of team decisions instantly. (Why durable context files became standard practice — and how context management evolved past prompt-stuffing — is tracked in the Evolution Library: see the context-engineering entry.)<\/p>\n<h2>Architecture Decision Records<\/h2>\n<p>ADRs are the highest-leverage documents an AI-native engineering team can maintain. They record: the context, the decision, the alternatives considered, the consequences, and the status. An AI with access to your ADR log can explain any architectural choice, flag when new work violates an existing decision, and synthesize tradeoffs across decisions. A team without ADRs asks the AI to make architectural choices without knowing the history — the worst possible input.<\/p>\n<h2>Service Boundary Documents<\/h2>\n<p>Every service or module should have a 1-page boundary doc: what it does, what it doesn't do, who calls it, what it calls, its SLA, and its failure modes. These docs feed directly into AI-assisted code review, incident response, and onboarding. A team that maintains them gets AI assistance that knows the system. A team that doesn't gets generic advice that must be manually filtered for applicability.<\/p>\n<h2>Assignment<\/h2>\n<p>Write a complete CLAUDE.md for your primary current project. Write a service boundary doc for one service you own. Demonstrate how the two documents together enable a more specific and accurate AI response on a real engineering task.<\/p>\n<h3>Deliverables<\/h3>\n<ul>\n<li>CLAUDE.md: all required sections filled, no placeholder text<\/li>\n<li>service-boundary-[name].md: capabilities, consumers, contracts, dependencies, SLA, failure modes<\/li>\n<li>A before/after prompt demonstration: same engineering question, with and without these context files<\/li>\n<\/ul>"}, "B2": {"meta": {"id": "B2", "courseId": "enabled-pm", "tier": "enabled", "roleIds": ["pm", "coach"], "durationMin": 25, "creditHours": 1, "staircaseRung": 2, "buildsBehaviors": ["Tier 2: writes minimum viable context before prompting for PM artifacts", "Tier 2: edits AI output critically — flags missing evidence, numbers, failure cases"], "libraryRefs": ["ai-product-discovery"], "title": "AI-Assisted PRDs and Stakeholder Comms"}, "html": "<h1>AI-Assisted PRDs and Stakeholder Comms<\/h1>\n<blockquote>\n<p>AI can accelerate PRD drafting, stakeholder email writing, and user problem synthesis — but only if the PM provides structured context first. This lesson builds the workflow that turns rough notes into polished PM artifacts without losing product substance.<\/p>\n<\/blockquote>\n<h2>The Structured Context Pattern for PRDs<\/h2>\n<p>Before prompting an AI to draft a PRD, write the minimum viable context: problem statement (2 sentences), user and their goal, what success looks like, what's out of scope, and one key constraint. With this context, AI produces a solid first draft. Without it, AI produces a plausible-looking document with fabricated details that take longer to fix than starting from scratch.<\/p>\n<h2>Audience Rewrites<\/h2>\n<p>The most underused PM AI superpower: take one set of facts and produce three versions — engineering spec, executive summary, and customer-facing announcement — without losing technical nuance in any of them. The prompt pattern: 'Rewrite the following for [audience]. Preserve all technical constraints and numbers exactly. Change only the framing and vocabulary.' This alone eliminates a large share of the time PMs spend on communication work.<\/p>\n<h2>Identifying Weak AI Output<\/h2>\n<p>AI-generated PM artifacts fail in predictable ways: they sound authoritative but lack specifics, they omit failure modes, they invent user research that wasn't provided (the discovery-cosplay failure mode — see the ai-product-discovery Evolution Library entry), and they use vague success criteria ('improve user satisfaction'). Train yourself to flag these on first read: where is the evidence? Where is the number? Where is the failure case? If you can't find them, they need to come from you, not from a second AI prompt.<\/p>\n<h2>Assignment<\/h2>\n<p>Use AI to draft one real PRD section (problem statement, user stories, or acceptance criteria) for a feature you're currently working on. Document the context you provided, the first AI draft, your critique of the draft, and the final version after revision.<\/p>\n<h3>Deliverables<\/h3>\n<ul>\n<li>copilot-prd-workflow.md: context provided → first draft → critique → final draft<\/li>\n<li>Critique must identify at least 2 specific weaknesses in the AI draft<\/li>\n<li>Final version must resolve all identified weaknesses<\/li>\n<li>One 'audience rewrite' demonstration: same content for two different audiences<\/li>\n<\/ul>"}, "B2D": {"meta": {"id": "B2D", "courseId": "enabled-design", "tier": "enabled", "roleIds": ["designer"], "durationMin": 25, "creditHours": 1, "staircaseRung": 2, "buildsBehaviors": ["Tier 2: structures research notes before asking AI to synthesize", "Tier 2: distinguishes AI-found patterns from fabricated findings"], "libraryRefs": ["ai-product-discovery"], "title": "AI-Assisted UX Research Synthesis"}, "html": "<h1>AI-Assisted UX Research Synthesis<\/h1>\n<blockquote>\n<p>Research synthesis is the highest-volume cognitive task in design. AI can compress synthesis work to a fraction of its manual time — if you provide structured notes rather than raw transcripts. This lesson builds the workflow.<\/p>\n<\/blockquote>\n<h2>The Structured Research Note Format<\/h2>\n<p>Raw transcripts fail AI synthesis because the signal-to-noise ratio is too low. The fix: turn transcripts into structured notes before prompting. Format: participant label, task they were performing, observation (what happened), and interpretation (what it might mean). When every note has this structure, AI can cluster themes, identify contradictions, and surface patterns that would take hours to find manually.<\/p>\n<h2>From Synthesis to Design Brief<\/h2>\n<p>AI can transform a structured research synthesis into a design brief in one step — if the synthesis is specific enough. The prompt: 'Given these research findings, identify: (1) the top 3 user goals, (2) the top 3 friction points, (3) one design principle that should guide this feature.' The output becomes the first section of your design spec. Review it for accuracy; don't fabricate findings that aren't in your research. (Where AI acceleration ends and evidence substitution begins — including why synthetic users flatter concepts real users reject — is tracked in the Evolution Library: see the ai-product-discovery entry.)<\/p>\n<h2>Design System Language<\/h2>\n<p>Before engaging Figma AI or any AI design tool, translate your design intent into design-system language: component names (not visual descriptions), token names (not hex values), state names (not visual behaviors). 'A button that turns blue when hovered' costs Figma AI credits to interpret. 'A Button component, variant=primary, state=hover' is processed in one shot. The translation step belongs in a chat window before you open Figma.<\/p>\n<h2>Assignment<\/h2>\n<p>Take research notes from a real usability study or user interview (use sanitized data if needed). Structure them in the observation/interpretation format. Run synthesis through AI and produce a design brief. Evaluate what the AI got right and what required your judgment.<\/p>\n<h3>Deliverables<\/h3>\n<ul>\n<li>research-synthesis-[feature].md: structured notes (min 8 observations) → AI synthesis → design brief<\/li>\n<li>Design brief: top 3 user goals, top 3 friction points, 1 design principle<\/li>\n<li>Critique: 2 AI synthesis points you kept, 2 you revised, 1 it missed entirely<\/li>\n<li>One component description in design-system language ready for Figma AI<\/li>\n<\/ul>"}, "B2E": {"meta": {"id": "B2E", "courseId": "enabled-eng", "tier": "enabled", "roleIds": ["engineer", "tl", "data"], "durationMin": 25, "creditHours": 1, "staircaseRung": 2, "buildsBehaviors": ["Tier 2: anchors code-review prompts in team conventions and boundary docs", "Tier 2: provides the 'why' as context when generating documentation"], "title": "AI-Assisted Code Review and Documentation"}, "html": "<h1>AI-Assisted Code Review and Documentation<\/h1>\n<blockquote>\n<p>AI-assisted code review and documentation works only when the AI has architecture context. This lesson builds the workflow that gets useful, project-specific AI feedback — not generic advice that ignores your patterns.<\/p>\n<\/blockquote>\n<h2>The Code Review Prompt Pattern<\/h2>\n<p>Generic code review prompt: 'Review this code.' Result: generic advice. Structured code review prompt: 'Review this code for: (1) alignment with our naming conventions [see CLAUDE.md], (2) test coverage of edge cases in the acceptance criteria [attached], (3) any missing error handling for the failure modes in our service boundary doc.' Result: specific, actionable feedback tied to your actual system.<\/p>\n<p>The difference is 3 minutes of prompt structuring vs. 30 minutes of filtering irrelevant feedback.<\/p>\n<h2>Documentation Generation<\/h2>\n<p>AI-generated documentation is only as good as the code context it receives. For function-level docs: provide the function, its callers, and the business rule it implements. For module-level docs: provide the module's service boundary doc as context. For architecture docs: provide your ADR log and let AI synthesize the narrative. Never generate docs without providing the 'why' — AI generates the 'what' fine on its own but invents the 'why' badly.<\/p>\n<h2>Test Generation from Specs<\/h2>\n<p>The highest-ROI engineering AI workflow: write acceptance criteria in structured format → AI generates test skeletons → engineer fills in test data. The AI handles the boilerplate; the engineer handles the judgment. For this to work, acceptance criteria must include: happy path, edge cases, error conditions, and performance constraints. If your ACs don't include these, fix the AC first — the test generation will reveal the gaps.<\/p>\n<h2>Assignment<\/h2>\n<p>Run AI-assisted code review on a real PR or code change in your current project. Use your CLAUDE.md and service boundary doc as context. Document what the AI caught that manual review would have missed, and what the AI missed that you caught.<\/p>\n<h3>Deliverables<\/h3>\n<ul>\n<li>code-review-workflow.md: the prompt pattern, context provided, AI output, your additions<\/li>\n<li>At least 2 'AI caught' items and 2 'human caught' items — with analysis of why<\/li>\n<li>A documentation draft for one function or module generated with proper context<\/li>\n<li>One test skeleton generated from structured acceptance criteria<\/li>\n<\/ul>"}, "B3": {"meta": {"id": "B3", "courseId": "enabled-pm", "tier": "enabled", "roleIds": ["pm", "coach", "engineer", "designer"], "durationMin": 25, "creditHours": 1, "staircaseRung": 2, "buildsBehaviors": ["Tier 2: writes Given/When/Then acceptance criteria including unhappy paths", "Tier 2: rejects AI test plans that invent behavior"], "libraryRefs": ["evaluation-practice", "shift-left-economics"], "title": "User Stories to AI-Assisted Test Plans"}, "html": "<h1>User Stories to AI-Assisted Test Plans<\/h1>\n<blockquote>\n<p>AI can generate manual test plans from user stories — but only if the stories have proper acceptance criteria. This lesson builds both: the story format that enables AI test generation, and the test plan structure that catches what AI misses. (Why catching it here is cheap and catching it in production isn't — the economics of the left — is tracked in the shift-left-economics Evolution Library entry.)<\/p>\n<\/blockquote>\n<h2>The Acceptance Criteria Format That Works<\/h2>\n<p>User stories that AI can convert to tests have acceptance criteria in this format: 'Given [context], When [action], Then [observable outcome].' Each criterion must describe something observable (not an internal system state), include the unhappy path, and specify the data. 'The form should validate correctly' is not a criterion. 'Given an empty email field, when the user clicks Submit, then a red error message appears below the email field reading \\\"Email is required\\\"' is a criterion.<\/p>\n<h2>Test Categories<\/h2>\n<p>AI generates test scenarios in predictable categories: happy path (everything works), edge cases (boundary values, empty inputs, max lengths), error handling (system failures, network errors, permission denials), permissions (role-based access), accessibility (keyboard, screen reader), and regression (things that must not break). For backend work, add: dependency failures, observability checkpoints (is the event logged?), and SLA validation.<\/p>\n<p>AI reliably generates the first three categories. Human judgment is required for permissions, accessibility, regression scope, and backend observability.<\/p>\n<h2>Quality Criteria for AI-Generated Test Plans<\/h2>\n<p>Before accepting an AI-generated test plan, check: (1) Does every test have a specific expected result — not 'it should work correctly'? (2) Are dependency failures tested for backend scenarios? (3) Are edge cases based on the actual data constraints in the acceptance criteria, not invented by the AI? (4) Are there any invented behaviors — tests for features not described in the story? Reject and return tests that invent behavior. (How evaluation practice itself has evolved — from eyeballing to rubrics like these to production eval harnesses — is tracked in the Evolution Library: see the evaluation-practice entry.)<\/p>\n<h2>Assignment<\/h2>\n<p>Take one real user story from your current sprint. Improve its acceptance criteria to the Given/When/Then format. Use AI to generate a test plan. Evaluate the output against the quality criteria and produce a final test plan with your revisions noted.<\/p>\n<h3>Deliverables<\/h3>\n<ul>\n<li>manual-test-plan-[story].md: original AC → improved A
