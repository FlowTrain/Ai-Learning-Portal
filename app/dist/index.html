aseRung": 2, "buildsBehaviors": ["Tier 4 literacy: directs AI investment to context, standards, and documents rather than to usage volume or seat count", "Tier 4 literacy: measures adoption by completed work product from non-engineers, not by seats deployed"], "rubric": [{"criterion": "Investment aimed at the asset", "emerging": "Assumes usage or more seats will create the capability", "working": "Directs spend toward context, standards, and documents", "strong": "Names the specific document or asset that would carry the knowledge, and who owns it"}, {"criterion": "Adoption measured honestly", "emerging": "Counts seats deployed", "working": "Counts completed work product by non-engineers", "strong": "Names the specific work product and how they would see it get reused"}, {"criterion": "Front door vs. workshop", "emerging": "Expects one tool to do everything", "working": "Classifies the need as Q&A/triggering (front door) or artifact-building (workshop)", "strong": "Matches the tool to the job and can say what the other kind of tool is for"}], "title": "What Leaders Get Wrong About AI"}, "html": "<h1>What Leaders Get Wrong About AI<\/h1>\n<blockquote>\n<p>You funded the rollout. Seats are deployed, the dashboard says adoption is climbing, and yet six months in the only people finishing real work with it are the engineers who'd have figured it out on their own. That's not a model problem, and it's usually not a people problem. It's four quiet beliefs that send an AI budget to the wrong place. This is literacy, not architecture — you're learning to fund it, measure it, and place it well, so your architects build the right thing.<\/p>\n<\/blockquote>\n<h2>Start Here: Name the Payoff You Assumed (5 minutes)<\/h2>\n<p>Take one AI investment you've made or are weighing — a license rollout, a pilot, a platform. Write, in one line, the payoff you assumed it would produce. Hold that line; we'll test it against four things that are easy to get backwards.<\/p>\n<h2>Usage Doesn't Teach It (5 minutes)<\/h2>\n<p>The most expensive assumption is that the tool learns your organization the more you use it. It doesn't. The model's knowledge is fixed; nothing about it changes between sessions from your usage. What improves is the <em>context you supply<\/em> — your standards, your templates, your examples — and that improvement lives in those documents, not in usage volume.<\/p>\n<p>The frame that keeps the money in the right place: you're not training a colleague who gets to know you over time. You're writing very good onboarding docs for an extremely fast contractor with no memory. <strong>The docs are the asset.<\/strong> Fund the context and the standards, not the hope that more clicks accrue institutional knowledge.<\/p>\n<h2>Seats Aren't Adoption (5 minutes)<\/h2>\n<p>Seats deployed behind a tool that no one outside engineering voluntarily opens is not adoption — it's shelfware with a login. The only measure that means anything is <em>completed work product by people who aren't engineers<\/em>.<\/p>\n<p>So the question for your next review isn't how many licenses are active. It's: <strong>how many people outside engineering finished something real with it last month?<\/strong> If that number is small, more seats won't fix it, and neither will more training — the gap is usually that the tool never met them in the work they already do.<\/p>\n<h2>One Tool Isn't the Front Door for Everything (5 minutes)<\/h2>\n<p>The last one is a category error. There are two different jobs, and one tool rarely does both well. A <strong>reception desk<\/strong> answers role-based questions and triggers workflows, lands where people already are, and is governed centrally — excellent, and not the same thing as a <strong>workshop<\/strong> that builds real artifacts through an iterate-and-verify loop. Someone always asks the reception desk to produce a spec, and is always disappointed. Decide which one you're funding before the pilot, not after.<\/p>\n<p>And when someone hands you a recommendation by brand — \"we'll use Copilot\" — ask <em>which<\/em> one. Products that share a name can behave completely differently, and the specifics change fast; that's a question for your architects, not an assumption to fund on.<\/p>\n<h2>Assignment<\/h2>\n<p>Pressure-test one real AI investment against the four.<\/p>\n<h3>Deliverables<\/h3>\n<ul>\n<li><code>ai-investment-read.md<\/code> — for one AI spend:<\/li>\n<li><strong>where the value actually accrues<\/strong> (context/standards/documents vs. \"the tool will learn us\")<\/li>\n<li><strong>the adoption measure that means something<\/strong> (work finished by non-engineers, named specifically)<\/li>\n<li><strong>a front-door-vs-workshop call<\/strong> — which job is this, and what's the other kind of tool for<\/li>\n<li>One line: something you'll <strong>stop<\/strong> funding because this read exposed it as the wrong bet<\/li>\n<\/ul>"}}, "library": {"agent-orchestration": {"meta": {"id": "agent-orchestration", "practice": "Agent Orchestration", "status": "current", "last_reviewed": "2026-07-10", "review_cadence": "quarterly", "model_generations": ["single-chat-era", "chain-era", "multi-agent-2026"], "referenced_by": ["A3", "A3E", "C1", "D1"], "curators": ["platform-owner"], "title": "Evolution Entry: Agent Orchestration (Single Chat → Chains → Multi-Agent)"}, "html": "<h1>Evolution Entry: Agent Orchestration (Single Chat → Chains → Multi-Agent)<\/h1>\n<h2>Current guidance (teach this today)<\/h2>\n<p>Decompose first, delegate second, multiply agents last — and only against evidence:<\/p>\n<ul>\n<li><strong>The chain is still the backbone.<\/strong> Break multi-step work into named steps with verified outputs between them (the A3/C1 layer). Every orchestration pattern in production is this idea with more machinery.<\/li>\n<li><strong>Multiply agents only against a measured ceiling.<\/strong> The 2026 correction to multi-agent enthusiasm: coordination is not free. Multi-agent topologies carry substantial token overhead (reported ~58% for independent setups to ~285% for centralized ones, as of 2026), and compute-normalized comparisons show a single well-contexted agent often <em>matches<\/em> a multi-agent system on reasoning tasks. Reach for multiple agents when you can name the single-agent ceiling you're escaping: a recurring failure mode a specialist would catch, a latency wall parallelism would break, or a quality bar a critic measurably raises — which means you need an eval before you need a second agent (see evaluation-practice).<\/li>\n<li><strong>When you do orchestrate, use the boring topology.<\/strong> Orchestrator-worker — a planner that decomposes and dispatches to specialized workers (researcher / implementer / tester / reviewer), then merges — accounts for the large majority (~70%) of production deployments. The exotic patterns (debate, swarm) are for named problems, not defaults.<\/li>\n<li><strong>Every agent gets a contract.<\/strong> Bounded scope, explicit tool inventory with input/output schemas, a failure protocol (never silent), and an audit log — D1's four properties. An agent without a contract is a liability with initiative.<\/li>\n<li><strong>The reviewer agent is the cheapest win.<\/strong> One agent checking another's output against criteria measurably reduces hallucinated and unsafe output — it's the critique step of the A3 chain, given a permanent seat.<\/li>\n<\/ul>\n<h2>Eras<\/h2>\n<h3>Era 1 — Single chat (~2022–2023)<\/h3>\n<p>One conversation did everything: research, drafting, revision, formatting, in a single thread with a single context. The human <em>was<\/em> the orchestrator — copy-pasting between windows, carrying state in their head, re-explaining after every context overflow. Model context: no tool use, no memory, weak planning; there was nothing to orchestrate but the person's patience.<\/p>\n<h3>Era 2 — Chains (2023–2025)<\/h3>\n<p>Decomposition became the practice: clarify → generate → critique → refine, each step's output verified before becoming the next step's input. The value was inspectability — one long prompt's unpredictable output traded for short steps a human could gate. Human judgment stayed at the joints, explicitly placed where consequences were irreversible (the A3 rule). Chains written down became team assets, then skills (C3). This era's discipline — acceptance criteria per step, before the prompt — is what made everything after it possible.<\/p>\n<h3>Era 3 — Multi-agent orchestration (2025–2026)<\/h3>\n<p>Models got planning, tool use, and long-running autonomy; the chain's stations got staffed. Orchestrator-worker became the production default, with a recognized pattern vocabulary (fan-out, pipeline, debate, supervisor, swarm) and reviewer/critic agents as standard quality machinery. Where the value moved: from prompt wording (era 1) to decomposition (era 2) to <strong>coordination design<\/strong> — agent interfaces, tool contracts, review loops, and failure protocols are now where the engineering lives. And era 3 promptly generated its own correction: compute-normalized studies showing single agents matching multi-agent systems forced the discipline of justifying every added agent with a measured ceiling rather than architectural fashion.<\/p>\n<h2>Deprecated patterns (stop teaching these)<\/h2>\n<ul>\n<li>❌ <strong>One giant prompt for multi-step work<\/strong> — era-1 practice; decompose into inspectable steps (also deprecated in prompting-frameworks).<\/li>\n<li>❌ <strong>Multi-agent by default<\/strong> — agent count is not sophistication; unjustified topology buys 58–285% token overhead for quality a better-contexted single agent often matches.<\/li>\n<li>❌ <strong>Unbounded agents<\/strong> — no scope, no tool contract, no failure protocol means no production. \"It usually behaves\" is not a contract.<\/li>\n<li>❌ <strong>Silent failure handling<\/strong> — an agent that can't complete its task must say so through a defined protocol; swallowed failures surface as confident wrong answers downstream.<\/li>\n<li>❌ <strong>Removing the human gate from irreversible steps<\/strong> — era-2's judgment rule survives every topology; autonomy is granted per risk tier (D6), not per capability.<\/li>\n<\/ul>\n<h2>What survived<\/h2>\n<p>The chain survived wholesale — a multi-agent system is a chain whose stations have been delegated, and the A3 pattern (clarify/generate/critique/refine) is visibly the planner/implementer/reviewer topology in embryo. C1's acceptance-criteria-per-step became inter-agent contracts. The human-judgment placement rule survived as risk-tiered autonomy. Nothing from era 2 was wrong; it was staffing that changed.<\/p>\n<h2>Boundary conditions (where older practice is still correct)<\/h2>\n<ul>\n<li><strong>A single agent with good context is correct for most team workflows.<\/strong> Below production cadence, multi-agent is over-engineering — the Tier 2–3 curriculum (chains + context files) is not a lesser version of orchestration; it <em>is<\/em> the right architecture at that scale.<\/li>\n<li><strong>Era-2 human-gated chains remain mandatory where stakes are high<\/strong> regardless of how capable agents get — the gate placement rule is a governance decision (D6), not a capability question.<\/li>\n<li><strong>Single chat is still right for single transformations<\/strong> — orchestrating a one-step task is the same fossil as schema-enforcing a chat reply (see structured-outputs, boundary conditions).<\/li>\n<li><strong>The critic pattern needs an eval to earn its seat<\/strong> — without a measured quality bar, a reviewer agent is cost without evidence (evaluation-practice, era 3).<\/li>\n<\/ul>\n<h2>Signals to watch (would trigger Era 4)<\/h2>\n<ul>\n<li>Coordination overhead collapsing (framework-managed state, shared KV/context between agents) — would weaken the compute-normalized argument for single agents.<\/li>\n<li>Reliable self-organizing topologies (swarms that don't need designed contracts) — would move the skill from topology design to constraint design.<\/li>\n<li>Vendor platforms absorbing orchestration entirely (declare the outcome, get a managed team) — prompts became specs; workflows would become intents, and this entry's unit of curation shifts again.<\/li>\n<\/ul>\n<h2>Sources<\/h2>\n<ul>\n<li><a href=\"https://www.augmentcode.com/guides/single-agent-vs-multi-agent-ai\">Single-Agent vs Multi-Agent AI: When to Scale<\/a> (Augment Code, 2026) — compute-normalized parity finding; token overhead figures (~58% / ~285%); \"measurable single-agent ceiling\" trigger.<\/li>\n<li><a href=\"https://www.codebridge.tech/articles/mastering-multi-agent-orchestration-coordination-is-the-new-scale-frontier\">Multi-Agent Orchestration Guide<\/a> (Codebridge, 2026) — orchestrator-worker at ~70% of production deployments; coordination as the new frontier.<\/li>\n<li><a href=\"https://www.digitalapplied.com/blog/multi-agent-orchestration-5-patterns-that-work\">Multi-Agent Orchestration: 5 Patterns That Work<\/a> (2026) — fan-out / pipeline / debate / supervisor / swarm vocabulary.<\/li>\n<li><a href=\"https://learn.microsoft.com/en-us/microsoft-copilot-studio/guidance/multi-agent-patterns\">Multi-agent orchestration patterns and best practices<\/a> (Microsoft Learn, 2026) — reviewer/fact-checker loops reducing hallucination; enterprise topology guidance.<\/li>\n<li><a href=\"https://addyosmani.com/blog/code-agent-orchestra/\">The Code Agent Orchestra<\/a> (Osmani, 2026) — practitioner account of planner/implementer/tester/reviewer coding workflows.<\/li>\n<li>Founding research conversations (2026-07, <code>learning_program_scraps.md<\/code>) — multi-agent as production default for non-trivial tasks; where prompt skill moved.<\/li>\n<\/ul>"}, "agent-skills-format": {"meta": {"id": "agent-skills-format", "practice": "Agent Skills (SKILL.md) — Authoring & Discovery", "status": "current", "last_reviewed": "2026-08-01", "review_cadence": "quarterly", "model_generations": ["prompt-era", "context-files-era", "skills-era-2025"], "referenced_by": ["C6", "C7"], "curators": ["platform-owner"], "title": "Evolution Entry: Agent Skills — the SKILL.md Format (Prompt → Context Files → Portable Skills)"}, "html": "<h1>Evolution Entry: Agent Skills — the SKILL.md Format (Prompt → Context Files → Portable Skills)<\/h1>\n<p>The volatile mechanics of how skills are written, selected, and discovered live here so lessons can\ncite them instead of embedding claims that move. The <strong>durable habit<\/strong> (verify a skill loads; write a\ndescription that gets selected) is taught in C6; the <strong>current specifics<\/strong> below are re-checked each\nreview.<\/p>\n<h2>Current guidance (teach this today)<\/h2>\n<ul>\n<li><strong>A skill is a directory, not a file.<\/strong> The unit is <code>&lt;name&gt;/SKILL.md<\/code> — a folder named for the\n  skill, containing a file named exactly <code>SKILL.md<\/code>. A flat <code>&lt;name&gt;.md<\/code> dropped in a skills folder is\n  discovered by nothing and loads as nothing.<\/li>\n<li><strong>The description is the trigger, not a summary.<\/strong> At startup the agent pre-loads only each skill's\n  name and description (~100 tokens); the body loads <em>only after<\/em> the skill is selected, and selection\n  is decided on the description alone. Write it as a condition — \"use when the user wants to…\" — not an\n  identity — \"a tool for…\".<\/li>\n<li><strong>Progressive disclosure is the design.<\/strong> Metadata always → body on selection → bundled files on\n  demand. Keep the body focused; push reference detail to linked files.<\/li>\n<li><strong>Silent failure is the characteristic risk.<\/strong> A vague description (never selected) or a\n  misplaced/misnamed file (never discovered) fails with no error and no warning. Verify; don't assume.<\/li>\n<li><strong>The format is cross-vendor.<\/strong> SKILL.md is an open format (agentskills.io) read by Claude and, from\n  conventional directories, by GitHub Copilot, Codex, and others. Skill discipline is portable, not\n  one vendor's lock-in.<\/li>\n<li><strong>Lint the corpus.<\/strong> A read-only linter (e.g., Signalman, MIT) catches the silent failures human\n  review misses — description-as-identity, trigger collisions, and flat-file near-misses.<\/li>\n<\/ul>\n<h2>Eras<\/h2>\n<h3>Era 1 — The prompt (~2022–2023)<\/h3>\n<p>Capability lived in the sentence you typed. Reuse meant copy-paste; there was no artifact, no\ndiscovery, no portability. \"It works if you word it right\" was the whole craft.<\/p>\n<h3>Era 2 — Context files (2023–2025)<\/h3>\n<p>CLAUDE.md / AGENTS.md / soul.md made context durable and versioned (the C4 layer). Capability moved\nfrom wording to written, reviewable context — but these files loaded wholesale, with no selective,\non-demand capability.<\/p>\n<h3>Era 3 — Portable skills (2025–2026)<\/h3>\n<p>The SKILL.md format packaged a capability as a discoverable, model-invoked unit with progressive\ndisclosure and optional bundled code. Anthropic published the format (Oct 2025); an open standard\n(agentskills.io) and cross-vendor adoption followed. Capability moved again — from \"what's in my\ncontext file\" to \"what the agent selects, on its own, from a library.\" The new engineering surface is\nthe <strong>description<\/strong> (the trigger) and the <strong>discovery convention<\/strong> (the filename and directory).<\/p>\n<h2>Deprecated patterns (stop teaching these)<\/h2>\n<ul>\n<li>❌ <strong>Description as identity<\/strong> (\"a tool for spreadsheets\") — it cannot be selected; write a trigger.<\/li>\n<li>❌ <strong>Debugging the body of a skill that never fires<\/strong> — the body is not read until selection; fix the\n  description first.<\/li>\n<li>❌ <strong>Flat <code>&lt;name&gt;.md<\/code> files in a skills folder<\/strong> — not discovered; use <code>&lt;name&gt;/SKILL.md<\/code>.<\/li>\n<li>❌ <strong>\"More skills = more capability\"<\/strong> — overlapping descriptions collide; a bloated corpus can be\n  net-negative.<\/li>\n<li>❌ <strong>Assuming a skill loaded<\/strong> — nothing errors when it doesn't. Verify.<\/li>\n<li>❌ <strong>Padding a skill body with what a capable model already knows<\/strong> — spend the context budget on what\n  it can't derive: your conventions, your environment, post-cutoff facts.<\/li>\n<\/ul>\n<h2>What survived<\/h2>\n<p>Era 2's core lesson survived wholesale: capability is a written, reviewable artifact, not a knack. A\nskill is a context file given a trigger and a loader. C4's durable-context discipline is the parent of\nskill authoring; C3's packaging is the direct ancestor. What changed is selectivity and portability —\nnot the principle that you write the capability down.<\/p>\n<h2>Boundary conditions (where older practice is still correct)<\/h2>\n<ul>\n<li><strong>A one-off task still wants a plain prompt<\/strong> — packaging a single transformation as a skill is\n  over-engineering.<\/li>\n<li><strong>Always-on project rules still belong in a context file<\/strong> (CLAUDE.md), not a skill — skills are for\n  selectable, triggerable capabilities, not ambient context.<\/li>\n<li><strong>\"Author a spec\" is a standard, not a skill<\/strong> — a document you cite, because it has no single moment\n  of activation. Not everything worth standardizing is a triggerable action.<\/li>\n<\/ul>\n<h2>Signals to watch (this entry will move)<\/h2>\n<ul>\n<li><strong>Discovery conventions and frontmatter keys are vendor-current and shift<\/strong> — re-verify the\n  filename/directory rules and which agent reads which directory against live docs before relying on\n  them. (Verified 2026-08-01: discovery scans for <code>SKILL.md<\/code>; required frontmatter is <code>name<\/code> +\n  <code>description<\/code>.)<\/li>\n<li><strong>Deterministic invocation is evolving<\/strong> — <code>disable-model-invocation<\/code>, commands-as-skills; the\n  \"model-invoked by default\" mechanic may gain more explicit-invocation paths.<\/li>\n<li><strong>Marketplaces / third-party skills<\/strong> raise a code-intake security surface (skills can bundle\n  executable code) — treat a third-party skill as third-party code.<\/li>\n<li><strong>BINDING vs ADVISORY governance framing<\/strong> (a skill claimed as a control needs evidence it\n  <em>operated<\/em>, not just that it was documented) — likely to formalize; feeds the planned C7.<\/li>\n<\/ul>\n<h2>Sources<\/h2>\n<ul>\n<li>Anthropic Engineering, \"Equipping agents for the real world with Agent Skills\" (16 Oct 2025).<\/li>\n<li>Claude Docs, \"Skill authoring best practices\" (context budget; description states <em>when<\/em> to use;\n  per-model testing).<\/li>\n<li>Claude Code Docs, \"Extend Claude with skills\" (<code>.claude/skills<\/code> scanned for <code>SKILL.md<\/code>;\n  <code>disable-model-invocation<\/code>; commands merged into skills).<\/li>\n<li>Agent Skills open standard — agentskills.io (format specification; cross-vendor).<\/li>\n<li>Signalman (MIT) — read-only SKILL.md linter; SK007 (description-as-trigger), SK018 (flat-file\n  near-miss).<\/li>\n<li>Live-docs verification 2026-08-01 (discovery = <code>&lt;name&gt;/SKILL.md<\/code>; required frontmatter <code>name<\/code> +\n  <code>description<\/code>).<\/li>\n<\/ul>"}, "ai-product-discovery": {"meta": {"id": "ai-product-discovery", "practice": "Product Discovery & Customer Centricity with AI", "status": "current", "last_reviewed": "2026-07-11", "review_cadence": "quarterly", "model_generations": ["manual-discovery-era", "ai-accelerated-synthesis-era", "synthetic-substitution-contested-2026"], "referenced_by": ["B2", "B2D"], "curators": ["platform-owner"], "title": "Evolution Entry: AI Product Discovery (Manual Synthesis → AI-Accelerated Evidence → The Synthetic-User Boundary)"}, "html": "<h1>Evolution Entry: AI Product Discovery (Manual Synthesis → AI-Accelerated Evidence → The Synthetic-User Boundary)<\/h1>\n<h2>Current guidance (teach this today)<\/h2>\n<p>One question draws the line through everything: <strong>did a real customer generate this signal?<\/strong><\/p>\n<ul>\n<li><strong>AI accelerating the handling of real evidence is the durable win.<\/strong> Structured research notes synthesized in minutes instead of hours (the B2D workflow), interview guides drafted, screeners generated, themes clustered across studies — all of it legitimate, all of it conditional on the inputs being real observations of real customers.<\/li>\n<li><strong>Synthetic users are instruments, not evidence.<\/strong> As of 2026 the field's own numbers make the boundary vivid: ~97% of researchers have AI in their workflow while only ~8% trust AI-generated participants as participants. Legitimate uses cluster where a false positive is cheap: piloting an interview guide before burning real recruits on it, stress-testing screener wording, triaging obviously-bad concepts. Illegitimate use is one step further: presenting the synthetic session's output as customer evidence.<\/li>\n<li><strong>Know the failure mechanism by name: sycophancy.<\/strong> Head-to-head studies found synthetic users praised concepts that real users went on to question or reject, and predicted real behavior poorly. A fake user that tells you yes is worse than no user — it manufactures the confidence that discovery exists to destroy. This is <strong>discovery cosplay<\/strong>: shipping faster while learning nothing, with artifacts that look like learning.<\/li>\n<li><strong>Training-data drift makes it structural, not fixable by prompting.<\/strong> A model reflects its training text — the past, and the general public's past at that. Asking it about your 2026 product yields a 2023 internet's idea of your customer. Grounded approaches (personas built from your own VoC data, with verifiable citations back to real quotes) are the research frontier, not the shipping practice — watch, don't teach.<\/li>\n<\/ul>\n<p>The 80/20 division emerging as best practice: synthetic for the cheap front of the funnel (instrument piloting, screening), real humans for everything that becomes evidence — emotional insight, edge cases, cultural nuance, and every final decision.<\/p>\n<h2>Eras<\/h2>\n<h3>Era 1 — Manual discovery (pre-2023)<\/h3>\n<p>Continuous-discovery habits fought a mechanical bottleneck: synthesis. Transcripts piled up; affinity-mapping ate the calendar; the interview→insight lag was measured in weeks. The era's discipline — small-n qualitative depth, direct customer contact as a weekly habit — was correct and survives untouched. What didn't survive was the assumption that synthesis cost is fixed.<\/p>\n<h3>Era 2 — AI-accelerated synthesis (2023–2025)<\/h3>\n<p>The bottleneck broke. Structured notes (participant / task / observation / interpretation) fed to a model produced theme clusters, contradiction lists, and draft briefs in minutes — the B2D layer of this platform. Discovery cadence accelerated without changing its epistemology: every insight still traced to a real observed human. The era's boundary rule, already in the B2D lesson: AI finds patterns in your evidence; it must never <em>add<\/em> findings that aren't in it.<\/p>\n<h3>Era 3 — Synthetic substitution, contested (2025–2026)<\/h3>\n<p>Vendors shipped \"user research without the users\": LLM personas you interview. Adoption ran far ahead of trust (97% touch / 8% trust), and the validity evidence arrived negative — sycophancy, poor behavioral prediction, training-data drift — capped by academic judgment (a 182-study systematic review converging on the same concerns; a January 2026 ACM <em>Interactions<\/em> piece calling AI-generated participants \"a category mistake that undermines the purpose of research\"). Meanwhile ~45% of researchers flagged the organizational risk: synthetic users invoked to justify cutting research contact with real customers. The era's live frontier is the middle path — VoC-grounded, citation-verifiable personas — promising for instruments, unproven as evidence.<\/p>\n<h2>Deprecated patterns (stop teaching these)<\/h2>\n<ul>\n<li>❌ <strong>Synthetic interviews as validation evidence<\/strong> — the sycophancy finding makes this actively worse than skipping research: it manufactures false confidence with professional-looking artifacts.<\/li>\n<li>❌ <strong>\"The model knows our users\"<\/strong> — it knows the internet's past. Training-data drift is structural; your current customer is not in the weights.<\/li>\n<li>❌ <strong>Cutting real customer contact because personas are cheaper<\/strong> — the cost being saved is the product's connection to reality; that invoice arrives later, at C5's \"cost of a wrong answer\" scale.<\/li>\n<li>❌ <strong>AI-added findings in synthesis<\/strong> — already the B2D rule; restated here because era 3 industrialized the temptation.<\/li>\n<li>❌ <strong>Speed as the discovery metric<\/strong> — interviews-per-week was never the point; validated-learning-per-decision was. Acceleration that skips the customer optimizes the wrong term.<\/li>\n<\/ul>\n<h2>What survived<\/h2>\n<p>Everything that made discovery discovery: continuous cadence, small-n depth, direct contact, evidence traceability. Era 2's structured-notes discipline survives as the compatibility layer — it's what makes AI synthesis safe (structured inputs of real observations) and what exposes synthetic substitution (no real observation, no structure to trace). The oldest instinct — <em>watch a real person attempt a real task<\/em> — remains the one activity no era has automated, because it's where the surprises live, and surprises are the product of discovery.<\/p>\n<h2>Boundary conditions (where synthetic practice is legitimately correct)<\/h2>\n<ul>\n<li><strong>Instrument piloting:<\/strong> running an interview guide against a synthetic persona to find confusing questions before spending real recruits — cheap, low-stakes, honest.<\/li>\n<li><strong>Screener and survey pre-tests:<\/strong> wording checks, logic-path walks, comprehension smoke tests.<\/li>\n<li><strong>Concept triage at the very top of the funnel<\/strong> — screening obviously-broken ideas where a false \"keep exploring\" costs one more cheap iteration, not a roadmap commitment.<\/li>\n<li><strong>Never<\/strong> in regulated, safety, health, or accessibility contexts — there the participant's reality is the entire point, and a synthetic stand-in isn't a shortcut, it's a category error with consequences.<\/li>\n<\/ul>\n<h2>Signals to watch (would trigger Era 4)<\/h2>\n<ul>\n<li>VoC-grounded persona systems (PersonaCite-class: interviewable personas with verifiable citations to real customer data) demonstrating predictive validity in longitudinal head-to-heads — would move grounded synthetics from instrument to limited evidence.<\/li>\n<li>IRB/regulatory rulings on synthetic participants — would draw the legal boundary this entry currently draws editorially.<\/li>\n<li>Measured behavioral-prediction parity on narrow task classes — would justify a scoped exception list, one task class at a time, never wholesale.<\/li>\n<\/ul>\n<h2>Sources<\/h2>\n<ul>\n<li><a href=\"https://developmentcorporate.com/product-management/synthetic-users-in-2026-why-97-of-researchers-use-ai-but-only-8-trust-ai-generated-participants/\">Synthetic Users in 2026: 97% use, 8% trust<\/a> (2026) — adoption/trust gap, legitimacy-by-task survey, headcount-risk flag.<\/li>\n<li><a href=\"https://userevaluation.com/post/synthetic-users-vs-real-participants/\">Synthetic Users vs Real Participants: What the 2026 Research Actually Shows<\/a> (2026) — sycophancy and behavioral-prediction failures; training-data drift; the 80/20 division of labor.<\/li>\n<li>Kuric, Demcak &amp; Krajcovic — systematic review spanning 182 studies (cited in the above; obtain primary at Challenge step); ACM <em>Interactions<\/em>, Jan 2026 — \"category mistake\" position.<\/li>\n<li><a href=\"https://arxiv.org/pdf/2601.22288\">PersonaCite: VoC-Grounded Interviewable Synthetic Personas<\/a> (arXiv 2601, 2026) — the grounded middle path; watch-list, not guidance.<\/li>\n<li><a href=\"https://www.syntheticusers.com/\">Synthetic Users (vendor)<\/a> — the advocate position, for Challenge-step steel-manning.<\/li>\n<li>B2D lesson + <code>docs/misconception-log.md<\/code> root-cause vocabulary — this platform's internal boundary rules.<\/li>\n<\/ul>"}, "context-engineering": {"meta": {"id": "context-engineering", "practice": "Context Engineering", "status": "current", "last_reviewed": "2026-07-10", "review_cadence": "quarterly", "model_generations": ["stuff-the-prompt-era", "rag-era", "curated-jit-context-2026"], "referenced_by": ["B1", "B1E", "C4", "C5"], "curators": ["platform-owner"], "title": "Evolution Entry: Context Engineering (Stuff-the-Prompt → RAG → Curated Just-in-Time Context)"}, "html": "<h1>Evolution Entry: Context Engineering (Stuff-the-Prompt → RAG → Curated Just-in-Time Context)<\/h1>\n<h2>Current guidance (teach this today)<\/h2>\n<p>Context engineering is deciding <strong>what the model sees, in what order, from which authoritative sources<\/strong> — and in 2026 it is a bigger quality lever than prompt wording. The working framework is four verbs:<\/p>\n<ul>\n<li><strong>Write<\/strong> — persist context outside the window: durable context files (CLAUDE.md, soul.md — the C4 artifacts), decision logs, boundary docs. Written once, inherited by every session.<\/li>\n<li><strong>Select<\/strong> — retrieve only what's relevant <em>now<\/em>, just-in-time, rather than front-loading everything that might matter.<\/li>\n<li><strong>Compress<\/strong> — summarize aging history instead of carrying it verbatim; long-running sessions accumulate \"context rot\" where stale tokens crowd out signal.<\/li>\n<li><strong>Isolate<\/strong> — give sub-tasks their own clean context instead of one ever-growing window.<\/li>\n<\/ul>\n<p>Placement still matters: attention is U-shaped, and material buried mid-context underperforms material at the beginning or end — a finding that has survived every context-window increase to date, including million-token models. Put controlling instructions and authoritative sources at the edges; never bury the contract in the middle.<\/p>\n<p>For learners below Tier 3, the practical form of all this is unchanged from the B-series: signal-rich file names and summaries so retrieval finds the right thing (B1), and a maintained context file so agentic sessions never start from zero (B1E).<\/p>\n<h2>Eras<\/h2>\n<h3>Era 1 — Stuff the prompt (~2022–2023)<\/h3>\n<p>Context windows were small and the prompt was the only lever, so practice was manual curation by necessity: paste the relevant excerpt, keep it short. The era's failure mode was the opposite instinct once windows grew — \"it fits, so include it.\" Model context: no retrieval tooling in common use; every session started from zero and ended in amnesia.<\/p>\n<h3>Era 2 — RAG and placement rules (2023–2025)<\/h3>\n<p>Vector retrieval made external knowledge routine: chunk, embed, retrieve top-k, augment the prompt. The defining research finding was <strong>lost-in-the-middle<\/strong> (Liu et al., 2023; TACL 2024): models reliably use information at the start and end of context and degrade sharply on the middle — even explicitly long-context models. Practice acquired placement rules, reranking, and chunking discipline. The era's fossil was \"bigger window beats retrieval\": long windows kept getting cheaper, but position bias and cost meant <em>indiscriminate<\/em> stuffing still lost to <em>selected<\/em> context.<\/p>\n<h3>Era 3 — Curated just-in-time context and agentic context management (2025–2026)<\/h3>\n<p>\"Context engineering\" became the named discipline as agents replaced single calls. What changed: agents run for many steps and accumulate history, so context became something to <em>manage over time<\/em>, not assemble once — hence write/select/compress/isolate, context-rot awareness, and just-in-time tool schemas (lightweight tool lists expanded on demand rather than every schema up front). Durable context files (CLAUDE.md and kin) went from power-user habit to standard infrastructure, and retrieval itself became agentic — plan, retrieve, reflect, re-retrieve — rather than single-pass. The prompt is now the smallest part of a designed information environment.<\/p>\n<h2>Deprecated patterns (stop teaching these)<\/h2>\n<ul>\n<li>❌ <strong>\"The window is big enough, paste everything\"<\/strong> — position bias and context rot mean indiscriminate stuffing degrades output even when it fits.<\/li>\n<li>❌ <strong>Re-explaining the project at the start of every session<\/strong> — that's what durable context files are for; per-session re-explanation is the single most expensive fossil in daily practice.<\/li>\n<li>❌ <strong>Burying instructions or authority statements mid-context<\/strong> — the U-curve has not flattened; edges or nothing.<\/li>\n<li>❌ <strong>Single-pass retrieve-and-generate as the default for multi-step work<\/strong> — agentic retrieval with reflection is the production pattern.<\/li>\n<li>❌ <strong>Treating context window size as a strategy<\/strong> — window growth changed what's <em>possible<\/em>, not what's <em>optimal<\/em>; selection still beats volume.<\/li>\n<\/ul>\n<h2>What survived<\/h2>\n<p>Era 1's core instinct — <em>manual curation of a small, relevant context<\/em> — turned out to be the whole discipline in embryo; it was right for the wrong reason (necessity) and is now right by evidence. Placement rules from Era 2 survive intact as of 2026. And the oldest rule of all survives from every era: state which sources are authoritative — models reconcile conflicting context silently unless told not to (see the prompting-frameworks entry, CREATE+ \"C\").<\/p>\n<h2>Boundary conditions (where older practice is still correct)<\/h2>\n<ul>\n<li><strong>Tier 1/2 chat-tier work needs no pipeline.<\/strong> For a single question about a single document, pasting the relevant text <em>is<\/em> correct context engineering — teaching write/select/compress/isolate to a Tier 1 learner is a staircase leap. A0's \"paste in the raw material\" guidance is this entry's rung-1 form.<\/li>\n<li><strong>One-shot long-context dumps remain fine for single-pass tasks<\/strong> (summarize this transcript) where building retrieval infrastructure is overkill — position bias matters less when the task is holistic rather than needle-finding.<\/li>\n<li><strong>Small local models<\/strong> have small effective contexts regardless of advertised window; Era 1 discipline (short, curated, explicit) is mandatory there, mirroring the rowboat rule in prompting-frameworks.<\/li>\n<\/ul>\n<h2>Signals to watch (would trigger Era 4)<\/h2>\n<ul>\n<li>Flat attention curves on production models (placement rules retire; several vendors claim progress every cycle — verify against needle-in-haystack and LongBench-style evals, not marketing).<\/li>\n<li>Vendor-managed context (automatic compression/memory as a platform primitive) absorbing the select/compress verbs — the skill would shift to auditing what the platform chose to keep.<\/li>\n<li>Persistent cross-session memory becoming default-on in enterprise assistants — would demote CLAUDE.md from \"context delivery\" to \"context governance\" (the governance half stays).<\/li>\n<\/ul>\n<h2>Sources<\/h2>\n<ul>\n<li><a href=\"https://arxiv.org/abs/2307.03172\">Lost in the Middle: How Language Models Use Long Contexts<\/a> (Liu et al., arXiv July 2023; <a href=\"https://aclanthology.org/2024.tacl-1.9/\">TACL 2024<\/a>) — the founding placement finding.<\/li>\n<li><a href=\"https://dev.to/gabrielanhaia/lost-in-the-middle-is-still-real-in-2026-even-on-1m-token-models-2ehj\">Lost-in-the-Middle Is Still Real in 2026 (Even on 1M-Token Models)<\/a> (2026) — position bias persists on current frontier models; no production model has eliminated it.<\/li>\n<li><a href=\"https://sourcegraph.com/blog/context-engineering\">Context Engineering: A Practical Guide for AI Agents<\/a> (Sourcegraph, 2026) — write/select/compress/isolate framing, context rot.<\/li>\n<li><a href=\"https://www.comet.com/site/blog/context-engineering/\">Context Engineering Best Practices for Agentic Systems<\/a> (Comet, 2026) — agentic context management, JIT tool schemas, memory tools.<\/li>\n<li><a href=\"https://arxiv.org/pdf/2511.03728\">Efficient On-Device Agents via Adaptive Context Management<\/a> (arXiv 2511) — just-in-time schema passing; small-model context limits.<\/li>\n<li>Founding research conversations (2026-07, <code>learning_program_scraps.md<\/code>) — cross-model consensus on context shaping as the successor discipline to prompt wording.<\/li>\n<\/ul>"}, "context-file-architecture": {"meta": {"id": "context-file-architecture", "practice": "Context File Architecture (CLAUDE.md / AGENTS.md / SKILL.md across tools)", "status": "current", "last_reviewed": "2026-08-01", "review_cadence": "quarterly", "model_generations": ["per-tool-files-era", "agents-md-standard-2025", "gated-skills-2026"], "referenced_by": ["C4"], "curators": ["platform-owner"], "title": "Evolution Entry: Context File Architecture — Which File Owns What, Across Tools"}, "html": "<h1>Evolution Entry: Context File Architecture — Which File Owns What, Across Tools<\/h1>\n<p>The team question this answers: your people are on Cursor, Copilot, and Claude Code — where do the\nrules live so you write them <strong>once<\/strong>, and how do the tools converge? This entry holds the volatile\nwho-reads-what layer. The durable idea is stable: one canonical source, thin tool-specific overlays,\nand keep the always-on file lean.<\/p>\n<h2>Current guidance (teach this today)<\/h2>\n<ul>\n<li><strong>Three files, three loading models.<\/strong><\/li>\n<li><strong>AGENTS.md<\/strong> — the shared, tool-agnostic instruction file. Always-on (injected at session start).\n    The emerging cross-tool standard (~30 tools read it natively).<\/li>\n<li><strong>CLAUDE.md<\/strong> — Claude Code's file. Always-on. Claude Code reads <strong>this, not AGENTS.md<\/strong> — Claude\n    genuinely does it differently.<\/li>\n<li><strong>SKILL.md<\/strong> — a <em>gated<\/em> capability, loaded only when its description matches the task (progressive\n    disclosure; see <code>agent-skills-format<\/code>). Not always-on.<\/li>\n<li><strong>One canonical source, thin overlays.<\/strong> Put shared rules in AGENTS.md. Make CLAUDE.md thin: an\n  <code>@AGENTS.md<\/code> import plus only the Claude-specific lines. (A symlink <code>ln -s AGENTS.md CLAUDE.md<\/code> also\n  works but needs admin/Developer Mode on Windows — prefer the <code>@import<\/code>.) Do <strong>not<\/strong> copy AGENTS.md\n  into CLAUDE.md.<\/li>\n<li><strong>Personal vs. project.<\/strong> User-level <code>~/.claude/CLAUDE.md<\/code> holds <em>your<\/em> preferences across every\n  project; the repo's AGENTS.md/CLAUDE.md holds <em>the project's<\/em> rules. Don't duplicate personal rules\n  into the repo, or project rules into your user file.<\/li>\n<li><strong>Nearest-file-wins.<\/strong> In a monorepo a nested AGENTS.md (e.g. <code>services/payments/AGENTS.md<\/code>) overrides\n  the root for work in that directory — keeping each area's context tight instead of one giant file.<\/li>\n<li><strong>Protect the always-on budget (the \"second brain\" trap).<\/strong> Every token in an always-on file is read\n  on <em>every<\/em> turn and spends the model's attention. Dumping your whole knowledge base into\n  CLAUDE.md/AGENTS.md is noise that degrades focus — the agent reads database lock modes while fixing a\n  CSS bug. Keep always-on files lean; push situational depth into a gated SKILL.md.<\/li>\n<li><strong>A bridge for mixed-tool teams.<\/strong> Tools that don't natively read <code>SKILL.md<\/code> can still benefit if a\n  CI step compiles skill metadata into AGENTS.md (e.g. a \"skills-to-agents\" action emits a <code>&lt;skills&gt;<\/code>\n  block). One source of truth; the non-Claude tools see it too.<\/li>\n<\/ul>\n<h2>Eras<\/h2>\n<h3>Era 1 — Per-tool files (–2025)<\/h3>\n<p>Each tool read its own file (<code>.cursorrules<\/code>, <code>CLAUDE.md<\/code>, and whatever else). The same rules were\nwritten several times; drift was guaranteed.<\/p>\n<h3>Era 2 — AGENTS.md as the shared standard (Aug 2025 →)<\/h3>\n<p>OpenAI released AGENTS.md in August 2025; it was transferred to the Linux Foundation's <strong>Agentic AI\nFoundation<\/strong> (late 2025, alongside MCP and goose). By mid-2026 ~30 tools read it natively and 60,000+\nrepos carry one — the de facto cross-tool instruction file.<\/p>\n<h3>Era 3 — Gated skills alongside always-on files (Oct 2025 →)<\/h3>\n<p><code>SKILL.md<\/code> (the agentskills.io open standard) added a <em>conditional<\/em> layer: capability loaded on demand,\nseparating \"always true\" (AGENTS.md / CLAUDE.md) from \"true for this task\" (SKILL.md).<\/p>\n<h2>Deprecated patterns (stop teaching these)<\/h2>\n<ul>\n<li>❌ <strong>Copying AGENTS.md into CLAUDE.md<\/strong> — duplication and drift; use the <code>@import<\/code>.<\/li>\n<li>❌ <strong>One giant always-on file / \"second brain\" dump<\/strong> — attention noise; move situational content to SKILL.md.<\/li>\n<li>❌ <strong>Assuming Claude Code reads AGENTS.md natively<\/strong> — it doesn't (verified); it reads CLAUDE.md, and the \"reads it as a fallback\" claim is a myth.<\/li>\n<li>❌ <strong>Personal preferences in the repo file<\/strong> — those belong in <code>~/.claude/CLAUDE.md<\/code>.<\/li>\n<li>❌ <strong>Hand-writing the same rule in three tools' files<\/strong> — canonical source + a bridge instead.<\/li>\n<\/ul>\n<h2>What survived<\/h2>\n<p>The core idea survived and standardized: agent behavior is governed by written, versioned files.\nAGENTS.md is the era-2 generalization of CLAUDE.md; SKILL.md is its gated sibling. C4's discipline —\ndurable, versioned context as a contract — is the parent of all three.<\/p>\n<h2>Boundary conditions (where older practice is still correct)<\/h2>\n<ul>\n<li><strong>Solo / single-tool:<\/strong> one CLAUDE.md is fine; the multi-file architecture earns its keep only with\n  multiple tools or a monorepo.<\/li>\n<li><strong>Claude-only shop:<\/strong> CLAUDE.md alone is enough; adopt AGENTS.md when a second tool arrives.<\/li>\n<li><strong>Small repo:<\/strong> nested AGENTS.md is overkill until directories genuinely have different rules.<\/li>\n<\/ul>\n<h2>Signals to watch (this entry will move fast)<\/h2>\n<ul>\n<li>Whether Claude Code adds native AGENTS.md reading (currently no; <code>@import<\/code>/symlink required).<\/li>\n<li>AGENTS.md governance and adoption under the AAIF (170+ members, May 2026) and the native-tool count.<\/li>\n<li>SKILL.md discovery conventions (tracked in <code>agent-skills-format<\/code>).<\/li>\n<li><strong>Efficiency claims<\/strong> for shared instruction files (a 2026 study reporting runtime/token reductions\n  circulates in secondary posts) — <strong>reported, not independently verified here<\/strong>; cite only after\n  reading the primary paper.<\/li>\n<li>\"skills-to-agents\"-style CI bridges as they mature.<\/li>\n<\/ul>\n<h2>Sources<\/h2>\n<ul>\n<li>AGENTS.md — OpenAI (Aug 2025); Linux Foundation <strong>Agentic AI Foundation<\/strong> stewardship (late 2025).\n  https://www.linuxfoundation.org/press/linux-foundation-announces-the-formation-of-the-agentic-ai-foundation<\/li>\n<li>agents.md — specification and native-tool list.<\/li>\n<li>Claude Code memory docs — <code>@import<\/code> and symlink; reads CLAUDE.md, not AGENTS.md.\n  https://code.claude.com/docs/en/memory<\/li>\n<li>Agent Skills — agentskills.io (Dec 2025); see the <code>agent-skills-format<\/code> entry.<\/li>\n<li>Verified 2026-08-01 (AGENTS.md governance/adoption; Claude Code <code>@import<\/code>/symlink; the\n  \"reads AGENTS.md as fallback\" claim debunked). Secondary-source arXiv efficiency figures are\n  <strong>deliberately not cited as fact<\/strong> pending primary verification.<\/li>\n<\/ul>"}, "evaluation-practice": {"meta": {"id": "evaluation-practice", "practice": "Evaluation Practice", "status": "current", "last_reviewed": "2026-07-10", "review_cadence": "quarterly", "model_generations": ["seems-right-era", "rubric-era", "harness-and-drift-2026"], "referenced_by": ["B3", "C1", "D1"], "curators": ["platform-owner"], "title": "Evolution Entry: Evaluation Practice (\"Seems Right\" → Rubrics → Eval Harnesses and Drift Detection)"}, "html": "<h1>Evolution Entry: Evaluation Practice (\"Seems Right\" → Rubrics → Eval Harnesses and Drift Detection)<\/h1>\n<h2>Current guidance (teach this today)<\/h2>\n<p>Define what \"good\" looks like <strong>before<\/strong> generating anything — then enforce it at the altitude the stakes demand:<\/p>\n<ul>\n<li><strong>Personal work (Tier 1–2):<\/strong> the author reads the output like a colleague's draft before it leaves their hands (A0's One Rule). This is a complete evaluation practice at personal stakes. Teaching harnesses here is a staircase leap.<\/li>\n<li><strong>Team workflows (Tier 2–3):<\/strong> written acceptance criteria <em>before<\/em> the prompt (C1's rule), quality checklists for AI output (B3's pattern), and a small <strong>golden set<\/strong> — 10–20 real examples with known-good answers, re-run when the prompt, model, or context changes. A golden set is the cheapest eval that actually works.<\/li>\n<li><strong>Production systems (Tier 4):<\/strong> a versioned eval harness wired into deployment — eval regressions block the ship, the way failing tests do. Current practice (as of 2026-07): deterministic checks on 100% of traffic, sampled LLM-as-judge scoring on ~5–10% of production requests, judges calibrated to ~85–90% agreement with a human-labeled reference set, and drift monitoring on both the outputs and the <em>case set itself<\/em> — production usage drifts, and a static test suite quietly diverges from reality.<\/li>\n<\/ul>\n<p>Two principles hold at every altitude. <strong>Eval-first ordering:<\/strong> define good → build the check → then iterate the prompt until it passes (D1's rule — the eval comes before the prompt, not after the incident). <strong>Human ground truth:<\/strong> every automated judge is calibrated against, and periodically audited by, human judgment; a judge nobody has checked is a vibe with a dashboard.<\/p>\n<h2>Eras<\/h2>\n<h3>Era 1 — \"Seems right\" (~2022–2023)<\/h3>\n<p>Evaluation was the author reading the output and nodding. Demos stood in for validation; a good anecdote shipped a workflow. Model context: outputs were low-stakes drafts, tooling didn't exist, and the novelty was the point. The era's honest core — human judgment on real output — was never wrong; it just doesn't scale past the author.<\/p>\n<h3>Era 2 — Rubrics and review patterns (2023–2025)<\/h3>\n<p>As AI output entered real workflows, teams wrote down what \"good\" meant: checklists, acceptance criteria authored before generation, golden examples, structured critique passes (the B2/B3 pattern layer of this platform). Public benchmarks proliferated — and immediately taught their own limits: contamination, gaming, and metrics that disagree with human judgment (the BIRD text-to-SQL benchmark's strict execution-accuracy metric agrees with human experts only ~62% of the time, generating false negatives on functionally correct answers). LLM-as-judge emerged as the scaling move, arriving with documented biases — position, verbosity, self-preference — that made uncalibrated judging a new way to be confidently wrong.<\/p>\n<h3>Era 3 — Harnesses and drift detection (2025–2026)<\/h3>\n<p>Evaluation industrialized into engineering infrastructure: versioned eval suites run in CI on every prompt/model/context change, with regressions gating deployment (\"eval without gates is decoration\"). LLM-as-judge matured from a trick into a calibrated instrument — human-agreement targets, multi-method scoring with disagreement detection, sampled scoring economics. The frontier problem moved twice: from <em>scoring<\/em> to <em>drift<\/em> (models update, usage shifts, and the eval set itself goes stale — the dominant failure mode is now operational cadence, not technique), and from single calls to <em>agent trajectories<\/em> (evaluating multi-step tool use, not just final text). The eval set became the durable asset — more valuable than the prompts it tests, because it survives every model migration.<\/p>\n<h2>Deprecated patterns (stop teaching these)<\/h2>\n<ul>\n<li>❌ <strong>Shipping on demo<\/strong> — an anecdote is a sample size of one, selected by the person with the most to gain.<\/li>\n<li>❌ <strong>Benchmark-number worship<\/strong> — public benchmark scores are contaminated, gameable, and only loosely correlated with human judgment on your task; build task-specific evals instead.<\/li>\n<li>❌ <strong>Uncalibrated LLM-as-judge<\/strong> — a judge without a measured human-agreement rate inherits every bias of the model plus false authority.<\/li>\n<li>❌ <strong>Evaluate-once-at-launch<\/strong> — models update under you and usage drifts; an eval that ran once is a photograph, not a monitor.<\/li>\n<li>❌ <strong>Eval as post-build QA<\/strong> — defining \"good\" after seeing the output means the output defines \"good\"; the ordering is the discipline (criteria → check → generate).<\/li>\n<\/ul>\n<h2>What survived<\/h2>\n<p>Era 1's core — a human reading real output with judgment — survives as both the Tier 1 practice (the One Rule) and the ground-truth anchor of every Tier 4 harness: calibration sets are human-labeled, drift audits are human-in-the-loop. Era 2's rubrics survive <em>inside<\/em> the harness as the judge's scoring criteria. This platform is itself the pattern at organizational scale: rubrics version with lessons, assessment is artifacts plus observed behavior (never quizzes), and the Monday-Morning Diagnostic is a behavioral eval with evidence prompts — evaluation-practice applied to humans learning AI.<\/p>\n<h2>Boundary conditions (where older practice is still correct)<\/h2>\n<ul>\n<li><strong>Personal, reversible work needs no harness.<\/strong> The One Rule is the correct and complete practice for Tier 1–2 drafts; harness overhead there kills the habit formation the maturity strategy depends on.<\/li>\n<li><strong>Low-volume team workflows<\/strong> are properly served by Era 2: a golden set of 10–20 real cases re-run on change beats both \"seems right\" and a premature harness. Build the harness when the workflow reaches production cadence or external stakes (D6's risk tiers make the trigger explicit).<\/li>\n<li><strong>Deterministic properties don't need judges.<\/strong> Schema validity, format conformance, and referential integrity are exact checks (see structured-outputs) — spending judge tokens on them is waste; the judge is for qualities only judgment can score.<\/li>\n<\/ul>\n<h2>Signals to watch (would trigger Era 4)<\/h2>\n<ul>\n<li>Models whose self-evaluation is trusted natively at production stakes (would collapse the judge/calibration layer).<\/li>\n<li>Vendor-managed drift detection and auto-updating eval sets as platform primitives (would absorb the cadence discipline — the skill shifts to auditing the vendor's evals).<\/li>\n<li>Regulatory frameworks mandating documented evaluation for deployed AI (would convert this practice from engineering discipline to compliance artifact — governance implications land in D1/D6 territory).<\/li>\n<\/ul>\n<h2>Sources<\/h2>\n<ul>\n<li><a href=\"https://logiciel.io/blog/llm-eval-harness-internal-build-2026\">Evaluating LLM Outputs: Internal Eval Harness for 2026<\/a> (2026) — harness operating cadence as the dominant failure mode; versioning, CI integration, regression gates.<\/li>\n<li><a href=\"https://deepeval.com/blog/llm-as-a-judge\">LLM-as-a-Judge in 2026<\/a> (DeepEval, 2026) — calibration to ~85–90% human agreement; multi-method scoring with disagreement detection; judge bias catalog.<\/li>\n<li><a href=\"https://www.adaline.ai/blog/complete-guide-llm-ai-agent-evaluation-2026\">The Complete Guide to LLM &amp; AI Agent Evaluation in 2026<\/a> (Adaline, 2026) — sampled production scoring (~5–10% judge, 100% heuristic), agent-trajectory evaluation, drift monitoring.<\/li>\n<li><code>research/Jira Data Cost and Integration Analysis.md<\/code> (owner research, 2026-07) — BIRD benchmark's ~62% human-agreement rate; benchmark fragility vs. production accuracy with schema access.<\/li>\n<li>This platform's own assessment design (<code>docs/maturity-model.md<\/code>, rubrics-in-frontmatter convention, placement diagnostic) — evaluation-practice applied to human learning; the internal case study.<\/li>\n<\/ul>"}, "prompting-frameworks": {"meta": {"id": "prompting-frameworks", "practice": "Prompt Engineering", "status": "current", "last_reviewed": "2026-07-10", "review_cadence": "quarterly", "model_generations": ["gpt-3.5/4-era", "gpt-4.5+/5.x-era", "frontier-2026"], "referenced_by": ["A2", "A2E", "A3", "A3E", "C1", "C5"], "curators": ["platform-owner"], "title": "Evolution Entry: Prompting Frameworks (CREATE → Outcome-First → Context Engineering)"}, "html": "<h1>Evolution Entry: Prompting Frameworks (CREATE → Outcome-First → Context Engineering)<\/h1>\n<h2>Current guidance (teach this today)<\/h2>\n<p>Use the smallest prompt that adequately defines:<\/p>\n<blockquote>\n<p><strong>Outcome + context + constraints + evidence + output + validation<\/strong><\/p>\n<\/blockquote>\n<p>Add roles, examples, and procedural instructions only when testing demonstrates they improve performance. Good prompting today looks like writing a crisp ticket or spec — not a long incantation. The leverage has moved from prompt wording to <strong>context shaping<\/strong> (what the model can see, in what order, from which authoritative sources) and <strong>workflow design<\/strong> (chains, agents, quality gates enforced outside the prompt).<\/p>\n<p>For the coach cohort, the practical frame is the updated <strong>CREATE+<\/strong>:<\/p>\n<table>\n<thead>\n<tr>\n<th>Element<\/th>\n<th>Current interpretation<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>C<\/strong> — Context and source authority<\/td>\n<td>Only relevant context; state which sources control. \"Use the attached policy as authoritative; flag conflicts rather than reconciling silently.\"<\/td>\n<\/tr>\n<tr>\n<td><strong>R<\/strong> — Result and audience<\/td>\n<td>Define the outcome, not a generic persona. \"Produce a decision memo the committee can approve, reject, or conditionally approve.\"<\/td>\n<\/tr>\n<tr>\n<td><strong>E<\/strong> — Evidence and examples<\/td>\n<td>Set the evidentiary threshold; examples only where they clarify judgment, as boundary-setters.<\/td>\n<\/tr>\n<tr>\n<td><strong>A<\/strong> — Actions, tools, and autonomy<\/td>\n<td>What the model may do and where approval is required. \"Search and analyze; do not send, modify, or commit.\"<\/td>\n<\/tr>\n<tr>\n<td><strong>T<\/strong> — Tests and trade-offs<\/td>\n<td>How the work will be judged. \"Optimize traceability over breadth; verify citations before finalizing.\"<\/td>\n<\/tr>\n<tr>\n<td><strong>E<\/strong> — Expression and output contract<\/td>\n<td>Format, depth, tone, constraints — as a contract, not vibes.<\/td>\n<\/tr>\n<tr>\n<td><strong>+<\/strong> — Execution loop<\/td>\n<td>Gather → draft → test against acceptance criteria → revise defects → stop when criteria met or evidence insufficient.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>Eras<\/h2>\n<h3>Era 1 — Procedural frameworks (GPT-3.5/4, ~2022–2024)<\/h3>\n<p>Models needed verbose, step-by-step scaffolding to behave reliably. CREATE (Context, Role, Examples, Action, Tone, Expectations) and its cousins were the gold standard: encode a fixed meta-workflow, micromanage the reasoning, wordsmith heavily. \"Act as an expert X…\" personas measurably helped. Clever phrasing mattered because the model's internal planner was weak.<\/p>\n<h3>Era 2 — Outcome-first delegation (GPT-4.5+ / 5.x, ~2024–2026)<\/h3>\n<p>Frontier models arrived with strong internal planners. Vendor guidance flipped: tell the model what success looks like (goal, audience, quality bar) rather than enumerating internal steps — detailed procedural scripts became <strong>distractor tokens<\/strong> that actively hurt performance. The working metaphor shifted from \"instruct every step\" to \"delegate an objective to a capable intern with clear acceptance criteria.\" Structure beat eloquence: schemas, XML-ish scaffolding, and explicit output contracts outperformed baroque roleplay.<\/p>\n<h3>Era 3 — Context and workflow engineering (frontier, 2026–)<\/h3>\n<p>The locus of control moved out of the prompt text entirely:<\/p>\n<ul>\n<li><strong>Context engineering<\/strong> became the recognized discipline: just-in-time retrieval, source hierarchies, and <em>placement<\/em> — the U-shaped attention curve means instructions buried mid-context suffer &gt;30% accuracy drops, so where information sits matters more than how it's worded.<\/li>\n<li><strong>Multi-agent workflow design<\/strong> (planner / implementer / tester / reviewer) became the default for non-trivial production tasks; prompt skill now shows up as defining agent roles, interfaces, tool-call policies, and review loops.<\/li>\n<li><strong>Iteration got cheap<\/strong>: self-critique loops and meta-prompting (have the model design its own prompt/workflow) replaced one-shot perfection.<\/li>\n<li>Prompts became <strong>product surfaces<\/strong>: versioned, short, maintained — one part of a larger contract among agents, tools, and specs.<\/li>\n<\/ul>\n<h2>Deprecated patterns (stop teaching these)<\/h2>\n<ul>\n<li>❌ <strong>Fixed meta-workflow frameworks as universal practice<\/strong> — encoding CREATE-style step scripts into every prompt adds drag to frontier models.<\/li>\n<li>❌ <strong>\"Act as my prompt engineer, interview me, then rewrite\" loops<\/strong> — the model understands the task earlier than the ritual assumes.<\/li>\n<li>❌ <strong>Persona-first prompting as a quality lever<\/strong> — roles only where perspective or decision authority genuinely changes the output.<\/li>\n<li>❌ <strong>Burying format requirements deep in prose<\/strong> — use explicit output contracts / schemas, externally validated where stakes are high.<\/li>\n<li>❌ <strong>One giant prompt for multi-step work<\/strong> — decompose into staged workflows with inspectable intermediate outputs.<\/li>\n<\/ul>\n<h2>What survived from CREATE<\/h2>\n<p>The <em>elements<\/em> remain sound even though the procedural framing is obsolete: curated context, meaningful perspective, boundary-setting examples, a clear action, audience-appropriate tone, explicit expectations. CREATE taught people to communicate clearly with a model; it is incomplete rather than wrong. What it never addressed — source grounding, tool use, uncertainty handling, validation, workflow decomposition, permissions, evaluation, memory, stopping conditions — is exactly what CREATE+ adds.<\/p>\n<h2>Boundary conditions (where Era-1 practice is still correct)<\/h2>\n<p>Rigid, locked-down, CREATE-style prompts remain <strong>essential for small local models<\/strong> (limited internal reasoning; they drift and hallucinate without explicit personas and heavily constrained steps). Modern multi-model orchestration uses both paradigms simultaneously:<\/p>\n<ul>\n<li><strong>Local layer:<\/strong> highly specific, constrained prompts driving small models for narrow repetitive tasks (classification, formatting, structured JSON) — cheap and reliable.<\/li>\n<li><strong>Frontier layer:<\/strong> broad, outcome-first prompts for heavy reasoning, architecture, and strategy.<\/li>\n<\/ul>\n<p>The engineering judgment has shifted from \"write the perfect prompt\" to \"know where the rowboat is more efficient than the speedboat.\"<\/p>\n<h2>Signals to watch (would trigger Era 4)<\/h2>\n<ul>\n<li>Vendor guidance deprecating explicit output contracts in favor of learned intent (would weaken the schema-first rule).<\/li>\n<li>Long-context attention becoming flat (would weaken placement rules).<\/li>\n<li>Agent frameworks absorbing prompt authoring entirely (prompts become generated artifacts, and this entry's unit of curation shifts to workflow specs).<\/li>\n<\/ul>\n<h2>Sources<\/h2>\n<ul>\n<li>Founding research conversations (Perplexity, Gemini, ChatGPT synthesis), captured 2026-07 in <code>learning_program_scraps.md<\/code> — cross-model consensus on outcome-first, context engineering, structure-over-cleverness, multi-agent defaults, and the CREATE+ reformulation.<\/li>\n<li>Vendor prompting guides (OpenAI GPT-5-era guidance; Anthropic prompt-engineering docs) — re-verify at each quarterly review.<\/li>\n<li>U-shaped attention / lost-in-the-middle findings — re-verify against current long-context evals at each review.<\/li>\n<\/ul>"}, "schema-driven-ui": {"meta": {"id": "schema-driven-ui", "practice": "Schema-Driven UI (declaring layout as a contract)", "status": "current", "last_reviewed": "2026-08-01", "review_cadence": "quarterly", "model_generations": ["paste-the-mockup-era", "design-system-era", "schema-driven-era"], "referenced_by": ["B5D"], "curators": ["platform-owner"], "title": "Evolution Entry: Schema-Driven UI (Paste-the-Mockup → Design-System Components → Declared Contract)"}, "html": "<h1>Evolution Entry: Schema-Driven UI (Paste-the-Mockup → Design-System Components → Declared Contract)<\/h1>\n<p>The volatile tooling and standards layer for describing a UI as a <em>contract<\/em> lives here, so B5D can\ncite it instead of embedding claims that move. The durable idea — declare the layout so intent is a\nreviewable file, not a guess reconstructed from pixels — is taught in the lesson.<\/p>\n<h2>Current guidance (teach this today)<\/h2>\n<ul>\n<li><strong>Three layers, three names.<\/strong> <em>Data schema<\/em> says what the thing is; <em>UI schema<\/em> says how it's laid\n  out, referencing into the data schema; <em>design tokens<\/em> say how it's styled. The umbrella is\n  <strong>schema-driven UI<\/strong>. JSON Forms uses exactly this data-schema/UI-schema pairing; react-jsonschema-\n  form calls the layout object <code>uiSchema<\/code> and mirrors the data schema's structure. \"JSON Schema tells\n  <em>what<\/em>; uiSchema tells <em>how<\/em>.\"<\/li>\n<li><strong>Keep the layers separate, one source.<\/strong> Domain schema is canonical; the UI schema references it;\n  the API contract is generated from it. One source, three artifacts. A single schema serving both UI\n  and API becomes a leaky compromise — the API wants normalized/resource-shaped, the view wants\n  denormalized/display-shaped. (This is why JSON Forms split them rather than annotating one blob.)<\/li>\n<li><strong>Emit tokens in the DTCG format.<\/strong> The Design Tokens Community Group spec reached its first stable\n  version (2025.10, 28 Oct 2025) — vendor-neutral, 20+ contributing orgs (Adobe, Google, Meta,\n  Microsoft, Figma, Salesforce, Shopify…), with Style Dictionary v4 support. Target it and you inherit\n  the transformation ecosystem instead of inventing a private dialect.<\/li>\n<li><strong>It replaces the handoff, not design.<\/strong> Exploration of visual alternatives and the shared review\n  surface stay with design tools. What schema-driven UI replaces is <strong>Figma-as-handoff-artifact<\/strong> —\n  which was always a lossy translation between two representations.<\/li>\n<li><strong>The artifact is a boundary object.<\/strong> One declared layout lets the spec reader, the UI implementer,\n  and the later API implementer coordinate without a shared vocabulary — a <em>boundary object<\/em> (design-\n  research term), a more useful frame than \"micro-spec\" because it says <em>why<\/em> it works.<\/li>\n<\/ul>\n<h2>Eras<\/h2>\n<h3>Era 1 — Paste the mockup (~2022–2024)<\/h3>\n<p>A design is exported as flattened markup and pasted in; the agent (or the developer) re-infers intent\nfrom pixels because nothing was declared. Sometimes the inference is right; nobody knows which times,\nbecause there's no artifact to check it against. The design decision was never written down.<\/p>\n<h3>Era 2 — Design-system components (2023–2025)<\/h3>\n<p>Component libraries and tokens reduced the guesswork by standardizing the pieces, but the <em>layout<\/em> of a\ngiven screen still lived in a canvas and got handed off by translation. The handoff remained a phase.<\/p>\n<h3>Era 3 — Declared contract / schema-driven UI (2025–2026)<\/h3>\n<p>The layout itself becomes a declared artifact — a UI schema referencing a data schema, styled by\ntokens in a now-stable interchange format (DTCG 2025.10). Intent moves from a designer's head → canvas\n→ serialized markup → guessed-back, to a file that is reviewable, diffable, and wrong in ways someone\ncan point at. Handoff stops being a phase rather than merely getting faster.<\/p>\n<h2>Deprecated patterns (stop teaching these)<\/h2>\n<ul>\n<li>❌ <strong>Paste flattened markup and let the model infer intent<\/strong> — the contract disappears at the paste.<\/li>\n<li>❌ <strong>One schema serving UI and API<\/strong> — a leaky compromise that satisfies neither.<\/li>\n<li>❌ <strong>Handoff as a phase<\/strong> — if the layout is the contract, there is nothing to translate.<\/li>\n<li>❌ <strong>Private token dialects<\/strong> — a bespoke token format forfeits the DTCG transformation ecosystem.<\/li>\n<li>❌ <strong>The lab-conditions demo<\/strong> — a workflow that only survives on a freshly imaged, specific machine\n  (the brand-new-Mac, Cmd-V demo) is demonstrating a <em>tool<\/em>, not a <em>process<\/em>. Treat it as a tell.<\/li>\n<\/ul>\n<h2>What survived<\/h2>\n<p>Design's real work survived wholesale: divergent exploration and the stakeholder review surface are\nthings a schema does not do and a design tool still should. Tokens survived and got a standard. What\nchanged is where <em>intent<\/em> lives — from a canvas that gets translated to a contract that gets referenced.<\/p>\n<h2>Boundary conditions (where older practice is still correct)<\/h2>\n<ul>\n<li><strong>Exploration still belongs on a canvas<\/strong> — schema-driven UI is for the layout you've <em>decided<\/em>, not\n  the ten you're weighing.<\/li>\n<li><strong>Build-time vs runtime matters.<\/strong> Schema-driven UI here is <em>build-time<\/em> declared layout. If the\n  layout is delivered and interpreted at runtime, that's <strong>Server-Driven UI<\/strong> — a different label with\n  different tradeoffs; don't conflate them.<\/li>\n<li><strong>Small static screens may not need it<\/strong> — the contract earns its keep when a UI, an API, and a spec\n  reader must stay in sync over time.<\/li>\n<\/ul>\n<h2>Signals to watch (this entry will move)<\/h2>\n<ul>\n<li>DTCG version and adopter list; whether your design tool emits DTCG-format tokens natively.<\/li>\n<li>JSON Forms / react-jsonschema-form conventions (the <code>uiSchema<\/code> shape) as they evolve.<\/li>\n<li>Whether \"UI schema\" consolidates around one cross-tool spec or stays library-specific.<\/li>\n<li>StructureView's own JSON layout activity (owner tooling) as a producer of these artifacts.<\/li>\n<\/ul>\n<h2>Sources<\/h2>\n<ul>\n<li>W3C Design Tokens Community Group — \"Design Tokens specification reaches first stable version\"\n  (2025.10, 28 Oct 2025). https://www.w3.org/community/design-tokens/2025/10/28/design-tokens-specification-reaches-first-stable-version/<\/li>\n<li>JSON Forms — data schema + UI schema pairing (jsonforms.io).<\/li>\n<li>react-jsonschema-form — <code>uiSchema<\/code> API (rjsf-team.github.io).<\/li>\n<li>Boundary object — Star &amp; Griesemer (design/CSCW research term).<\/li>\n<li>Contract-first / design-first — OpenAPI practice.<\/li>\n<li>Verified 2026-08-01 (DTCG stable version + the JSON-Schema/uiSchema pairing).<\/li>\n<\/ul>"}, "shift-left-economics": {"meta": {"id": "shift-left-economics", "practice": "Cost-of-Change / Shift-Left Economics", "status": "current", "last_reviewed": "2026-07-11", "review_cadence": "quarterly", "model_generations": ["boehm-era", "agile-cheap-change-era", "spec-and-eval-era-2026"], "referenced_by": ["B3", "C5", "D5"], "curators": ["platform-owner"], "title": "Evolution Entry: Shift-Left Economics (Boehm's Curve → Cheap Change → Specs and Evals as the New Left)"}, "html": "<h1>Evolution Entry: Shift-Left Economics (Boehm's Curve → Cheap Change → Specs and Evals as the New Left)<\/h1>\n<h2>Current guidance (teach this today)<\/h2>\n<p>The curve didn't flatten — <strong>the cost moved from rework to review, and \"the left\" moved from documents to machine-checkable artifacts.<\/strong> Current working rules:<\/p>\n<ul>\n<li><strong>Detection timing still dominates cost.<\/strong> 2026 industry figures hold the classic shape: a defect caught at unit/coding stage costs on the order of $25; the same defect in production runs $10,000+ — and in regulated domains the right end of the curve isn't a bug ticket at all, it's an enforcement action (a misleading AI-generated customer communication is a FINRA 2210 problem, not a hotfix).<\/li>\n<li><strong>Generation is cheap; validation is the scarce resource.<\/strong> The DORA 2026 finding, stated plainly: as AI accelerates code generation, the bottleneck shifts to specification and verification — they are no longer overhead but the constraint. Teams measuring the full picture report AI-assisted first-year costs running ~12% <em>higher<\/em> than baseline once review overhead (~9%), a ~1.7× testing burden, and ~2× code churn are counted (as of 2026 — see Sources; re-verify, these are young numbers).<\/li>\n<li><strong>The new left is specs, evals, and HITL gates.<\/strong> Requirements documents were never machine-checkable; tests checked code after it existed. The current form: specs precise enough to generate and judge against (the spec pipeline this platform runs on), eval gates that block shipment (evaluation-practice, era 3), and human-in-the-loop review placed by risk tier (D6) where stakes demand it. Approve the spec and the artifact is mechanical; skip the spec and you're paying the validation tax with interest, later, in production.<\/li>\n<li><strong>Spend review effort where regeneration can't save you.<\/strong> \"Just regenerate it\" is a real strategy for reversible, low-stakes work (see Boundary conditions) and a cost multiplier everywhere else — churn data says regenerated code that was never specified gets regenerated again.<\/li>\n<\/ul>\n<h2>Eras<\/h2>\n<h3>Era 1 — Boehm's curve (~1981–2000s)<\/h3>\n<p>The founding empirical result: cost-to-fix grows dramatically with each lifecycle phase between introduction and detection. The practice consequence was heavy front-loading — big requirements documents, formal reviews, change control — because <em>change itself<\/em> was expensive and late change was ruinous. Right conclusion, heavy instrument: the left was paper.<\/p>\n<h3>Era 2 — Agile's cheap-change critique (2000s–2023)<\/h3>\n<p>Iterative delivery, automated tests, CI, and refactoring tooling genuinely flattened the middle of the curve for reversible software — the \"cost of change curve is outdated\" position had real evidence behind it. The left migrated from documents to <em>executable<\/em> checks: TDD, CI gates, trunk-based flow. The era's honest core: when change is cheap and reversible, betting on adaptation beats betting on prediction. Its overreach: treating the flattening as universal — it never applied to the irreversible right end (data loss, customer harm, compliance), and it assumed a human wrote and understood every line.<\/p>\n<h3>Era 3 — AI generation and the validation squeeze (2024–2026)<\/h3>\n<p>Code became nearly free to produce and the curve responded by <em>twisting<\/em>, not flattening: writing cost collapsed while validation cost grew to absorb it. Measured 2026 reality: higher defect and churn rates in AI-generated code with problems surfacing disproportionately <em>after<\/em> release; net first-year costs above baseline once review and testing burdens are counted; DORA naming specification and verification as the new constraint. The response is the reconstituted left — specs as quality gates (generate <em>from<\/em> the spec, judge <em>against<\/em> it), eval harnesses in CI, compliance requirements entering sprints as explicit user stories/NFRs (compliance by design — the owner's Black Box material is the regulated-industry playbook for exactly this). Boehm's insight survives translated: <strong>the cheapest place to catch a defect is now the spec review, because everything downstream of the spec is generated volume.<\/strong><\/p>\n<h2>Deprecated patterns (stop teaching these)<\/h2>\n<ul>\n<li>❌ <strong>Heavy documents as the shift-left instrument<\/strong> — paper isn't machine-checkable; a 40-page requirements doc shifts blame left, not defects.<\/li>\n<li>❌ <strong>\"Just regenerate it\" as a universal defect strategy<\/strong> — 2× churn is the measured cost of regenerating unspecified work; regeneration without a spec re-rolls the dice, it doesn't fix them.<\/li>\n<li>❌ <strong>Code-volume and speed metrics as productivity<\/strong> — generation speed measures the cheap part; unvalidated velocity is inventory, not throughput.<\/li>\n<li>❌ <strong>Skipping the spec because the code is cheap<\/strong> — inverts the actual economics; the spec is now the highest-leverage artifact precisely <em>because<\/em> the code is cheap.<\/li>\n<li>❌ <strong>Treating the flattened curve as universal<\/strong> — Agile's flattening applied to reversible change; the irreversible right end (production data, customers, regulators) is steeper than the 1981 original in consequence terms.<\/li>\n<\/ul>\n<h2>What survived<\/h2>\n<p>Boehm's core finding survives fully: detection later costs more, and 2026 production-defect figures still trace his shape. Agile's contribution survives as a boundary condition rather than a refutation: cheap reversibility genuinely flattens the middle for low-stakes work, and iterative delivery remains the right default. The through-line across all three eras: <strong>move the checkable thing as early as possible<\/strong> — it was reviews, then tests, now specs and evals. This platform is its own case study: the module spec's Definition of Ready catches a mis-pitched lesson at spec time (minutes) instead of after an authoring session (hours) or a confused cohort (weeks).<\/p>\n<h2>Boundary conditions (where older practice is still correct)<\/h2>\n<ul>\n<li><strong>Reversible, low-stakes, internal work:<\/strong> regenerate-and-move-on is legitimately fine; imposing spec ceremony on a throwaway script is Era-1 cosplay. The curve is genuinely flat where undo is genuinely free (D6's read-only/reversible tiers make the boundary operational).<\/li>\n<li><strong>Prototypes and spikes<\/strong> are exempt by purpose — their deliverable is learning, not artifact durability. Mark them as spikes and never promote them silently (the S69-style disposition step is the promotion gate).<\/li>\n<li><strong>Agile-era test-first practice remains the correct left for human-written code<\/strong> — the spec-and-eval left is <em>additive<\/em> where generation enters, not a replacement for TDD where it doesn't.<\/li>\n<\/ul>\n<h2>Signals to watch (would trigger Era 4)<\/h2>\n<ul>\n<li>Validation itself becoming reliably automatable (self-verifying generation with trusted evals) — would collapse the review bottleneck and genuinely flatten the middle again.<\/li>\n<li>Measured AI defect/churn rates converging to human baselines (vendor-claimed every quarter; verify against DORA-class longitudinal data, not marketing).<\/li>\n<li>Regulatory regimes pricing post-delivery AI defects explicitly (fines schedules) — would let the right end of the curve be modeled in dollars instead of argued.<\/li>\n<\/ul>\n<h2>Sources<\/h2>\n<ul>\n<li>Boehm, <em>Software Engineering Economics<\/em> (1981) — the founding curve; <a href=\"https://www.researchgate.net/figure/Historical-cost-to-fix-curve-Adapted-from-Boehm-1981-p-40_fig11_308264787\">historical cost-to-fix adaptation<\/a>.<\/li>\n<li><a href=\"https://www.mountaingoatsoftware.com/blog/the-cost-of-change-curve-is-outdated\">The Cost of Change Curve Is Outdated<\/a> (Mountain Goat Software) — the era-2 critique, pre-AI.<\/li>\n<li><a href=\"https://getautonoma.com/blog/cost-of-production-bug\">The Cost of a Production Bug in 2026<\/a> (2026) — $25 unit → $10K+ production escalation, current figures.<\/li>\n<li><a href=\"https://www.codebridge.tech/articles/the-hidden-costs-of-ai-generated-software-why-it-works-isnt-enough\">The Hidden Costs of AI-Generated Code in 2026<\/a> and <a href=\"https://www.secondtalent.com/resources/ai-generated-code-quality-metrics-and-statistics-for-2026/\">AI-Generated Code Quality Metrics 2026<\/a> — ~12% net first-year cost increase, ~9% review overhead, ~1.7× testing burden, ~2× churn.<\/li>\n<li><a href=\"https://www.coderabbit.ai/blog/2025-was-the-year-of-ai-speed-2026-will-be-the-year-of-ai-quality\">2025 was the year of AI speed; 2026 will be the year of AI quality<\/a> (CodeRabbit, citing DORA 2026) — specification and verification as the scarce resource.<\/li>\n<li><a href=\"https://arxiv.org/pdf/2603.25773\">The Specification as Quality Gate<\/a> (arXiv 2603, 2026) — spec-anchored review hypotheses for AI-assisted development.<\/li>\n<li><code>research/navigating-the-black-box.md<\/code> (owner conference material, 2026) — regulated-domain right end of the curve: HITL as control, compliance as user stories/NFRs.<\/li>\n<\/ul>"}, "structured-outputs": {"meta": {"id": "structured-outputs", "practice": "Structured Outputs", "status": "current", "last_reviewed": "2026-07-10", "review_cadence": "quarterly", "model_gene
