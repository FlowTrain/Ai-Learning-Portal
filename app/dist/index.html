C → AI draft → critique → final plan<\/li>\n<li>Improved AC: minimum 3 Given/When/Then criteria including at least 1 unhappy path<\/li>\n<li>Critique: categories AI got right, at least 1 invented behavior caught, at least 1 missing category added<\/li>\n<li>Final test plan: 5+ test scenarios, each with explicit expected result<\/li>\n<\/ul>"}, "B3E": {"meta": {"id": "B3E", "courseId": "enabled-eng", "tier": "enabled", "roleIds": ["engineer", "tl", "data"], "durationMin": 25, "creditHours": 1, "staircaseRung": 2, "buildsBehaviors": ["Tier 2: assembles the full input chain (ACs, boundary doc, context file) before test generation", "Tier 2: reviews generated tests for realistic data and contract-aligned mocks"], "title": "AI-Assisted Test Generation"}, "html": "<h1>AI-Assisted Test Generation<\/h1>\n<blockquote>\n<p>AI can generate test skeletons from acceptance criteria faster than any engineer can write boilerplate — but the quality of the tests is entirely determined by the quality of the input. This lesson builds the input discipline that makes AI test generation reliable.<\/p>\n<\/blockquote>\n<h2>The Test Generation Input Chain<\/h2>\n<p>Quality test generation requires: structured acceptance criteria (Given/When/Then), the service boundary doc (so the AI knows what dependencies to mock), and the CLAUDE.md (so the AI knows your test patterns and framework). When all three are present, AI generates test skeletons that match your actual patterns. When any one is missing, AI invents patterns that require manual correction.<\/p>\n<h2>What AI Generates Well vs. Poorly<\/h2>\n<p>AI generates reliably: happy path tests, input validation tests, simple integration stubs. AI generates poorly: tests that require understanding of organizational context (what 'premium user' means in your specific system), tests for non-functional requirements (performance, security), and tests that depend on production data patterns. Engineer judgment is always required for test data selection and environment configuration.<\/p>\n<h2>The Review Loop<\/h2>\n<p>After AI generates test skeletons, run this review: (1) Do the test names describe the behavior being tested? (2) Are the test data values realistic, or did AI use placeholder values that would never occur in production? (3) Does the test actually test what the acceptance criterion says? (4) Are mocks aligned with the actual service contract? Catch these in review, not in CI.<\/p>\n<h2>Assignment<\/h2>\n<p>Generate test skeletons for a real feature in your current sprint using AI. Provide your CLAUDE.md, service boundary doc, and structured ACs as context. Document the review loop: what you changed, what you kept, and why.<\/p>\n<h3>Deliverables<\/h3>\n<ul>\n<li>test-generation-[feature].md: context provided → AI output → review loop results<\/li>\n<li>At least 5 test skeletons generated<\/li>\n<li>Review loop: 2 changes made (with rationale), 2 things kept (with rationale)<\/li>\n<li>One test the AI could not generate without your judgment — explain why<\/li>\n<\/ul>"}, "B4": {"meta": {"id": "B4", "courseId": "enabled-pm", "tier": "enabled", "roleIds": ["pm", "coach", "engineer", "tl", "designer", "data"], "durationMin": 25, "creditHours": 1, "staircaseRung": 3, "buildsBehaviors": ["Tier 2→3: defines the schema before asking AI for structured output", "Tier 2→3: validates machine-readable output before it enters a pipeline"], "libraryRefs": ["structured-outputs"], "title": "Structured JSON from Product Descriptions"}, "html": "<h1>Structured JSON from Product Descriptions<\/h1>\n<blockquote>\n<p>Machine-readable output from AI is only useful when the structure is right. This lesson teaches you to turn product descriptions into validated JSON for Storybook configs, service inventories, and automation pipelines — without relying on AI to guess the schema.<\/p>\n<\/blockquote>\n<h2>Define the Schema First<\/h2>\n<p>The fastest way to get bad JSON from AI: ask for JSON without specifying the schema. The right workflow: (1) write the target schema in a comment or example, (2) provide the structured description, (3) prompt AI to populate the schema from the description. When the schema is explicit, AI fills fields correctly. When it's implicit, AI invents fields and omits required ones.<\/p>\n<h2>Validation Criteria<\/h2>\n<p>Before using AI-generated JSON, validate: all required fields are present and non-null, field values match the types in the schema, array values are arrays (not comma-separated strings), enum fields contain only valid values, and no invented fields appear that aren't in the schema. A JSON linter catches type errors. Only a human who knows the product can catch invented content. (How enforcement of structure has shifted from prompts to APIs to decoders — and why valid never means correct — is tracked in the Evolution Library: see the structured-outputs entry.)<\/p>\n<h2>High-Value Use Cases<\/h2>\n<p>The highest-ROI JSON generation workflows for product teams: (1) Storybook component configs from UI descriptions, (2) service inventory JSON from service boundary docs, (3) test fixture data from acceptance criteria, (4) feature flag configs from PRD sections. Each of these drops from a substantial manual chore to minutes with AI — when the inputs are structured.<\/p>\n<h2>Assignment<\/h2>\n<p>Define a JSON schema for one product artifact you regularly create (component config, service inventory, feature spec). Use AI to populate the schema from one of your structured descriptions. Validate the output and document what required correction.<\/p>\n<h3>Deliverables<\/h3>\n<ul>\n<li>json-output-[artifact].json: the populated, validated JSON<\/li>\n<li>json-schema-[artifact].json or inline schema definition<\/li>\n<li>json-notes.md: what the AI got right, what it invented, what required correction<\/li>\n<li>Use case note: how this JSON will be consumed downstream (Storybook, pipeline, etc.)<\/li>\n<\/ul>"}, "B5D": {"meta": {"id": "B5D", "courseId": "enabled-design", "tier": "enabled", "roleIds": ["designer", "pm", "tl"], "durationMin": 25, "creditHours": 1, "staircaseRung": 3, "buildsBehaviors": ["Tier 2/3: declares a layout as a UI schema referencing a data schema instead of pasting flattened markup", "Tier 2/3: can name what the handoff paste silently drops, and states the precise claim (AI replaces the handoff, not design)"], "libraryRefs": ["schema-driven-ui"], "rubric": [{"criterion": "Layout declared, not pasted", "emerging": "Describes the screen as a picture or a paste", "working": "Expresses it as a UI schema that references a data schema", "strong": "Keeps data / UI / token layers separate with one canonical source"}, {"criterion": "Names what the handoff dropped", "emerging": "Treats handoff as merely slow", "working": "Names one decision the paste left the implementer to guess", "strong": "Shows how the declared version makes that decision reviewable"}, {"criterion": "The precise claim about design", "emerging": "Says AI replaces design / Figma", "working": "Says it replaces the handoff, not exploration or the review surface", "strong": "Can name what stays with design tools, and why"}], "title": "AI Replaces the Handoff, Not the Design"}, "html": "<h1>AI Replaces the Handoff, Not the Design<\/h1>\n<blockquote>\n<p>The fear in the room is that AI replaces designers. It doesn't — and putting it that way makes designers defensive <em>and<\/em> gets the claim wrong. What AI, and a declared layout, replaces is the <strong>handoff<\/strong>: the moment a design becomes a mockup someone else has to translate back into a working screen. That translation always leaked. This lesson moves the design decision out of the translation and into a contract — a file the whole team can read, diff, and be wrong in on purpose.<\/p>\n<\/blockquote>\n<h2>Start Here: Where Did the Decision Actually Get Decided? (5 minutes)<\/h2>\n<p>Take one screen your team shipped recently. Pick a single specific choice — a spacing, a state, a breakpoint — and trace it back to where it was <em>decided<\/em>. Not where it was drawn; where it was decided.<\/p>\n<p>Most of the time the honest answer is: in someone's head, then redrawn on a canvas, then guessed at in code. Hold that answer — the rest of the lesson is about closing that gap.<\/p>\n<h2>The Handoff Was Always Lossy (6 minutes)<\/h2>\n<p>There's a whole genre of \"design handoff specs,\" and it exists for one reason: handoff is a translation between two representations — a canvas and a codebase — and translations leak. When a mockup is pasted in as flattened markup, whatever the designer <em>meant<\/em> by that spacing or that state arrives as one undifferentiated blob, and the implementer (human or AI) re-infers intent from pixels because nothing was declared. Sometimes the inference is right. Nobody knows which times, because there's nothing to check it against.<\/p>\n<p>That's the real cost — not the keystrokes. The design decision was never written down anywhere, so it gets reconstituted by guess.<\/p>\n<h2>Three Layers, Three Names (6 minutes)<\/h2>\n<p>The fix is to declare it. There are three layers, and each has a real name (the current tooling specifics live in the <code>schema-driven-ui<\/code> library entry, because they move):<\/p>\n<ul>\n<li><strong>Data schema<\/strong> — what the thing <em>is<\/em>: the fields, their types, their relationships.<\/li>\n<li><strong>UI schema<\/strong> — how it's <em>laid out<\/em>, referencing the data schema. The standard phrasing: the data schema tells <em>what<\/em>, the UI schema tells <em>how<\/em>.<\/li>\n<li><strong>Design tokens<\/strong> — how it's <em>styled<\/em>: color, spacing, type — ideally emitted in the standard token format so you inherit the tooling instead of inventing a private dialect.<\/li>\n<\/ul>\n<p>Keep them separate: the domain schema is canonical, the UI schema references it, and the API contract is generated from it. One source, three artifacts. A single schema trying to serve both the screen and the API becomes a compromise that serves neither — the API wants normalized and resource-shaped, the view wants denormalized and display-shaped.<\/p>\n<h2>The Paste Is Where the Contract Dies (5 minutes)<\/h2>\n<p>Watch the actual keystroke. Pasting a flattened mockup isn't just tedious — it's the moment the contract disappears. Before the paste, the design decision <em>could<\/em> have been a file. After it, it's a guess.<\/p>\n<p>So declaring the layout isn't about less clipboard; it changes <strong>who holds the intent<\/strong> — from a designer's memory to a reviewable, diffable artifact that three roles (the spec reader, the UI implementer, the later API implementer) can coordinate on without a shared vocabulary. That shared artifact even has a name: a <strong>boundary object<\/strong>.<\/p>\n<h2>The Lab-Demo Tell (3 minutes)<\/h2>\n<p>One field note worth keeping. If a slick AI-design workflow only works on a freshly imaged, specific machine — the brand-new laptop, the exact setup — you're watching a demo that survives under laboratory conditions, not a process. It's usually a sign that the thing being shown is the tool, not a workflow someone can run on a Monday. Ask which of your own pilots would pass that test.<\/p>\n<h2>Assignment<\/h2>\n<p>Express one real screen as a contract instead of a picture.<\/p>\n<h3>Deliverables<\/h3>\n<ul>\n<li><code>ui-contract.md<\/code> — one screen as the three layers: a small <strong>data schema<\/strong> (what it is), a <strong>UI schema<\/strong> that references it (how it's laid out), and which <strong>token set<\/strong> styles it<\/li>\n<li>One sentence: what the old paste-the-mockup path left the implementer to <strong>guess<\/strong><\/li>\n<li>One line: whether this workflow would survive on a machine that isn't yours — the lab-demo test<\/li>\n<\/ul>"}, "C1": {"meta": {"id": "C1", "courseId": "fluent-chains", "tier": "fluent", "roleIds": ["pm", "coach", "engineer", "tl", "designer", "data", "leader"], "durationMin": 30, "creditHours": 1, "staircaseRung": 3, "buildsBehaviors": ["Tier 3: designs chains others can run from documentation alone", "Tier 3: writes acceptance criteria per step before writing prompts"], "libraryRefs": ["prompting-frameworks", "evaluation-practice", "agent-orchestration"], "title": "Designing Reusable Prompt Chains"}, "html": "<h1>Designing Reusable Prompt Chains<\/h1>\n<blockquote>\n<p>AI-Fluent practitioners don't just use prompt chains — they design them for others to run without explanation. This lesson teaches chain architecture: step decomposition, failure mode handling, human-in-the-loop design, and documentation standards that make chains handoff-ready.<\/p>\n<\/blockquote>\n<h2>Chain Architecture Principles<\/h2>\n<p>A well-designed prompt chain is deterministic (the same inputs produce equivalent outputs), inspectable (every step's output can be checked before the next runs), recoverable (a failed step can be re-run without restarting), and handoff-ready (someone who didn't build it can run it from the documentation alone). These four properties separate a personal workflow hack from a team asset.<\/p>\n<h2>Failure Mode Engineering<\/h2>\n<p>Every chain step has two failure modes: the AI produces wrong output, or the AI produces no output. Build explicit gates: before triggering step N+1, verify that step N's output meets the acceptance criteria for that step. Write the acceptance criteria before you write the prompt — this forces you to define 'good' before you see what AI produces, which is the only honest way to evaluate it. (This criteria-first ordering is the through-line of the evaluation-practice Evolution Library entry.)<\/p>\n<h2>The Handoff Test<\/h2>\n<p>A chain is ready to share when: you can give the documentation to a teammate with your same role (but without your product context), and they can run the chain on their own product surface and get equivalent-quality output within one try. If they need to ask you questions, the chain is underspecified. If the quality depends on your personal context, the chain hasn't been generalized enough.<\/p>\n<h2>Assignment<\/h2>\n<p>Take one prompt chain you built in a prior lesson and redesign it to pass the handoff test. Add explicit acceptance criteria to each step. Document all failure modes and recovery paths. Give it to one teammate to run — document what they needed to ask you.<\/p>\n<h3>Deliverables<\/h3>\n<ul>\n<li>prompt-chain-v2-[name].md: redesigned chain with acceptance criteria per step<\/li>\n<li>Failure mode register: at least 2 failure modes per step with recovery actions<\/li>\n<li>Handoff test results: what your teammate asked, what you updated as a result<\/li>\n<li>Diff: what changed from v1 to v2 and why<\/li>\n<\/ul>"}, "C2": {"meta": {"id": "C2", "courseId": "fluent-chains", "tier": "fluent", "roleIds": ["pm", "coach", "engineer", "tl", "designer", "data", "leader"], "durationMin": 25, "creditHours": 1, "staircaseRung": 2, "buildsBehaviors": ["Tier 3: owns team-level AI cost governance with documented baselines", "Tier 3: calculates full ROI (time, tokens, maintenance) before certifying workflows"], "libraryRefs": ["token-economics"], "title": "Token Governance and Cost Management"}, "html": "<h1>Token Governance and Cost Management<\/h1>\n<blockquote>\n<p>AI-Fluent practitioners are accountable for AI costs — not just their own, but their team's. This lesson establishes the governance framework that keeps AI ROI positive: prompt refinement discipline, metered tool policies, and the audit habits that catch waste before it compounds.<\/p>\n<\/blockquote>\n<h2>The Refinement-First Rule<\/h2>\n<p>Before opening any metered AI tool (Figma AI, Claude Code, any agentic session), run one refinement pass in a free or cheap chat window. The goal: compress vague intent into specific, structured instructions. The test: if you read your prompt aloud to a colleague and they couldn't ask a clarifying question, the prompt is specific enough. This one rule substantially reduces metered-tool token consumption.<\/p>\n<h2>Team-Level Governance<\/h2>\n<p>Token governance at team level requires: a 'cost per workflow' baseline (how much does running this chain typically cost?), a usage anomaly threshold (what triggers a review?), and a prompt quality gate before any workflow becomes team-standard. The quality gate: the workflow must have been run at least 3 times with consistent output, and the token cost must be documented in the chain's documentation.<\/p>\n<h2>The AI ROI Calculation<\/h2>\n<p>ROI on AI tooling is: (time saved × hourly rate) − (token cost + maintenance time). Most teams can calculate time saved. Almost no teams calculate token cost or maintenance time. A workflow that saves 2 hours per week but costs $50/month in tokens and 1 hour/week of maintenance has negative ROI at most hourly rates. Build the habit of calculating all three before certifying any workflow as 'approved.'<\/p>\n<h2>Assignment<\/h2>\n<p>Select one AI workflow your team runs regularly. Calculate its current ROI: time saved, token cost (estimate if not tracked), and maintenance overhead. Run one refinement pass to reduce token cost by at least 20%. Document the before/after.<\/p>\n<h3>Deliverables<\/h3>\n<ul>\n<li>cost-governance-[workflow].md: ROI calculation (time saved, token cost, maintenance)<\/li>\n<li>Refinement demonstration: original prompt → refined prompt → token reduction estimate<\/li>\n<li>A 3-rule governance policy for your team's use of metered AI tools<\/li>\n<li>One workflow you would de-certify based on negative ROI, with the math<\/li>\n<\/ul>"}, "C3": {"meta": {"id": "C3", "courseId": "fluent-chains", "tier": "fluent", "roleIds": ["pm", "coach", "engineer", "tl", "designer", "data", "leader"], "durationMin": 30, "creditHours": 1, "staircaseRung": 3, "buildsBehaviors": ["Tier 3: packages proven workflows as versioned, self-contained skills", "Tier 3: maintains and versions team skills as shared infrastructure"], "title": "Authoring AI Skills (SKILL.md)"}, "html": "<h1>Authoring AI Skills (SKILL.md)<\/h1>\n<blockquote>\n<p>Skills are the packaging format that turns personal workflows into organizational infrastructure. An AI-Fluent practitioner can take any proven prompt chain and package it as a SKILL.md that an AI assistant loads on-demand. This lesson builds your first real skill.<\/p>\n<\/blockquote>\n<h2>What a Skill Is<\/h2>\n<p>A skill is a named, versionable folder containing: a SKILL.md with YAML frontmatter (name, version, triggers, audience) and instructions (step-by-step workflow with prompts), plus optional supporting files (templates, examples, schemas). When an AI assistant loads a skill, it gains the ability to run that workflow reliably without the user re-explaining it.<\/p>\n<p>A skill is not a prompt card. A prompt card is for a person to copy. A skill is for a workflow to run the same way, every time, by the AI. The distinction matters because skills are consumed differently — they need to be self-contained, context-independent, and AI-parseable.<\/p>\n<h2>When a Workflow Deserves to Be a Skill<\/h2>\n<p>Package a workflow as a skill when: (1) it has been run at least 5 times with consistent results, (2) it produces an artifact that other people reuse, (3) it requires the same setup context every time (which can be encoded in the skill), and (4) a teammate with the same role could trigger it without knowing your specific product context. If any of these aren't true, the workflow isn't stable enough to package.<\/p>\n<h2>Skill Versioning and Maintenance<\/h2>\n<p>Skills must be versioned. When the underlying AI model changes, the product domain changes, or a new failure mode is discovered, the skill must be updated and the version bumped. A skill that hasn't been reviewed in 6 months is suspect. A skill library without an owner is a liability. The discipline is the same as maintaining any shared codebase: it's not done when it's written, it's done when it's maintained.<\/p>\n<h2>Assignment<\/h2>\n<p>Package one proven workflow from your prior assignments as a complete SKILL.md. The skill must be self-contained — a colleague with the same role and a different product should be able to trigger it and get useful output without asking you any questions.<\/p>\n<h3>Deliverables<\/h3>\n<ul>\n<li>skills/[skill-name]/SKILL.md: YAML frontmatter + step-by-step instructions + prompts<\/li>\n<li>At least 3 steps with embedded prompt templates using {{placeholders}}<\/li>\n<li>Frontmatter: name, version (1.0.0), triggers (2-3 example phrases), audience (roles)<\/li>\n<li>A test run log: what you prompted, what the skill produced, what you would improve in v1.1<\/li>\n<\/ul>"}, "C4": {"meta": {"id": "C4", "courseId": "fluent-chains", "tier": "fluent", "roleIds": ["pm", "coach", "engineer", "tl", "designer", "data", "leader"], "durationMin": 30, "creditHours": 1, "staircaseRung": 3, "buildsBehaviors": ["Tier 3: authors durable context files that make AI behavior consistent across the team", "Tier 3: runs a context review cadence to prevent context decay"], "libraryRefs": ["context-engineering", "context-file-architecture"], "title": "Durable AI Context: CLAUDE.md and soul.md"}, "html": "<h1>Durable AI Context: CLAUDE.md and soul.md<\/h1>\n<blockquote>\n<p>The most expensive AI sessions are the ones that start from zero. CLAUDE.md prevents this for project context. soul.md prevents this for team persona and values. Together, they are the two files that turn a generic AI assistant into a domain-aware, values-aligned team collaborator. This lesson authors both.<\/p>\n<\/blockquote>\n<h2>CLAUDE.md: The Project Memory File<\/h2>\n<p>A CLAUDE.md is the answer to the question: 'What should an AI know before doing any work in this project?' It contains the things you would tell a highly competent new engineer on their first day: what the project does, what decisions have already been made, what patterns the team uses, what the AI must not do, and where to find key artifacts.<\/p>\n<p>The test of a good CLAUDE.md: a senior engineer new to the project could get to first meaningful contribution in one day using only this file and the codebase. If it takes more, the file is incomplete.<\/p>\n<h2>soul.md: The Team's AI Persona<\/h2>\n<p>A soul.md defines how the AI collaborator should behave on this team: its communication style (formal or casual?), its values (prefer explicit tradeoffs over confident recommendations?), its constraints (never suggest deleting tests to pass CI), and its working agreements (always ask one clarifying question before generating long artifacts).<\/p>\n<p>Without a soul.md, AI behavior varies session to session and practitioner to practitioner — which makes AI outputs inconsistent and harder to review. With one, AI becomes a consistent team member with predictable behavior.<\/p>\n<h2>Context Hygiene<\/h2>\n<p>Context files are living documents. They decay as the project evolves. Establish a context review cadence: CLAUDE.md reviewed at the start of each quarter, soul.md reviewed at the start of each new team member's onboarding. The review question: 'Is there anything in this file that's no longer true, or anything true that's not in this file?' The answer tells you the maintenance cost of your context files — which is always cheaper than the cost of AI working from outdated context. (The evolution of context practice — and the placement and curation rules these files implement — is tracked in the Evolution Library: see the context-engineering entry.)<\/p>\n<h2>Assignment<\/h2>\n<p>Write a production-quality CLAUDE.md for your primary project and a soul.md for your team. Both must be specific enough that reading them takes less than 5 minutes and leaves no questions about how the AI should behave. Get one teammate to review them and document their feedback.<\/p>\n<h3>Deliverables<\/h3>\n<ul>\n<li>CLAUDE.md: project context, decisions made, patterns, constraints, key file locations<\/li>\n<li>.claude/soul.md: communication style, values, working agreements, 3 explicit constraints<\/li>\n<li>Teammate review: 2 things they would add, 2 things that were unclear, your revisions<\/li>\n<li>Context review schedule: when these files will be reviewed and by whom<\/li>\n<\/ul>"}, "C5": {"meta": {"id": "C5", "courseId": "fluent-chains", "tier": "fluent", "roleIds": ["tl", "engineer", "data", "leader", "coach"], "durationMin": 30, "creditHours": 1, "staircaseRung": 2, "buildsBehaviors": ["Tier 3: evaluates an AI-data proposal by question cadence, full cost, and failure modes — not by tool familiarity", "Tier 3: can state the case FOR the two architectures they didn't propose"], "libraryRefs": ["prompting-frameworks", "context-engineering", "token-economics", "shift-left-economics"], "rubric": [{"criterion": "Question-first framing", "emerging": "Compares tools by features", "working": "Scores options against the team's actual question census", "strong": "Census includes cadence, asker, and cost-of-wrong-answer per question"}, {"criterion": "Steel-manning", "emerging": "Own option praised, others strawmanned", "working": "Each option's legitimate best-fit case stated", "strong": "Each option scored by a question type it wins — including the two not chosen"}, {"criterion": "Full-cost honesty", "emerging": "License/compute costs only", "working": "Includes token economics and maintenance ownership", "strong": "All three cost terms plus failure modes (write-back risk, context exhaustion, egress) with sources"}], "title": "Where Should the Answers Live? (Three Teams, One Question)"}, "html": "<h1>Where Should the Answers Live? (Three Teams, One Question)<\/h1>\n<blockquote>\n<p>Three teams want AI-powered reporting from the same data. One says \"just give everyone a chatbot connected to the source system.\" One says \"build a data lake and let AI write the queries.\" One says \"stand up a central operational data store and put AI on top.\" All three are right — about different questions. This lesson teaches the comparison pattern that turns an unwinnable architecture argument into a decision.<\/p>\n<\/blockquote>\n<h2>Start Here: The Question Census (5 minutes)<\/h2>\n<p>Before any architecture talk, take a census. Write down the last five reporting questions your team actually asked of your work-tracking data. For each one, note three things in plain words:<\/p>\n<ol>\n<li><strong>Cadence<\/strong> — was it asked once, weekly, or continuously?<\/li>\n<li><strong>Asker<\/strong> — a person exploring, an analyst scanning history, or a product surface that displays the answer automatically?<\/li>\n<li><strong>Cost of wrong<\/strong> — what happened (or would happen) if the answer was wrong?<\/li>\n<\/ol>\n<p>Keep the census. It is the input to everything that follows — and here's the punchline in advance: when three teams argue past each other about architecture, it's almost always because they each did this census silently, on different questions, and don't know it.<\/p>\n<h2>Three Teams, Three Answers<\/h2>\n<p>Each answer below is presented the way its own team would present it — best case first. Your job in this section is not to pick a winner. It's to be able to argue <em>for<\/em> each one. (In a cohort, these are three separate sittings: one team's world at a time.)<\/p>\n<h3>Team One: Chat With Your Data<\/h3>\n<p>Connect the AI assistant directly to the source system and let everyone ask their own questions. The case for it is real: fastest possible adoption, zero infrastructure to build, no waiting on a platform team, and every person gets answers in their own words on day one. For occasional, low-stakes, personal questions — \"summarize what my team shipped this sprint\" — this is the <em>correct<\/em> architecture, and heavier options are over-engineering.<\/p>\n<p>What its advocates undercount: every user pays the machinery cost on every question. Connecting an AI to a rich enterprise tool means loading the tool's entire vocabulary into the AI's working memory before the first question — an input tax that can consume most of the AI's attention before any work happens — and raw responses from enterprise APIs arrive bloated with metadata the question never needed. Worse, letting the AI <em>write back<\/em> to the source system crosses a risk boundary: round-tripping rich content through the AI's plain-text world can silently destroy formatting, with no error raised. The patterns and current numbers behind all of this live in the Evolution Library (see the token-economics and context-engineering entries); the durable lesson is that per-person convenience has a per-question price, and it compounds with cadence.<\/p>\n<h3>Team Two: The Lakehouse<\/h3>\n<p>Land the raw data in cheap object storage, project a schema over it, and let the AI translate plain-language questions into SQL that a serverless engine executes. The case for it is real: it's built for scanning the world — years of history, millions of records, questions nobody predicted. Storage is nearly free, you pay per scan, and smart storage formatting cuts scan costs by orders of magnitude. For analyst-shaped work — \"how has cycle time trended across all projects since 2022?\" — this architecture wins outright, and a chat tool pointed at the live system simply cannot do the job.<\/p>\n<p>What its advocates undercount: the audience. AI-generated SQL is production-viable but not infallible — it needs schema access, semantic help, and an error-recovery loop, which means it needs an owner. The architecture is shaped like its builder: an analyst who scans history. The PM who needs the same three numbers every Monday morning, delivered to a dashboard without asking, is not the user this system was designed for — and retrofitting that cadence onto per-scan pricing has its own bill.<\/p>\n<h3>Team Three: The Operational Data Store<\/h3>\n<p>Stand up one governed database that holds the operational data in query-ready form — relational tables for the structured facts, flexible document storage for the messy custom fields, semantic search for the unstructured text — and point both AI and dashboards at it. The case for it is real: continuous questions get continuous answers, product surfaces get a stable contract to display, one store gets governed once (access, compliance, retention), and it can align with where the organization's data platform is already heading. For product operational reporting — answers that appear on screens without anyone asking — this is the architecture the other two eventually grow into.<\/p>\n<p>What its advocates undercount: it's the biggest commitment on the table. Someone must own the pipeline, the schema, the sync from source systems, and the platform bill — before the first user sees value. It is the right third step taken confidently; taken as a first step by a team without platform ownership, it's an expensive way to discover that.<\/p>\n<h2>The Six Questions<\/h2>\n<p>The census resolves the argument, because architecture follows questions. Score every option against these six — this is the whole pattern:<\/p>\n<ol>\n<li><strong>What cadence are the questions?<\/strong> Once → chat. Exploratory-over-history → lakehouse. Continuous → data store. (This is A4's two-question test at enterprise scale.)<\/li>\n<li><strong>Who asks?<\/strong> A person → chat. An analyst → lakehouse. A product surface → data store.<\/li>\n<li><strong>What does a wrong answer cost?<\/strong> Personal drafts tolerate errors; a dashboard executives read does not. Stakes set the review and governance burden (the cost curve behind this question lives in the shift-left-economics Evolution Library entry).<\/li>\n<li><strong>Who maintains it when the model or API updates?<\/strong> A name, not a team. An architecture nobody owns decays into confidently wrong answers.<\/li>\n<li><strong>What breaks, and who notices?<\/strong> Every option fails differently: silent formatting corruption, a mis-joined query, a stale pipeline. Name the failure and its detector before choosing.<\/li>\n<li><strong>Where is the org already going?<\/strong> Platform direction is a legitimate scoring question, not a bias. An option aligned with the data platform's roadmap inherits support; an option fighting it inherits friction.<\/li>\n<\/ol>\n<p>Questions 4 and 5 are the leader track's ownership questions (D5); questions 1–3 are your question census, formalized. Notice what the pattern does to the three teams: it stops asking \"which is right?\" and starts asking \"which questions does each one win?\" — and suddenly there are answerable sub-decisions instead of one unwinnable fight. Most real organizations end up running two of the three on purpose. The failure mode is running all three by accident.<\/p>\n<h2>Assignment<\/h2>\n<p>Run the pattern on your real situation. Take your question census from the opening (grow it to at least five real questions if needed). Score all three architectures against the six questions. Write a one-page decision memo.<\/p>\n<h3>Deliverables<\/h3>\n<ul>\n<li>architecture-decision-memo-[topic].md: one page<\/li>\n<li>The question census: 5+ real questions with cadence, asker, and cost-of-wrong for each<\/li>\n<li>The six-question scoring table: three options × six questions<\/li>\n<li>A recommendation, the strongest objection to it stated fairly, and — for each option you did NOT choose — the question type it would still win<\/li>\n<\/ul>"}, "C6": {"meta": {"id": "C6", "courseId": "tooling-misconceptions", "tier": "fluent", "roleIds": ["coach", "tl", "engineer", "pm"], "durationMin": 25, "creditHours": 1, "staircaseRung": 3, "buildsBehaviors": ["Tier 3: verifies a skill actually loads (description + discoverability) instead of assuming a file in the folder works", "Tier 3: writes skill descriptions as trigger conditions, and diagnoses load → description → body in order before blaming the model"], "libraryRefs": ["agent-skills-format"], "rubric": [{"criterion": "Description as trigger", "emerging": "States what the skill is (\"a tool for X\")", "working": "States when to use it (\"use when the user wants to …\")", "strong": "States when, and declares negative scope (\"do NOT use for …\"), so it discriminates against the sibling skills in the same folder"}, {"criterion": "Discoverability checked", "emerging": "Didn't check whether the skill loads or where it lives", "working": "Confirmed the file is named and placed so it can be discovered (<name>/SKILL.md)", "strong": "Confirmed discoverable and produced evidence — a linter run, or a by-hand ranking of the description against its siblings"}, {"criterion": "Diagnosis order", "emerging": "Rewrote the body first", "working": "Checked the description before the body", "strong": "Checked load → description → body in order and can name what each step ruled out"}], "title": "Did Your Skill Even Load?"}, "html": "<h1>Did Your Skill Even Load?<\/h1>\n<blockquote>\n<p>Two coaches keep a team skill library. One keeps adding skills; half of them never fire, and the team has quietly concluded \"the AI can't do that.\" The other keeps three, and they fire every time. Same tools, opposite results. The difference isn't the model — it's whether anyone checked that the skills load. You already know how to <em>write<\/em> a skill. Today you check whether the agent can <em>find and pick<\/em> it, which is a different question with a much quieter failure.<\/p>\n<\/blockquote>\n<h2>Start Here: Read the Description, Cover the Body (5 minutes)<\/h2>\n<p>Open one skill you wrote. Cover the body — everything under the frontmatter. Read only the <code>description<\/code>.<\/p>\n<p>Now answer honestly: for the request this skill is meant to serve, would an agent pick it over the other skills in the same folder, on that one sentence alone?<\/p>\n<p>That is not a rhetorical exercise. It is exactly the decision the agent makes. When a skill is installed, the agent pre-loads only its name and description; it does not read the body until <em>after<\/em> it has already decided the skill is relevant — and it makes that decision on the description. (The current mechanics of selection and discovery live in the <em>Agent Skills<\/em> evolution entry, because they move; the habit you're building here does not.)<\/p>\n<p>So the description isn't a summary of the skill. It <em>is<\/em> the skill, as far as getting chosen goes.<\/p>\n<h2>The Description Is the Trigger, Not a Summary (6 minutes)<\/h2>\n<p>Most descriptions that fail are written as <strong>identity<\/strong>: \"A tool for working with spreadsheets.\" It reads fine. It also cannot be selected, because it doesn't say <em>when<\/em> to reach for it, and \"when\" is the only thing the agent is matching against. Against five other skills that all mention spreadsheets, it discriminates against nothing.<\/p>\n<p>Rewrite it as a <strong>trigger<\/strong> — a condition: \"Use when the user wants to clean, edit, or chart data in an .xlsx or .csv file.\" Better still, add <strong>negative scope<\/strong>: \"Do NOT use for scanning image-only PDFs.\" Negative scope is a strong signal precisely because it keeps the skill from being grabbed for an adjacent job that belongs to a sibling.<\/p>\n<p>Here is the trap worth naming, because it wastes the most time. When a skill underperforms, the instinct is to open it and improve the body — add detail, add examples, add emphasis. But if the description never wins selection, <strong>the body is never read<\/strong>, and none of that work is ever seen by anything. You are tuning a file the agent never opened.<\/p>\n<h2>The Failure You Can't See (6 minutes)<\/h2>\n<p>There's a worse version, and it has nothing to do with wording. A skill can be perfectly written and still never load because it's in the wrong shape or the wrong place — a flat file where a directory was expected, or a filename the agent doesn't scan for.<\/p>\n<p>I ran a linter over a real skills directory recently. Four skills; three of them weren't loading — not because their descriptions were weak, but because they'd been saved as flat files instead of in the folder-and-file shape the format requires. Discovered by nothing. Loaded as nothing. Reported nothing. From the outside the directory looked like a working library. Most of it was empty.<\/p>\n<p>Notice the shape of every failure in this lesson: <strong>nothing errors.<\/strong> No red text, no warning. The skill just isn't there, which from the outside is indistinguishable from the model being bad at the task. That silence is the entire problem — and it's why the fix is not \"try harder,\" it's \"add a check.\"<\/p>\n<h2>Make It Loud (6 minutes)<\/h2>\n<p>You cannot catch a silent failure by being more careful, any more than you can hear an engine that isn't running. You need an instrument. A read-only linter for skills does for a skill library what a linter does for code: it surfaces the thing you'd never notice by rereading your own work — a description written as identity, two skills whose descriptions collide, a file that will never be discovered.<\/p>\n<p>Run it on your folder before you conclude anything about the model. And build the ordering into how you work, because the order is the whole skill:<\/p>\n<p><strong>What did you check, and in what order?<\/strong> Load → description → body. Did the skill load at all? If yes, does its description win selection for the request? Only then does the body matter. Nine times out of ten the first link — did it even load? — was never examined, and the model, the last thing that could be wrong, gets blamed first.<\/p>\n<h2>Assignment<\/h2>\n<p>Audit one real skill from a library you own, and make its status verifiable rather than assumed.<\/p>\n<h3>Deliverables<\/h3>\n<ul>\n<li><code>skill-audit.md<\/code> covering one skill, with:<\/li>\n<li>the <strong>before/after description<\/strong> — the identity version you started with, and the trigger version you rewrote (with negative scope if it earns one)<\/li>\n<li>a <strong>discoverability line<\/strong> — confirm the skill is in the shape and place the agent actually scans, and say how you confirmed it<\/li>\n<li><strong>evidence it loads<\/strong> — a linter run pasted in, or, if you have no linter handy, a by-hand ranking of your description against the other skills in the folder for the request it should win<\/li>\n<li>One line naming a failure your check would still miss, and who or what you'd escalate it to<\/li>\n<\/ul>"}, "C7": {"meta": {"id": "C7", "courseId": "tooling-misconceptions", "tier": "fluent", "roleIds": ["coach", "tl", "pm", "engineer"], "durationMin": 25, "creditHours": 1, "staircaseRung": 3, "buildsBehaviors": ["Tier 3: classifies each team skill as BINDING or ADVISORY and can state the mechanical check that evidences a binding one", "Tier 3: distinguishes shaping output (governance) from claiming a control without evidence it operated"], "libraryRefs": ["agent-skills-format"], "rubric": [{"criterion": "Binding vs advisory, labeled", "emerging": "Skills unlabeled; \"it's written in the skill\" is treated as a control", "working": "Each skill is labeled BINDING or ADVISORY", "strong": "The label matches reality — every BINDING skill has a mechanical check; the advisory ones make no control claim"}, {"criterion": "Evidence it operated", "emerging": "Points to the skill's text as proof", "working": "Names the check that would fail the artifact", "strong": "Produces what the check emits — a log line, a rejected item — sampleable evidence, not documentation"}, {"criterion": "The line is drawn in the right place", "emerging": "Tries to make a judgment call binding", "working": "Binds structure, leaves semantics advisory", "strong": "Can name a case where forcing a binding check would manufacture false confidence"}], "title": "It's In the Skill. Is It a Control?"}, "html": "<h1>It's In the Skill. Is It a Control?<\/h1>\n<blockquote>\n<p>A coach ships a skill that tells the model to \"always include a control-ID column.\" Months later, audit season: can you prove that happened on every artifact? \"The skill says to\" is not evidence. Two teams run the same library — one can produce the log of what the check rejected, the other can only produce the skill file. Same instruction, and only one of them has a control. This lesson is about which one you are, and how to choose it on purpose.<\/p>\n<\/blockquote>\n<h2>Start Here: Why Does Your Best Skill Exist? (5 minutes)<\/h2>\n<p>Pick the skill your team relies on most. Write one sentence: <em>why does this skill exist?<\/em><\/p>\n<p>If the answer is \"to make the model better at the task,\" notice that the ground is shifting under it. On a strong model, \"make it smarter\" is a weak and shrinking justification — the model is often already competent. The answer that holds up is different: the skill exists so that twenty people doing the same job produce the <em>same shape<\/em> of output, every time. That is not capability. That is governance, and it is the durable reason to own a skill library at all.<\/p>\n<h2>Governance, Not Capability (6 minutes)<\/h2>\n<p>Here is the reframe worth internalizing, because it inverts the usual pitch. A stronger model makes governance skills <em>more<\/em> valuable, not less. Undertrained models fail visibly — the output is obviously wrong and review catches it. Strong models produce competent-looking <em>variation<\/em>, and plausible variation is far harder to catch in review than bad output. Twenty people prompting twenty different ways, each getting something reasonable-but-different, is precisely the problem a control exists to prevent.<\/p>\n<p>That also changes the measure of success. The question is not \"did this task go well.\" It is: <em>how much variation did this remove across everyone who does the job?<\/em> Dispersion reduction is measurable in a way \"helpfulness\" is not.<\/p>\n<h2>Written Is Not Operated (6 minutes)<\/h2>\n<p>Now the most expensive misconception, because it produces the <em>appearance<\/em> of a control without the substance: believing that writing something into a skill makes it a control.<\/p>\n<p>It does not. A control is something you can demonstrate <em>operated<\/em> — not something you can show was <em>documented<\/em>. \"The skill instructed the model to include a control-ID column\" is not sampleable. \"The validator rejected four artifacts for missing control IDs, and here is the log\" is. If you have ever worked under an audit, you know the difference is the whole game: evidence of operation, not evidence of intent.<\/p>\n<h2>BINDING vs ADVISORY (6 minutes)<\/h2>\n<p>So label every skill as one of two kinds, explicitly, in the skill itself.<\/p>\n<p><strong>BINDING<\/strong> — scripted, enforceable, and citable as a control. It has a deterministic check (bundled or downstream) that <em>fails the artifact<\/em> when violated. It has an owner, a version, and a review date, because it is a controlled document. (Skills can carry executable code, not just prose — the current mechanics of that live in the Agent Skills library entry.)<\/p>\n<p><strong>ADVISORY<\/strong> — prose that shapes output but is explicitly <em>not<\/em> claimed as a control. This is where judgment lives.<\/p>\n<p>Draw the line in one place: <strong>structure is mechanically checkable; semantics are not.<\/strong> Column presence, an ID format, every risk having at least one mapped control — that is a schema check, maybe thirty lines of code, and it should be binding. Whether the identified risk is the <em>right<\/em> risk, whether the control genuinely addresses it — that stays advisory, because a binding check on a judgment call manufactures false confidence. Mixing the two tiers without labels is how a team ends up claiming a control it cannot evidence.<\/p>\n<h2>Assignment<\/h2>\n<p>Take a real skill library you own and make its control claims honest.<\/p>\n<h3>Deliverables<\/h3>\n<ul>\n<li><code>skill-control-register.md<\/code> listing each skill labeled <strong>BINDING<\/strong> or <strong>ADVISORY<\/strong><\/li>\n<li>For one BINDING skill: its <strong>owner, version, review date<\/strong>, and the <strong>mechanical check<\/strong> that fails the artifact when the skill is violated (name the check; if it doesn't exist yet, that's your finding)<\/li>\n<li>One line: a check you deliberately left <strong>ADVISORY<\/strong>, and why binding it would create false confidence<\/li>\n<\/ul>"}, "C8": {"meta": {"id": "C8", "courseId": "tooling-misconceptions", "tier": "fluent", "roleIds": ["pm", "coach", "tl"], "durationMin": 25, "creditHours": 1, "staircaseRung": 3, "buildsBehaviors": ["Tier 3: tags each requirement by evidence tier (stated / inferred / assumed) and surfaces the coverage gap instead of letting a document's format confer unearned authority", "Tier 3: can name when a document's format has outrun its source"], "rubric": [{"criterion": "Every requirement carries a tier", "emerging": "Requirements stated with no provenance", "working": "Each requirement tagged stated / inferred / assumed", "strong": "Stated-tier items resolve to a real source item; inferred ones show the reasoning"}, {"criterion": "Coverage is disclosed", "emerging": "No coverage block", "working": "States what the source asked, what it didn't, the sample size and population", "strong": "The gap is surfaced as a finding on page one, not buried"}, {"criterion": "Format vs. source", "emerging": "Lets the document format carry the authority", "working": "Notes where the source cannot support a requirement", "strong": "Can state the one sentence that would have stopped the laundering"}], "title": "When the Format Outruns the Source"}, "html": "<h1>When the Format Outruns the Source<\/h1>\n<blockquote>\n<p>A customer sentiment survey becomes a \"Voice of the Client\" summary. The summary becomes a PRD. A PM asks the model to turn it into requirements, and it obliges — headers, numbered requirements, acceptance criteria, the works. By the time the document circulates, nobody remembers that the source was forty free-text comments from an instrument that never asked anyone what they needed. The format now asserts things the source was never able to support. That is laundering, and a good template makes it worse, not better.<\/p>\n<\/blockquote>\n<h2>Start Here: Where Would This Requirement Have Come From? (5 minutes)<\/h2>\n<p>Take one requirement from a real document you have on hand. Ask the question you already know from checking any AI output: <em>where would this have come from?<\/em> Point to the specific source item — the survey question, the interview line, the ticket — that supports it.<\/p>\n<p>Often you can't. The requirement reads as settled fact because it is sitting in a requirements document, but trace it back and there is nothing underneath. Hold onto that gap; the rest of the lesson is about making it visible before it ships.<\/p>\n<h2>Format Confers Authority (6 minutes)<\/h2>\n<p>Here is the mechanism. Sentiment tells you how people feel about what already exists. A PRD asserts what to build. Those are different claims, and the first cannot support the second — but the <em>format<\/em> of a PRD confers authority regardless of what fed it. Numbered requirements look decided. Acceptance criteria look validated.<\/p>\n<p>Three things make this worse, not better, in an AI workflow. Chaining two tools together does not fix it — a laundered input produces a laundered output with more polish. A stronger model makes it <em>worse<\/em>, because the unsupported requirement reads more convincingly. And a prose instruction to \"ground requirements in the research\" is unevidenceable — it is the written-not-operated trap from the previous lesson, wearing a PRD.<\/p>\n<h2>Requirement-Level Provenance (6 minutes)<\/h2>\n<p>The fix is a binding control, and it is small. Every requirement carries an evidence field with a tier:<\/p>\n<ul>\n<li><strong>stated<\/strong> — traceable to a specific source item (a question ID, a quote, a ticket)<\/li>\n<li><strong>inferred<\/strong> — analyst reasoning from a stated signal, with the reasoning shown<\/li>\n<li><strong>assumed<\/strong> — no source basis<\/li>\n<\/ul>\n<p>The check is mechanical: the field exists on every requirement, the stated-tier items resolve to real source items, and the tier mix is disclosed on page one. Whether an <em>inference<\/em> is a good one stays advisory — that is judgment, and you don't bind judgment. But \"seven of nineteen requirements have no source basis\" is a fact you can print, and it is exactly the fact that disappears when the format is left to carry the authority.<\/p>\n<h2>The Coverage Block (5 minutes)<\/h2>\n<p>One more structural requirement, because provenance per requirement isn't enough on its own. Attach a coverage block to the document: what the instrument asked, what it did not ask, the sample size, and the population. Require it to propagate into anything built downstream.<\/p>\n<p>This reframes the instrument's gap as a <em>finding<\/em> rather than an embarrassment to smooth over. It is what stops a sentiment pass from being mistaken for the discovery that never actually happened — and it is the difference between a document that knows its own limits and one that quietly forgets them.<\/p>\n<h2>Assignment<\/h2>\n<p>Take a real requirements or PRD section and make its evidence honest.<\/p>\n<h3>Deliverables<\/h3>\n<ul>\n<li><code>provenance-check.md<\/code> covering one requirements section, with each requirement tagged <strong>stated / inferred / assumed<\/strong> — the stated ones pointing at the specific source item<\/li>\n<li>A <strong>coverage block<\/strong>: what the source asked, what it didn't, the sample size, the population<\/li>\n<li>One line naming the tier mix out loud (for example, \"X of Y requirements have no source basis\") — the sentence that keeps the format from outrunning the source<\/li>\n<\/ul>"}, "D1": {"meta": {"id": "D1", "courseId": "native-systems", "tier": "native", "roleIds": ["tl", "leader", "coach"], "durationMin": 30, "creditHours": 1, "staircaseRung": 3, "buildsBehaviors": ["Tier 4: designs the eval pipeline before the prompt", "Tier 4: specifies bounded, auditable agentic workflows with failure protocols"], "libraryRefs": ["structured-outputs", "evaluation-practice", "agent-orchestration"], "title": "AI System Architecture"}, "html": "<h1>AI System Architecture<\/h1>\n<blockquote>\n<p>AI-Native practitioners don't use AI — they architect it into systems. This lesson covers the design principles for AI-first product systems: evaluation pipelines, agentic workflow design, and the governance structures that make AI production-safe at scale.<\/p>\n<\/blockquote>\n<h2>Evaluation-First Design<\/h2>\n<p>Any AI capability that ships to production needs an evaluation pipeline before it ships. An eval pipeline answers: does this AI behavior meet the quality bar, consistently, across the range of inputs the system will encounter? The eval design comes before the prompt design — define what 'good' looks like, build the eval, then iterate prompts until the eval passes.<\/p>\n<p>Teams that skip eval design ship AI capabilities that work on demos and break in production. Teams that build evals first discover failure modes before users do. (Current harness practice — calibrated judges, sampled production scoring, drift monitoring — is tracked in the evaluation-practice Evolution Library entry.)<\/p>\n<h2>Agentic Workflow Design Patterns<\/h2>\n<p>Production-grade agentic workflows are designed with: a bounded scope (the agent knows exactly what it is and isn't allowed to do), a tool inventory (explicit list of tools the agent can call, with input/output contracts — schema-enforced; see the structured-outputs Evolution Library entry), a failure protocol (what the agent does when it can't complete a task — it never silently fails), and an audit log (every action the agent takes is logged with rationale). Agentic workflows without these properties are not production-ready. (Topology guidance — when one agent beats many, and what each added agent must justify — is tracked in the agent-orchestration Evolution Library entry.)<\/p>\n<h2>Organizational AI Governance<\/h2>\n<p>At the AI-Native level, governance is a system design problem: who approves new AI capabilities before they're deployed? Who owns the eval pipelines? Who is alerted when a model update changes behavior? What's the rollback procedure when an AI workflow degrades? These questions have engineering answers — not just policy answers. AI-Native organizations have the infrastructure to answer them operationally, not just in documentation.<\/p>\n<h2>Assignment<\/h2>\n<p>Design the architecture for one AI capability your team wants to ship to production. Include the eval pipeline design, the agentic workflow design (if applicable), and the governance structure. This document should be reviewable by a principal engineer or VP of Engineering.<\/p>\n<h3>Deliverables<\/h3>\n<ul>\n<li>ai-system-design-[capability].md: capability description, eval pipeline, governance structure<\/li>\n<li>Eval pipeline: at least 3 test categories with success criteria and failure thresholds<\/li>\n<li>Agentic workflow (if applicable): scope, tool inventory, failure protocol, audit log spec<\/li>\n<li>Governance: approval process, owner, rollback procedure, review cadence<\/li>\n<\/ul>"}, "D2": {"meta": {"id": "D2", "courseId": "native-systems", "tier": "native", "roleIds": ["leader", "coach", "tl"], "durationMin": 30, "creditHours": 1, "staircaseRung": 3, "buildsBehaviors": ["Tier 4: treats org AI maturity as a measurable business capability", "Tier 4: designs incentive and infrastructure systems that raise team fluency"], "title": "Org-Wide AI Maturity Strategy"}, "html": "<h1>Org-Wide AI Maturity Strategy<\/h1>\n<blockquote>\n<p>AI-Native leaders don't just use AI well — they raise the AI fluency of everyone around them. This lesson builds the organizational strategy for moving a team from AI-Aware to AI-Fluent at scale: metrics, incentive structures, and the learning infrastructure that makes progress visible.<\/p>\n<\/blockquote>\n<h2>Maturity as a Business Metric<\/h2>\n<p>AI maturity is a lagging indicator of business outcomes. The leading indicators are: what percentage of the team has submitted assignments at each tier? What is the average time to tier promotion? What AI-assisted workflows have been certified team-standard? Tracking these at the org level turns AI upskilling from a training program into a business capability investment with measurable ROI.<\/p>\n<h2>The Infrastructure of Learning<\/h2>\n<p>Teams that advance AI maturity fastest share three infrastructure components: a shared skill library (a repository of team-certified AI workflows anyone can use), a prompt quality review process (someone reviews AI-generated outputs before they become canonical), and a context file standard (every project has a CLAUDE.md, maintained, reviewed quarterly). These are engineering infrastructure problems, not training problems.<\/p>\n<h2>Incentive Design<\/h2>\n<p>Behavior follows incentives. If AI maturity has no connection to performance reviews, hiring criteria, or team recognition, it won't advance beyond the early adopters. AI-Native organizations make maturity tier visible in team dashboards, link tier progression to continuing education credit requirements, and include AI workflow contribution in engineering promotion criteria. The signal: this isn't optional.<\/p>\n<h2>Assignment<\/h2>\n<p>Write an AI maturity strategy for your org or team. Include: the current maturity baseline (by role), the 6-month target state, the three infrastructure investments required, and the metrics you'll use to track progress. This is an executive-level document.<\/p>\n<h3>Deliverables<\/h3>\n<ul>\n<li>ai-maturity-strategy-[team].md: baseline, target, investments, metrics<\/li>\n<li>Baseline: current tier distribution by role (use real data or honest estimates)<\/li>\n<li>Target state: specific tier goals per role at 3-month and 6-month marks<\/li>\n<li>3 infrastructure investments: what, owner, timeline, success criteria<\/li>\n<li>Dashboard spec: 5 metrics, measurement method, reporting cadence<\/li>\n<\/ul>"}, "D3": {"meta": {"id": "D3", "courseId": "native-systems", "tier": "native", "roleIds": ["tl", "leader", "coach"], "durationMin": 30, "creditHours": 1, "staircaseRung": 3, "buildsBehaviors": ["Tier 4: designs skill-library governance with owners, review, and health metrics", "Tier 4: measures library value by reuse, not existence"], "title": "AI Skill Library Design"}, "html": "<h1>AI Skill Library Design<\/h1>\n<blockquote>\n<p>A skill library is organizational memory for AI workflows. This lesson designs the governance, taxonomy, and maintenance system for a team-wide skill library that scales beyond individual contributors.<\/p>\n<\/blockquote>\n<h2>Library Architecture<\/h2>\n<p>A scalable skill library has: a taxonomy (skills organized by role, tier, and workflow type), a quality bar (skills must pass a review before entering the library), a versioning system (skills are versioned and changelogs maintained), and an owner model (every skill has a named owner who is responsible for maintenance). A library without an owner model collapses — skills become stale, no one updates them, and the library becomes a source of bad outputs rather than good ones.<\/p>\n<h2>The Skill Review Process<\/h2>\n<p>Skills enter the library through a review: the skill must have been run at least 5 times with documented results, the outputs must have been validated by a domain expert, the skill's failure modes must be documented, and the skill must pass a 'handoff test' (a new user can trigger it without asking the author questions). Skills that fail review are returned with specific feedback — not rejected outright.<\/p>\n<h2>Measuring Library Value<\/h2>\n<p>Library value is measured by: number of skill runs per month (usage), number of unique users (breadth), time saved per run vs. manual process (ROI), number of skills that have been updated (maintenance health), and number of skills deprecated after model updates (adaptability). A library with high usage but no maintenance is a technical debt liability. A library with zero usage is a vanity project.<\/p>\n<h2>Assignment<\/h2>\n<p>Design the governance and taxonomy for your team's AI skill library. Define the review process, the owner model, and the success metrics. Package at least one skill from your prior assignments that meets the library quality bar.<\/p>\n<h3>Deliverables<\/h3>\n<ul>\n<li>skill-library-design.md: taxonomy, quality bar, review process, owner model, metrics<\/li>\n<li>Review checklist: the 5-point rubric used to evaluate skills for library admission<\/li>\n<li>One production-quality skill package (from C3 or equivalent) with review notes applied<\/li>\n<li>Library health dashboard spec: 5 metrics with measurement method<\/li>\n<\/ul>"}, "D4": {"meta": {"id": "D4", "courseId": "native-systems", "tier": "native", "roleIds": ["leader", "tl", "coach"], "durationMin": 30, "creditHours": 1, "staircaseRung": 3, "buildsBehaviors": ["Tier 4: embeds AI into the team operating rhythm with graceful failure design", "Tier 4: sets AI maturity expectations in hiring and onboarding"], "title": "AI-Native Team Operating Model"}, "html": "<h1>AI-Native Team Operating Model<\/h1>\n<blockquote>\n<p>The final lesson in the AI-Native track defines what it means to operate as an AI-native team — not just have AI tools available, but have AI embedded into every workflow, every decision process, and every hire. This is the operating model design, not the tool selection.<\/p>\n<\/blockquote>\n<h2>AI in the Team Operating Rhythm<\/h2>\n<p>An AI-native team has AI integrated at every cadence: in sprint planning (AI-assisted story refinement, AC generation), in code review (AI pre-review before human review), in incident response (AI-drafted postmortems within 2 hours), in retrospectives (AI-synthesized team health from the sprint's communication patterns), and in documentation (AI-maintained, human-reviewed). The key word is 'integrated' — AI is a step in the process, not an optional add-on.<\/p>\n<h2>AI in Hiring and Onboarding<\/h2>\n<p>AI-native organizations signal their expectations in hiring: job descriptions reference required AI maturity tier, technical screens include an AI workflow exercise, and onboarding has a 30-day AI-Enabled certification requirement. Existing team members who haven't reached AI-Enabled tier have a structured plan to get there. AI maturity is a professional expectation, not a personal hobby.<\/p>\n<h2>What AI-Native Is Not<\/h2>\n<p>AI-native is not: using AI for every task, replacing human judgment with AI output, or having the most advanced tools. It is: knowing when AI adds value and when it doesn't, having the infrastructure to use AI reliably at scale, and designing systems where AI failure degrades gracefully rather than catastrophically. The measure of an AI-native team is not how much AI it uses — it's how rarely AI mistakes reach production.<\/p>\n<h2>Assignment<\/h2>\n<p>Write the operating model for an AI-native version of your team. Define: the AI-integrated sprint ceremonies, the hiring and onboarding AI requirements, the failure mode protocols, and the quarterly AI infrastructure review. This is a real operational document — not a vision statement.<\/p>\n<h3>Deliverables<\/h3>\n<ul>\n<li>ai-native-operating-model.md: ceremonies, hiring, onboarding, failure protocols, review cadence<\/li>\n<li>Sprint ceremony design: how AI is integrated at each ceremony (planning, review, retro)<\/li>\n<li>Hiring criteria: AI maturity requirement per role level (junior, mid, senior, staff)<\/li>\n<li>Onboarding plan: 30-day AI certification path for new hires<\/li>\n<li>Failure protocol: what happens when an AI workflow produces a bad output in production<\/li>\n<\/ul>"}, "D5": {"meta": {"id": "D5", "courseId": "leader-literacy", "tier": "native", "roleIds": ["leader"], "durationMin": 25, "creditHours": 1, "staircaseRung": 2, "buildsBehaviors": ["Tier 4 literacy: funds AI workflows, not AI tools — every investment names the workflow it changes", "Tier 4 literacy: asks the three ownership questions before approving any AI spend"], "rubric": [{"criterion": "Workflow specificity", "emerging": "Investment described as a tool purchase ('we need Copilot licenses')", "working": "Names the workflow the investment changes and who runs it today", "strong": "Names the workflow, its measured current cost, and the artifact that will prove the change"}, {"criterion": "Full-cost honesty", "emerging": "Only license/subscription cost appears", "working": "Includes token/usage cost estimate", "strong": "Includes all three ROI terms: time saved, usage cost, and maintenance ownership"}, {"criterion": "Decision clarity", "emerging": "One-pager informs but asks for nothing specific", "working": "Asks for a specific approve/reject decision", "strong": "Asks for a decision with explicit success criteria and a review date"}], "libraryRefs": ["shift-left-economics"], "title": "Funding AI: The Investment One-Pager"}, "html": "<h1>Funding AI: The Investment One-Pager<\/h1>\n<blockquote>\n<p>This track is Tier 4 <em>literacy<\/em>, not the architect track (D1–D4). You will not design a system in these three lessons. You will learn to fund, govern, and measure the people who do — which is your actual job in the maturity strategy. This lesson: funding.<\/p>\n<\/blockquote>\n<h2>Start Here: What Are You Already Paying For? (5 minutes)<\/h2>\n<p>Write down every AI line item your org currently pays for — licenses, subscriptions, API budgets, tool seats. Next to each, answer one question in plain words: <strong>what specific workflow changed because of it?<\/strong> Not \"people use it for lots of things\" — a named workflow, with a named owner, that runs differently than it did before the spend.<\/p>\n<p>For most leaders, several line items have no answer. That's the problem this lesson exists to fix, and it's a funding-discipline problem, not a technology problem.<\/p>\n<h2>Fund Workflows, Not Tools<\/h2>\n<p>A tool purchase is not an AI investment; it's a precondition for one. The unit of investment is a <strong>workflow<\/strong>: a named, repeatable piece of work that will run differently — faster, cheaper, better-evidenced — with AI in the loop. Your Tier 3 practitioners already work this way (their certification requires ROI math on real workflows); the funding process should speak the same language.<\/p>\n<p>The full cost of an AI workflow has three terms, and most proposals show you only one: <strong>time saved<\/strong> (the benefit), <strong>usage cost<\/strong> (tokens are metered — cost scales with use, unlike a license), and <strong>maintenance<\/strong> (prompts, context files, and skills decay as models change; someone must own the updates). A workflow that saves hours but has no maintenance owner is a liability wearing a benefit's clothes — approve it and you'll fund its slow decay into a source of confidently wrong output.<\/p>\n<h2>The Three Ownership Questions<\/h2>\n<p>You don't need to read a schema or understand constrained decoding. Your literacy is knowing which questions expose an unfunded liability:<\/p>\n<ol>\n<li><strong>\"Who maintains this when the model updates?\"<\/strong> — a name, not a team.<\/li>\n<li><strong>\"What does it cost per run?\"<\/strong> — an estimate is fine; a blank stare is a red flag.<\/li>\n<li><strong>\"What breaks, and who notices?\"<\/strong> — every AI workflow fails sometimes; funded workflows have someone who notices before customers do.<\/li>\n<\/ol>\n<p>If a proposal can't answer all three, it isn't ready for money. Send it back with the questions — that act alone raises your org's maturity.<\/p>\n<h2>The One-Pager Format<\/h2>\n<p>One page, five blocks: <strong>the workflow<\/strong> (what runs differently, who runs it), <strong>current cost<\/strong> (how the work happens today — measured or honestly estimated, never invented), <strong>proposed change<\/strong> (the AI-assisted form and the artifact that proves it works), <strong>full cost<\/strong> (all three terms), and <strong>the decision<\/strong> (what you're asking for, the success criteria, and the review date). If it doesn't fit on a page, the proposal doesn't understand itself yet. (Why the review of this page is the cheapest quality gate the investment will ever pass — see the shift-left-economics Evolution Library entry.)<\/p>\n<h2>Assignment<\/h2>\n<p>Write an investment one-pager for one real AI funding decision in front of your org right now (or the one you'd most like to force to clarity). Use the five-block format. Every number must be measured or labeled as an estimate — no invented statistics.<\/p>\n<h3>Deliverables<\/h3>\n<ul>\n<li>ai-investment-one-pager.md: all five blocks, one page<\/li>\n<li>The three ownership questions answered with names<\/li>\n<li>A review date and the artifact that will exist if the investment works<\/li>\n<\/ul>"}, "D6": {"meta": {"id": "D6", "courseId": "leader-literacy", "tier": "native", "roleIds": ["leader"], "durationMin": 25, "creditHours": 1, "staircaseRung": 2, "buildsBehaviors": ["Tier 4 literacy: governs by action risk, not by tool bans", "Tier 4 literacy: sets the risk-tier policy and delegates its enforcement to architects"], "rubric": [{"criterion": "Risk classification", "emerging": "Policy governs tools ('approved AI tools list') rather than actions", "working": "Classifies AI actions into the four risk tiers with examples from own org", "strong": "Every tier has org-specific examples plus an explicit escalation path between tiers"}, {"criterion": "Proportionality", "emerging": "One rule for everything (all AI use needs approval / no AI use needs approval)", "working": "Requirements scale with tier — light touch at read-only, heavy at high-risk", "strong": "Requirements scale with tier and the policy names what is deliberately NOT governed"}, {"criterion": "Delegation boundary", "emerging": "Policy specifies technical enforcement details the leader can't evaluate", "working": "Policy states requirements; enforcement design is explicitly delegated", "strong": "Requirements + delegation + a named review cadence with the architects who enforce it"}], "title": "Governing AI: Risk Tiers Without the Architecture"}, "html": "<h1>Governing AI: Risk Tiers Without the Architecture<\/h1>\n<blockquote>\n<p>Second lesson in the leader literacy track — still not the architect track. D1 teaches practitioners to <em>build<\/em> governance infrastructure: approval flows, audit logs, rollback procedures. This lesson teaches you to <em>set the policy<\/em> that infrastructure enforces. You write the \"what\"; architects build the \"how.\"<\/p>\n<\/blockquote>\n<h2>Start Here: The Undo Test (5 minutes)<\/h2>\n<p>List five ways people in your org used AI this month (ask, don't guess). For each one, answer a single plain question: <strong>if the output was wrong, could the action be undone?<\/strong> A summary someone read — undone by re-reading. An email sent to a customer — not undone. A config change in production — depends entirely on what noticed it first.<\/p>\n<p>You've just performed risk-tier classification. Everything else in this lesson is vocabulary for what you just did.<\/p>\n<h2>The Four Risk Tiers<\/h2>\n<p>AI actions — not tools, actions — fall into four tiers, and this classification is the entire technical vocabulary you need:<\/p>\n<ol>\n<li><strong>Read-only<\/strong> — the AI looked at things and produced words a human will review: summaries, drafts, analyses. Wrong output costs a person some time.<\/li>\n<li><strong>Reversible<\/strong> — the AI changed something that can be cleanly undone: a document edit, a ticket update, a draft commit.<\/li>\n<li><strong>External<\/strong> — the AI's output left the building or crossed a boundary: sent to a customer, published, fed into another team's system. Undo is no longer clean.<\/li>\n<li><strong>High-risk<\/strong> — customers, money, production systems, regulators, or personal data are directly affected. Wrong output has consequences a rollback doesn't fix.<\/li>\n<\/ol>\n<p>The governing principle: <strong>requirements scale with tier.<\/strong> Read-only work should be nearly friction-free — over-governing it just drives usage underground and kills the Tier 1 habit-building your maturity strategy depends on. High-risk work gets human approval, logging, and a rollback plan, always.<\/p>\n<h2>Govern Actions, Not Tools<\/h2>\n<p>The most common governance mistake at leadership level is the tool ban (\"no ChatGPT\") or its twin, the tool blessing (\"Copilot is approved\"). Both govern the wrong noun. The same tool doing read-only summarization and drafting customer emails is operating at two different risk tiers — one deserves near-zero friction, the other deserves review. Policy written against tools ages badly (tools change monthly) and invites workarounds. Policy written against action risk stays true across every tool your org will ever adopt.<\/p>\n<h2>The Policy Draft and the Delegation Line<\/h2>\n<p>Your policy draft is one page: the four tiers with examples from your own org, what each tier requires (nothing / logging / human review / approval-plus-rollback), and one line stating what is deliberately ungoverned (say it out loud — silence reads as prohibition to a nervous Tier 1 workforce). Below that, the delegation line: enforcement design — the approval flows, audit logging, and eval pipelines that make the policy real — belongs to your D1-track architects, reviewed with you on a named cadence. If you find yourself specifying log formats, you've crossed into work you can't evaluate; step back up.<\/p>\n<h2>Assignment<\/h2>\n<p>Draft the risk-tier policy for your org. Classify at least eight real AI actions (from the Undo Test list and beyond) into the four tiers. State requirements per tier and the delegation line.<\/p>\n<h3>Deliverables<\/h3>\n<ul>\n<li>risk-tier-policy-draft.md: four tiers, org-specific examples, requirements per tier<\/li>\n<li>At least 8 real AI actions classified, including at least 1 you'd move to a <em>lower<\/em> tier than current practice treats it<\/li>\n<li>One sentence naming what is deliberately not governed<\/li>\n<li>The delegation line: who builds enforcement, and the review cadence with them<\/li>\n<\/ul>"}, "D7": {"meta": {"id": "D7", "courseId": "leader-literacy", "tier": "native", "roleIds": ["leader"], "durationMin": 25, "creditHours": 1, "staircaseRung": 3, "buildsBehaviors": ["Tier 4 literacy: measures maturity by observed behaviors and reused artifacts, not tool usage", "Tier 4 literacy: reads the tier-distribution gap against the role×tier target matrix and funds against it"], "rubric": [{"criterion": "Metric validity", "emerging": "Metrics count tool usage (logins, prompts sent, licenses active)", "working": "Metrics track behaviors and artifacts (diagnostic placements, certified workflows)", "strong": "Includes at least one reuse metric — artifacts consumed by someone other than their author"}, {"criterion": "Measurability", "emerging": "Metrics lack a measurement method ('track AI fluency')", "working": "Every metric has a source, method, and cadence", "strong": "Every metric has source, method, cadence, owner, and a stated decision it informs"}, {"criterion": "Gap orientation", "emerging": "Dashboard reports absolutes with no target", "working": "Reports current tier distribution against the role×tier target matrix", "strong": "Reports the gap, its trend, and ties each funded investment (D5) to the gap it closes"}], "title": "Measuring AI Maturity: The Dashboard Spec"}, "html": "<h1>Measuring AI Maturity: The Dashboard Spec<\/h1>\n<blockquote>\n<p>Last lesson in the leader literacy track. You've funded workflows (D5) and set the risk policy (D6); this lesson builds the instrument that tells you whether any of it is working. You will not build the dashboard — you will write the spec that makes it buildable, which is a rung-3 artifact: precise enough that someone else can implement it without asking you what you meant.<\/p>\n<\/blockquote>\n<h2>Start Here: The Vanity Audit (5 minutes)<\/h2>\n<p>Write down every AI number anyone has ever put in front of you: adoption rates, license utilization, prompts per week, \"engagement.\" For each, ask the only question that matters: <strong>if this number doubled, would anything about your org's work provably be better?<\/strong> Prompts-sent can double because people are flailing. Logins can double because of a mandate. Usage is what maturity looks like from too far away to see behavior.<\/p>\n<h2>Measure Behaviors, Not Usage<\/h2>\n<p>Your platform already defines maturity behaviorally — the Monday-Morning Diagnostic places people by five observable checks, and every lesson tags the behaviors it builds. So the measurement layer is already designed; the dashboard just reads it. The three metric families that mean something:<\/p>\n<ul>\n<li><strong>Placement:<\/strong> tier distribution by role, from real diagnostic intakes — not self-assessment, which over-places almost everyone.<\/li>\n<li><strong>Certification:<\/strong> artifacts graded against lesson rubrics — prompt libraries, chains, skills, context files. An artifact is evidence; a completed video is not.<\/li>\n<li><strong>Reuse:<\/strong> the true-north family. A prompt library <em>used by someone other than its author<\/em>, a skill run by a second team, a chain handed off. Reuse is the only metric that can't be gamed by enthusiasm, because it requires someone else to have found the artifact worth picking up.<\/li>\n<\/ul>\n<h2>The Gap Is the Dashboard<\/h2>\n<p>An absolute number (\"34% Tier 2\") is trivia. The dashboard's job is the <strong>gap<\/strong>: current tier distribution per role versus the role×tier target matrix in the maturity model, and the trend of that gap. This is also where D5 and D7 connect — every investment one-pager should name the gap it closes, and the dashboard should show whether it did. A leader reading this dashboard makes exactly three kinds of decision: fund something (a gap isn't closing), govern something (a risk metric moved), or celebrate something specific (a reuse number earned it).<\/p>\n<h2>The Spec Format<\/h2>\n<p>A dashboard spec is a contract, so it's structured: for each of five metrics — <strong>name, definition, source, measurement method, cadence, owner, and the decision it informs<\/strong>. If any field is blank, the metric isn't real yet. Two constraints: at least one metric from each family (placement, certification, reuse), and no metric that a tool vendor could report for you — if it comes free with a license, it's measuring the license, not your people.<\/p>\n<h2>Assignment<\/h2>\n<p>Write the maturity-metric dashboard spec for your org: five metrics, all seven fields each, at least one per family, gap-oriented against the target matrix. Hand it to someone technical and ask them one question: \"Could you build this without talking to me?\" Their answer is your grade.<\/p>\n<h3>Deliverables<\/h3>\n<ul>\n<li>maturity-dashboard-spec.md: 5 metrics × 7 fields (name, definition, source, method, cadence, owner, decision informed)<\/li>\n<li>At least one placement, one certification, and one reuse metric<\/li>\n<li>The gap view: current vs. role×tier targets, with trend<\/li>\n<li>One named vanity metric you are explicitly declining to track, and why<\/li>\n<\/ul>"}, "D8": {"meta": {"id": "D8", "courseId": "leader-literacy", "tier": "native", "roleIds": ["leader"], "durationMin": 20, "creditHours": 1, "stairc
