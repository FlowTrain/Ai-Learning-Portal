aseRung": 2, "buildsBehaviors": ["Tier 4 literacy: directs AI investment to context, standards, and documents rather than to usage volume or seat count", "Tier 4 literacy: measures adoption by completed work product from non-engineers, not by seats deployed"], "rubric": [{"criterion": "Investment aimed at the asset", "emerging": "Assumes usage or more seats will create the capability", "working": "Directs spend toward context, standards, and documents", "strong": "Names the specific document or asset that would carry the knowledge, and who owns it"}, {"criterion": "Adoption measured honestly", "emerging": "Counts seats deployed", "working": "Counts completed work product by non-engineers", "strong": "Names the specific work product and how they would see it get reused"}, {"criterion": "Front door vs. workshop", "emerging": "Expects one tool to do everything", "working": "Classifies the need as Q&A/triggering (front door) or artifact-building (workshop)", "strong": "Matches the tool to the job and can say what the other kind of tool is for"}], "title": "What Leaders Get Wrong About AI"}, "html": "<h1>What Leaders Get Wrong About AI<\/h1>\n<blockquote>\n<p>You funded the rollout. Seats are deployed, the dashboard says adoption is climbing, and yet six months in the only people finishing real work with it are the engineers who'd have figured it out on their own. That's not a model problem, and it's usually not a people problem. It's four quiet beliefs that send an AI budget to the wrong place. This is literacy, not architecture — you're learning to fund it, measure it, and place it well, so your architects build the right thing.<\/p>\n<\/blockquote>\n<h2>Start Here: Name the Payoff You Assumed (5 minutes)<\/h2>\n<p>Take one AI investment you've made or are weighing — a license rollout, a pilot, a platform. Write, in one line, the payoff you assumed it would produce. Hold that line; we'll test it against four things that are easy to get backwards.<\/p>\n<h2>Usage Doesn't Teach It (5 minutes)<\/h2>\n<p>The most expensive assumption is that the tool learns your organization the more you use it. It doesn't. The model's knowledge is fixed; nothing about it changes between sessions from your usage. What improves is the <em>context you supply<\/em> — your standards, your templates, your examples — and that improvement lives in those documents, not in usage volume.<\/p>\n<p>The frame that keeps the money in the right place: you're not training a colleague who gets to know you over time. You're writing very good onboarding docs for an extremely fast contractor with no memory. <strong>The docs are the asset.<\/strong> Fund the context and the standards, not the hope that more clicks accrue institutional knowledge.<\/p>\n<h2>Seats Aren't Adoption (5 minutes)<\/h2>\n<p>Seats deployed behind a tool that no one outside engineering voluntarily opens is not adoption — it's shelfware with a login. The only measure that means anything is <em>completed work product by people who aren't engineers<\/em>.<\/p>\n<p>So the question for your next review isn't how many licenses are active. It's: <strong>how many people outside engineering finished something real with it last month?<\/strong> If that number is small, more seats won't fix it, and neither will more training — the gap is usually that the tool never met them in the work they already do.<\/p>\n<h2>One Tool Isn't the Front Door for Everything (5 minutes)<\/h2>\n<p>The last one is a category error. There are two different jobs, and one tool rarely does both well. A <strong>reception desk<\/strong> answers role-based questions and triggers workflows, lands where people already are, and is governed centrally — excellent, and not the same thing as a <strong>workshop<\/strong> that builds real artifacts through an iterate-and-verify loop. Someone always asks the reception desk to produce a spec, and is always disappointed. Decide which one you're funding before the pilot, not after.<\/p>\n<p>And when someone hands you a recommendation by brand — \"we'll use Copilot\" — ask <em>which<\/em> one. Products that share a name can behave completely differently, and the specifics change fast; that's a question for your architects, not an assumption to fund on.<\/p>\n<h2>Assignment<\/h2>\n<p>Pressure-test one real AI investment against the four.<\/p>\n<h3>Deliverables<\/h3>\n<ul>\n<li><code>ai-investment-read.md<\/code> — for one AI spend:<\/li>\n<li><strong>where the value actually accrues<\/strong> (context/standards/documents vs. \"the tool will learn us\")<\/li>\n<li><strong>the adoption measure that means something<\/strong> (work finished by non-engineers, named specifically)<\/li>\n<li><strong>a front-door-vs-workshop call<\/strong> — which job is this, and what's the other kind of tool for<\/li>\n<li>One line: something you'll <strong>stop<\/strong> funding because this read exposed it as the wrong bet<\/li>\n<\/ul>"}}, "library": {}, "diagnostic": {"id": "monday-morning-diagnostic", "version": "1.1", "source": "docs/maturity-model.md — Placement: the Monday-Morning Diagnostic", "principle": "Place by observed behavior, not self-assessment. Self-assessment over-places almost everyone. Every question demands evidence, not opinion.", "checks": [{"id": "q1_unprompted_use", "question": "Did you reach for an AI tool this week without being told or reminded to?", "evidencePrompt": "Tell me about the last time. What was the task?", "options": ["no", "yes"]}, {"id": "q2_prompt_shape", "question": "When you ask an AI for something, do you routinely tell it the context, the task, and who the output is for?", "evidencePrompt": "Show me (or recite) a recent prompt you actually used.", "options": ["no", "yes"]}, {"id": "q3_reuse", "question": "Do you use a prompt library or shared templates — and do you maintain or curate one?", "evidencePrompt": "Show me the library. When was it last updated, and by whom?", "options": ["none", "use", "maintain"]}, {"id": "q4_workflow_design", "question": "Have you defined a repeatable AI workflow that someone else runs?", "evidencePrompt": "Who runs it? Show me the documentation they run it from.", "options": ["no", "yes"]}, {"id": "q5_system_design", "question": "Have you built schemas, evaluation pipelines, or governance that others operate within?", "evidencePrompt": "Show me the artifact and name one person constrained by it.", "options": ["no", "yes"]}], "placementRule": {"type": "conjunctive-ladder", "description": "A tier is awarded only when its gate AND every lower gate passes. Higher-tier answers with failed lower gates are disregarded for placement (ambiguity routes to the lower tier by rule) and emitted as flags for coach follow-up.", "gates": {"tier2": "q1_unprompted_use == 'yes' AND q2_prompt_shape == 'yes'", "tier3": "tier2 AND q3_reuse == 'maintain' AND q4_workflow_design == 'yes'", "tier4": "tier3 AND q5_system_design == 'yes'"}, "resolution": "tier = 4 if tier4 else 3 if tier3 else 2 if tier2 else 1"}, "flags": [{"id": "orphan_system_design", "when": "q5_system_design == 'yes' AND placement < 4", "meaning": "Claims system design without the fluency ladder beneath it. Verify the artifact — possible over-claim, or possible mis-scored lower checks."}, {"id": "orphan_workflow_design", "when": "q4_workflow_design == 'yes' AND placement < 3", "meaning": "Claims a workflow others run, but doesn't maintain a library or lacks Tier 2 habits. Ask who actually runs it."}, {"id": "orphan_curation", "when": "q3_reuse == 'maintain' AND placement < 2", "meaning": "Curates a library without unprompted use or structured prompts. Likely inherited ownership rather than practice — verify the update history."}], "routing": {"description": "recommendedCourse = routing[tier][roleId]. Course is the bridge that STARTS at the placed tier.", "tiers": {"1": {"pm": "aware-foundations", "coach": "aware-foundations", "designer": "aware-foundations", "leader": "aware-foundations", "engineer": "aware-eng", "tl": "aware-eng", "data": "aware-eng"}, "2": {"pm": "enabled-pm", "coach": "enabled-pm", "designer": "enabled-design", "leader": "leader-literacy", "engineer": "enabled-eng", "tl": "enabled-eng", "data": "enabled-eng"}, "3": {"pm": "fluent-chains", "designer": "fluent-chains", "engineer": "fluent-chains", "data": "fluent-chains", "coach": "native-systems", "tl": "native-systems", "leader": "native-systems"}, "4": {"pm": "native-systems", "coach": "native-systems", "designer": "native-systems", "leader": "native-systems", "engineer": "native-systems", "tl": "native-systems", "data": "native-systems"}}, "notes": {"leader_tier2": "A leader placed at Tier 2 has hit the habits half of their target (Tier 2 + Tier 4 literacy, per the role×tier matrix); the remaining program is the literacy strand. Routes to leader-literacy (D5–D7). Interim enabled-pm route retired 2026-07-10 when BACKLOG 5 shipped.", "tier3_non_coach_track": "pm/designer/engineer/data placed at Tier 3 route to fluent-chains for artifact certification — placement is behavioral, but tier standing requires the artifacts (assessment = artifacts + observed behavior). tl/leader/coach route to native-systems, their 3→4 bridge.", "tier4": "All roles route to native-systems. Roles outside its roleIds (pm/designer/engineer/data) join as case-study contributors / Evolution Library curator candidates rather than cohort members — coach discretion, but the course id is always valid."}}}, "teasers": {"id": "architect-zone-teasers", "version": "1.1", "purpose": "Interest-gathering stubs for the Tier 4 architect-track depth (BACKLOG 6, deferred by owner decision 2026-07-10). Clickable marketing cards, not lessons. Every click is a demand signal — see docs/interest-capture.md for what the signals decide. Teaser topics informed by the Quantic MSAIE Class of Nov 2027 cohort syllabus (owner-provided, 2026-07).", "zoneTitle": "The Architect Track — In the Workshop", "zoneIntro": "The deep end of the platform: designing, evaluating, and governing AI systems at production scale. These modules are being built from real platform work — not textbook exercises. Tap what you'd take. We build in order of demand.", "teasers": [{"id": "t-case-platform", "title": "Case Study: Building This Platform", "hook": "The learning platform you're using was designed, evaluated, and governed with the exact practices it teaches. Walk through the real decisions — including the ones that went wrong.", "plannedTier": "native", "audience": ["tl", "leader", "coach", "engineer"], "backlogRef": "BACKLOG 6 (owner-authored case study)", "status": "interest-gathering"}, {"id": "t-eval-harness", "title": "Capstone Lab: Design an Evaluation Harness", "hook": "Pick one workflow your team runs with AI today. Leave with a working eval pipeline that tells you — before your users do — when it quietly gets worse.", "plannedTier": "native", "audience": ["tl", "engineer", "data"], "backlogRef": "BACKLOG 6 (capstone)", "status": "interest-gathering"}, {"id": "t-governance-drill", "title": "Governance Drill: The Model Update That Breaks Things", "hook": "A tabletop exercise: the vendor ships a model update overnight and three of your AI workflows start behaving differently. Who notices, who decides, who rolls back? Find out before it's real.", "plannedTier": "native", "audience": ["tl", "leader", "coach"], "backlogRef": "BACKLOG 6 (governance simulation)", "status": "interest-gathering"}, {"id": "t-agentic-workflows", "title": "Agentic Workflow Engineering", "hook": "Beyond chains: planner, implementer, tester, reviewer — designing multi-agent workflows with bounded scopes, tool contracts, and failure protocols that survive contact with production.", "plannedTier": "native", "audience": ["tl", "engineer", "data"], "backlogRef": "Quantic MSAIE capability area; agent-orchestration Evolution Library entry (published 2026-07-10)", "status": "interest-gathering"}, {"id": "t-foundation-integration", "title": "Foundation Model Integration Patterns", "hook": "Model selection, fallback tiers, caching, and the rowboat-vs-speedboat economics of routing work between small local models and frontier ones.", "plannedTier": "native", "audience": ["tl", "engineer", "data"], "backlogRef": "Quantic MSAIE capability area; token-economics Evolution Library entry (published 2026-07-10)", "status": "interest-gathering"}, {"id": "t-intelligent-infrastructure", "title": "Scaling Intelligent Infrastructure", "hook": "What changes when it's not one workflow but forty: observability, prompt/version control, drift detection, and the platform team that keeps organizational AI honest.", "plannedTier": "native", "audience": ["tl", "leader", "engineer"], "backlogRef": "Quantic MSAIE capability area; D-series expansion", "status": "interest-gathering"}, {"id": "t-fine-tuning-decision", "title": "Fine-Tune or Prompt? The Shape-the-Model Decision", "hook": "Sometimes the answer isn't a better prompt or more context — it's changing the model itself. When fine-tuning beats prompting, what it costs, and why it's usually the wrong first move.", "plannedTier": "native", "audience": ["tl", "engineer", "data", "leader"], "backlogRef": "Gap identified from Quantic MSAIE syllabus (ML → AI Model Fine-Tuning block); no current-catalog analog", "status": "interest-gathering"}]}};

// ---------- state ----------
const store = {
  get role() { return localStorage.getItem('role') || ''; },
  set role(v) { localStorage.setItem('role', v); renderBadge(); },
  get tier() { return localStorage.getItem('placedTier') || ''; },
  set tier(v) { localStorage.setItem('placedTier', v); renderBadge(); },
  interest() { return JSON.parse(localStorage.getItem('interest') || '{}'); },
  saveInterest(o) { localStorage.setItem('interest', JSON.stringify(o)); },
  // the learner's own red lines — their A5 artifact, kept so it can appear at the moment of pasting
  get redlines() { return localStorage.getItem('redlines') || ''; },
  set redlines(v) { localStorage.setItem('redlines', v); },
  subs() { return JSON.parse(localStorage.getItem('submissions') || '[]'); },
  saveSubs(a) { localStorage.setItem('submissions', JSON.stringify(a)); }
};
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function roleTitle(id) { const r = DATA.roles.find(r => r.id === id); return r ? r.title : id; }
// Where am I, and what's next? Order comes from courses.json — never hardcoded here.
// Prefer the course that matches the learner's role (A0/A5–A8 sit in both aware courses).
function lessonNav(id) {
  const l = DATA.lessons[id];
  const holders = DATA.courses.filter(c => c.lessonIds.includes(id));
  const course = holders.find(c => store.role && c.roleIds.includes(store.role))
    || holders.find(c => c.id === l.meta.courseId) || holders[0]
    || DATA.courses.find(c => c.id === l.meta.courseId);
  if (!course) return { course: { id: l.meta.courseId, title: l.meta.courseId }, prev: null, next: null, pos: '' };
  const ids = course.lessonIds, i = ids.indexOf(id);
  const at = k => (k >= 0 && k < ids.length && DATA.lessons[ids[k]])
    ? { id: ids[k], title: DATA.lessons[ids[k]].meta.title } : null;
  return { course, prev: at(i - 1), next: at(i + 1), pos: i >= 0 ? `lesson ${i + 1} of ${ids.length}` : '' };
}
function renderBadge() {
  const el = document.getElementById('rolebadge');
  el.innerHTML = store.role ? `Role: <b>${esc(roleTitle(store.role))}</b>${store.tier ? ` · Placed: <b>Tier ${esc(store.tier)}</b>` : ''}` : 'No role selected';
}

// ---------- interest capture (see docs/interest-capture.md) ----------
function track(teaserId, event, extra) {
  const o = store.interest();
  o[teaserId] = o[teaserId] || { views: 0, opens: 0, notify: [] };
  if (event === 'view') o[teaserId].views++;
  if (event === 'open') o[teaserId].opens++;
  if (event === 'notify') o[teaserId].notify.push(Object.assign({ ts: new Date().toISOString() }, extra));
  store.saveInterest(o);
}
function exportInterest() {
  const blob = new Blob([JSON.stringify({ exported: new Date().toISOString(), role: store.role, placedTier: store.tier, data: store.interest() }, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'interest-signals.json';
  a.click();
}

// No accounts, no server, no notifications. Rubrics are read from lesson frontmatter and
// snapshotted at hand-in time, so a coach always grades against what the learner was actually shown.
// The staircase rule applies to the chrome, not just the lessons (owner finding, 2026-07-17):
// the first version of this panel announced "You haven't saved your red lines yet" to a learner on
// lesson 1 — scolding them about a concept they don't meet until lesson 3. Unmet vocabulary, framed
// as a failure, aimed at the population least sure it belongs here. Now: a quiet universal line by
// default; the learner's own card only once they have one.
function redlinesPanel() {
  const rl = store.redlines;
  if (rl) return `<div class="redlines"><b>Before you paste — your red lines:</b>${esc(rl)}
    <div class="rowbar"><button class="ghost" onclick="editRedlines()">Edit</button></div></div>`;
  return `<p class="muted">Before you paste: nothing confidential. If you'd hesitate to read it aloud, don't paste it.
    <button class="ghost" onclick="showRedlinesEditor()" style="margin-left:6px">Add my red lines</button></p>
    <div id="rl-box" style="display:none"><div class="redlines">
      <b>Your red lines</b>Three to five lines — what never goes in, and what you do instead. Once saved, they show up here every time you hand something in.
      <textarea id="rl-edit" placeholder="e.g. Anything with a customer's name in it — instead, I strip the names first."></textarea>
      <div class="rowbar"><button class="ghost" onclick="saveRedlines()">Save</button></div>
    </div></div>`;
}
function showRedlinesEditor() {
  const b = document.getElementById('rl-box');
  b.style.display = 'block';
  document.getElementById('rl-edit').focus();
}
function saveRedlines() { const v = document.getElementById('rl-edit').value.trim(); if (v) { store.redlines = v; render(); } }
function editRedlines() { store.redlines = ''; render(); }

function handIn(id) {
  const l = DATA.lessons[id];
  const ta = document.getElementById('artifact-in');
  const artifact = (ta.value || '').trim();
  if (!artifact) { alert('Paste or upload your artifact first.'); return; }
  const subs = store.subs();
  subs.push({
    lessonId: id, lessonTitle: l.meta.title, courseId: l.meta.courseId, tier: l.meta.tier,
    role: store.role || 'unknown', placedTier: store.tier || 'unplaced',
    artifact,
    rubric: l.meta.rubric || null, // snapshot: grade against what the learner was shown
    submittedAt: new Date().toISOString()
  });
  store.saveSubs(subs);
  render();
}
function uploadArtifact(ev) {
  const f = ev.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => { document.getElementById('artifact-in').value = r.result; };
  r.readAsText(f);
}
function exportSubs() {
  const blob = new Blob([JSON.stringify({ exported: new Date().toISOString(), submissions: store.subs() }, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'hand-ins.json';
  a.click();
}
function importSubs(ev) {
  const f = ev.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const o = JSON.parse(r.result);
      const incoming = Array.isArray(o) ? o : (o.submissions || []);
      if (!incoming.length) { alert('No hand-ins found in that file.'); return; }
      store.saveSubs(store.subs().concat(incoming));
      render();
    } catch (e) { alert('That file could not be read as hand-ins.'); }
  };
  r.readAsText(f);
}
// ci is the criterion's index in the snapshotted rubric — passing the index, not the string,
// keeps quotes out of the inline handler and out of everyone's afternoon.
function grade(i, ci, level) {
  const subs = store.subs();
  const s = subs[i];
  const criterion = (s.rubric || [])[ci] && (s.rubric || [])[ci].criterion;
  if (!criterion) return;
  s.grades = s.grades || [];
  const row = s.grades.find(g => g.criterion === criterion);
  if (row) row.level = level; else s.grades.push({ criterion, level });
  s.gradedAt = new Date().toISOString();
  store.saveSubs(subs);
  render();
}
function saveNote(i) {
  const subs = store.subs();
  const next = document.getElementById('next-' + i).value.trim();
  const anyEmerging = (subs[i].grades || []).some(g => g.level === 'emerging');
  // The judge's constitution requires exactly one next step, and "emerging" may never appear without
  // the concrete move to "working". The human worksheet is held to the same contract — otherwise the
  // gold set wouldn't match the judge's output shape and the agreement test couldn't compare them.
  if (anyEmerging && !next) {
    alert('This hand-in is marked emerging on at least one criterion.\n\nEmerging is a position on a staircase, not a verdict — so it needs the one concrete step that gets them to working. Add it before saving.');
    document.getElementById('next-' + i).focus();
    return;
  }
  subs[i].nextStep = next;
  subs[i].misconception = document.getElementById('mis-' + i).value;
  subs[i].gradedBy = document.getElementById('by-' + i).value;
  subs[i].gradedAt = new Date().toISOString();
  store.saveSubs(subs);
  const el = document.getElementById('saved-' + i);
  if (el) el.textContent = 'Saved.';
}
function dropSub(i) {
  if (!confirm('Remove this hand-in from this browser? This cannot be undone.')) return;
  const subs = store.subs(); subs.splice(i, 1); store.saveSubs(subs); render();
}

// ---------- diagnostic (pure data from content/diagnostic.json) ----------
function placeTier(ans) { // conjunctive ladder per placementRule
  const t2 = ans.q1_unprompted_use === 'yes' && ans.q2_prompt_shape === 'yes';
  const t3 = t2 && ans.q3_reuse === 'maintain' && ans.q4_workflow_design === 'yes';
  const t4 = t3 && ans.q5_system_design === 'yes';
  return t4 ? 4 : t3 ? 3 : t2 ? 2 : 1;
}
function diagFlags(ans, tier) {
  const f = [];
  if (ans.q5_system_design === 'yes' && tier < 4) f.push(DATA.diagnostic.flags[0]);
  if (ans.q4_workflow_design === 'yes' && tier < 3) f.push(DATA.diagnostic.flags[1]);
  if (ans.q3_reuse === 'maintain' && tier < 2) f.push(DATA.diagnostic.flags[2]);
  return f;
}

// ---------- views ----------
const views = {

  },

  course(id) {

    return `<h2><span class="tierchip tier-${c.tier}">${c.tier}</span>${esc(c.title)}</h2>

    ${c.lessonIds.map(lid => {
      const l = DATA.lessons[lid];
      return l ? `<div class="card clickable" onclick="location.hash='#/lesson/${lid}'">
        <b>${lid} — ${esc(l.meta.title)}</b><br>
        <span class="muted">${l.meta.durationMin} min · rung ${l.meta.staircaseRung || '?'}</span>
      </div>` : '';
    }).join('')}`;
  },

  lesson(id) {
    const l = DATA.lessons[id];
    if (!l) return '<p>Lesson not found.</p>';
    const refs = (l.meta.libraryRefs || []).map(r => `<a href="#/library/${r}">${esc(r)}</a>`).join(', ');
    const mine = store.subs().filter(s => s.lessonId === id);
    const nav = lessonNav(id);
    return `<p><a href="#/course/${nav.course.id}">← ${esc(nav.course.title)}</a></p>
    <span class="tierchip tier-${l.meta.tier}">${l.meta.tier}</span>
    <span class="muted">${l.meta.durationMin} min · staircase rung ${l.meta.staircaseRung || '—'}${nav.pos ? ' · ' + nav.pos : ''}${refs ? ' · library: ' + refs : ''}</span>
    <div class="lesson-body">${l.html}</div>
    <div class="card handin">
      <h3>Hand in your artifact</h3>
      <p class="muted">Your coach reads this and talks it through with you. There's no score and nothing to pass or fail — the rubric describes where a thing is, not how good you are.</p>
      ${redlinesPanel()}
      <textarea id="artifact-in" placeholder="Paste your artifact here — or upload the file you made."></textarea>
      <div class="rowbar">
        <button onclick="handIn('${id}')">Hand in</button>
        <label class="btn ghost" style="display:inline-block">Upload a file<input type="file" accept=".md,.txt,.json" onchange="uploadArtifact(event)" style="display:none"></label>
        <span class="muted">Stays in this browser until you export it.</span>
      </div>
      ${mine.length ? `<div class="donebox">
        <b>✓ Handed in.</b> Nothing else to do here — your coach picks it up and you'll talk it through together. <b>You don't need to wait for that to keep going.</b>
        ${nav.next ? `<div class="rowbar"><a class="btn" href="#/lesson/${nav.next.id}">Next: ${nav.next.id} — ${esc(nav.next.title)} →</a></div>`
                   : `<div class="rowbar"><a class="btn" href="#/course/${nav.course.id}">That's the last one — back to ${esc(nav.course.title)}</a></div>`}
      </div>` : ''}
      ${l.meta.rubric ? '' : '<p class="muted" style="margin-top:14px">This lesson has no rubric yet, so your coach will read it in prose rather than against criteria.</p>'}
    </div>
    <div class="rowbar lessonnav">
      ${nav.prev ? `<a class="btn ghost" href="#/lesson/${nav.prev.id}">← ${nav.prev.id}</a>` : '<span></span>'}
      <a class="btn ghost" href="#/course/${nav.course.id}">All lessons</a>
      ${nav.next ? `<a class="btn ghost" href="#/lesson/${nav.next.id}">${nav.next.id} →</a>` : '<span></span>'}
    </div>`;
  },

  worksheet() {
    const subs = store.subs();
    const head = `<h2>Coach worksheet</h2>
    <p class="muted">Hand-ins from this browser. Grade against the lesson's own rubric — the one the learner was shown when they handed it in. <b>Emerging is a position on a staircase, not a verdict.</b> Say what you saw, then give one next step.</p>
    <div class="rowbar">
      <label class="btn ghost" style="display:inline-block">Import hand-ins<input type="file" accept=".json" onchange="importSubs(event)" style="display:none"></label>
      <button class="ghost" onclick="exportSubs()">Export all</button>
      <span class="muted">${subs.length} hand-in${subs.length === 1 ? '' : 's'} · nothing leaves this browser unless you export it.</span>
    </div>`;
    if (!subs.length) return head + `<div class="card"><p class="muted">Nothing handed in yet. Learners hand in from the bottom of any lesson page — or import a file someone exported.</p></div>`;
    return head + subs.map((s, i) => {
      const rubric = s.rubric || [];
      const got = c => (s.grades || []).find(g => g.criterion === c);
      return `<div class="card">
        <div class="subitem">
          <span class="tierchip tier-${s.tier}">${s.tier}</span>
          <b>${esc(s.lessonId)} — ${esc(s.lessonTitle)}</b>
          ${s.gradedAt ? '<span class="graded">✓ graded</span>' : ''}
        </div>
        <p class="muted">${roleTitle(s.role)} · placed ${esc(s.placedTier)} · handed in ${new Date(s.submittedAt).toLocaleString()}</p>
        <div class="artifact">${esc(s.artifact)}</div>
        ${rubric.length ? rubric.map((c, ci) => `<div class="crit">
          <b>${esc(c.criterion)}</b>
          <div class="lvls">
            ${['emerging', 'working', 'strong'].map(lv => `<label class="lvl ${got(c.criterion) && got(c.criterion).level === lv ? 'sel' : ''}">
              <input type="radio" name="g-${i}-${ci}" ${got(c.criterion) && got(c.criterion).level === lv ? 'checked' : ''}
                onchange="grade(${i}, ${ci}, '${lv}')">
              <span class="lvl-name">${lv}</span><span>${esc(c[lv] || '')}</span>
            </label>`).join('')}
          </div>
        </div>`).join('')
        : '<p class="muted">No rubric on this lesson — read it in prose and note what you saw below.</p>'}
        <label class="opt"><b>One next step</b> — the single thing they do next. Required: nothing here may be marked <i>emerging</i> without it.
          <textarea id="next-${i}" placeholder="One concrete move. Not three. What does 'working' look like from where they are — and what's the one action that gets them there?">${esc(s.nextStep || '')}</textarea></label>
        <label class="opt muted">Misconception observed — optional, and it isn't about the learner. This feeds the misconception log and gets the <i>lesson</i> fixed.
          <textarea id="mis-${i}" placeholder="What did the lesson fail to make clear? This is a content defect report.">${esc(s.misconception || '')}</textarea></label>
        <div class="rowbar">
          <input id="by-${i}" placeholder="Your name (optional)" value="${esc(s.gradedBy || '')}" style="font-family:system-ui,sans-serif;font-size:.85rem;padding:8px;border:1px solid var(--line);border-radius:8px">
          <button onclick="saveNote(${i})">Save</button>
          <button class="ghost" onclick="dropSub(${i})">Remove</button>
          <span class="muted" id="saved-${i}"></span>
        </div>
      </div>`;
    }).join('');
  },

  library(id) {
    if (id) {
      const e = DATA.library[id];
      if (!e) return '<p>Entry not found.</p>';
      return `<p><a href="#/library">← Evolution Library</a></p>
      <span class="muted">status: ${esc(e.meta.status)} · last reviewed ${esc(e.meta.last_reviewed)} · ${esc(e.meta.review_cadence)}</span>
      <div class="entry-body">${e.html}</div>`;
    }
    return `<h2>The Evolution Library</h2>
    <p class="muted">Practices are versioned, not eternal. Each entry tracks how a practice changed as models changed — what's current, what's deprecated, and where the old way is still right.</p>
    ${Object.values(DATA.library).map(e => `<div class="card clickable" onclick="location.hash='#/library/${e.meta.id}'">
      <b>${esc(e.meta.practice)}</b> <span class="muted">(${esc(e.meta.id)})</span><br>
      <span class="muted">status: ${esc(e.meta.status)} · reviewed ${esc(e.meta.last_reviewed)} · cited by ${esc((e.meta.referenced_by || []).join(', '))}</span>
    </div>`).join('')}`;
  },

  architect() {
    const t = DATA.teasers;
    t.teasers.forEach(x => track(x.id, 'view'));
    return `<h2>${esc(t.zoneTitle)}</h2>
    <p class="muted">${esc(t.zoneIntro)}</p>
    ${t.teasers.map(x => {
      const done = (store.interest()[x.id] || { notify: [] }).notify.length > 0;
      return `<div class="card clickable teaser" id="${x.id}" onclick="openTeaser('${x.id}')">
        <span class="tierchip tier-${x.plannedTier}">${x.plannedTier} · coming</span><b>${esc(x.title)}</b>
        <div class="hook"><p>${esc(x.hook)}</p>

                 : `<button onclick="event.stopPropagation();notifyMe('${x.id}')">Notify me when this exists</button>`}
        </div>
      </div>`;

    <div class="zonebar"><span class="muted">Signals stay in this browser until exported.</span>
    <button class="ghost" onclick="exportInterest()">Export interest data</button></div>`;
  }
};

function openTeaser(id) {
  const el = document.getElementById(id);
  if (!el.classList.contains('open')) { el.classList.add('open'); track(id, 'open'); }
}
function notifyMe(id) {
  track(id, 'notify', { role: store.role || 'unknown', placedTier: store.tier || 'unplaced' });
  render();
}
function submitDiag(ev) {
  ev.preventDefault();
  const f = new FormData(ev.target), ans = {};
  DATA.diagnostic.checks.forEach(c => ans[c.id] = f.get(c.id));
  const tier = placeTier(ans);
  store.tier = String(tier);
  const routes = (DATA.diagnostic.routing.tiers || {})[String(tier)] || {};
  const course = routes[store.role];
  const c = course ? DATA.courses.find(x => x.id === course) : null;
  const flags = diagFlags(ans, tier);
  document.getElementById('diagresult').innerHTML = `<div class="card">
    <h3>Placement: Tier ${esc(tier)}</h3>
    ${c ? `<p>Recommended course:</p>
    <div class="card clickable" onclick="location.hash='#/course/${course}'">
      <span class="tierchip tier-${c.tier}">${c.tier}</span><b>${esc(c.title)}</b>
      <p class="muted">${esc(c.description)}</p></div>`
      : `<p class="muted">We don't have a course mapped for this tier and role yet — your coach will route you from here.</p>`}
    ${flags.map(fl => `<div class="flag"><b>To discuss with your coach:</b> ${esc(fl.meaning)}</div>`).join('')}
    <p class="muted">Placement is confirmed by a coach against your evidence — this is a starting point, not a verdict.</p>
  </div>`;
  document.getElementById('diagresult').scrollIntoView({ behavior: 'smooth' });
  return false;
}

// ---------- router ----------
function render() {
  const [_, view, arg] = (location.hash || '#/').split('/');
  const v = view || 'home';
  const fn = { '': 'home', 'diagnostic': 'diagnostic', 'catalog': 'catalog', 'course': 'course', 'lesson': 'lesson', 'library': 'library', 'architect': 'architect', 'worksheet': 'worksheet' }[v] || 'home';
  document.getElementById('app').innerHTML = views[fn](arg);
  document.querySelectorAll('nav a').forEach(a => a.classList.toggle('active', a.dataset.nav === fn || (fn === 'course' || fn === 'lesson') && a.dataset.nav === 'catalog'));
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', render);
renderBadge();
render();
</script>
